<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Gestor Jorge Zensque</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .box { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 12px; border-top: 10px solid #0056b3; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-wa { background: #25d366; color: white; padding: 15px; border-radius: 8px; text-decoration: none; font-weight: bold; display: block; text-align: center; margin-bottom: 20px; }
        .btn-liberar { background: #f39c12; color: white; padding: 15px; border-radius: 8px; text-decoration: none; font-weight: bold; display: block; text-align: center; margin-bottom: 20px; border: none; width: 100%; cursor: pointer; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 8px; text-align: center; min-height: 450px; }
        canvas { max-height: 280px !important; width: 100% !important; }
        .pixar-container { display: flex; justify-content: center; align-items: center; flex-direction: column; margin-top: 10px; min-height: 130px; }
        .pixar-img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #0056b3; object-fit: cover; }
        .pixar-label { font-weight: bold; color: #0056b3; font-size: 0.9em; margin-top: 5px; text-transform: uppercase; }
        .controles { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        select { padding: 12px; width: 60%; border-radius: 6px; border: 1px solid #0056b3; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9em; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #0056b3; color: white; }
        .btn-refresh { padding: 10px 20px; cursor: pointer; background: #0056b3; color: white; border: none; border-radius: 6px; font-weight: bold; }
        .btn-delete { color: red; cursor: pointer; border: 1px solid red; background: none; padding: 5px 10px; border-radius: 4px; }
    </style>
</head>
<body>

<script>
    // TRAVA DE SEGURANÇA
    const SENHA_MESTRE = "Miraiotsuru@2026#Z";
    let acesso = prompt("Digite a senha de acesso ao Painel Gestor:");
    if (acesso !== SENHA_MESTRE) {
        alert("Senha incorreta!");
        document.body.innerHTML = "<h1 style='text-align:center;'>Acesso Restrito</h1>";
        throw new Error("Acesso negado");
    }
</script>

<div class="box">
    <h2 style="text-align:center; color: #0056b3;">PAINEL - GESTOR JORGE ZENSQUE</h2>
    
    <a href="#" id="linkWA" class="btn-wa" target="_blank">📲 ENVIAR LINK PADRÃO (WHATSAPP)</a>
    <button onclick="gerarLinkReset()" class="btn-liberar">🔓 GERAR LINK PARA REFAZER TESTE (LIMPAR TRAVA)</button>

    <div class="controles">
        <select id="selectJovem" onchange="atualizarGraficosIndividuais()"><option value="">Selecione um jovem...</option></select>
        <button class="btn-refresh" onclick="carregarDados()">🔄 Atualizar Dados</button>
    </div>

    <div class="dashboard">
        <div class="card">
            <h3>Individual: SAP (Radar)</h3>
            <canvas id="chartSapInd"></canvas>
        </div>
        <div class="card">
            <h3>Individual: Perfil DISC</h3>
            <div id="fotoInd" class="pixar-container"></div>
            <canvas id="chartDiscInd"></canvas>
        </div>
        <div class="card">
            <h3>Turma: Média SAP Geral</h3>
            <canvas id="chartSapGeral"></canvas>
        </div>
        <div class="card">
            <h3>Turma: Perfil Geral (DISC)</h3>
            <div id="fotoGeral" class="pixar-container"></div>
            <canvas id="chartDiscGeral"></canvas>
        </div>
    </div>

    <div style="display: flex; gap: 10px; margin-top: 20px; margin-bottom: 10px;">
        <button class="btn-refresh" style="background: #2c3e50; flex: 1;" onclick="window.print()">🖨️ Imprimir PDF</button>
        <button class="btn-refresh" style="background: #27ae60; flex: 1;" onclick="exportarExcel()">📊 Exportar para Excel</button>
    </div>

    <table>
        <thead><tr><th>Nome</th><th>Valores SAP</th><th>DISC</th><th>Ação</th></tr></thead>
        <tbody id="corpoTabela"></tbody>
    </table>
</div>

<script>
    const URL_API = "https://script.google.com/macros/s/AKfycbwua4hn4gHs053z4_17z3JvBO2C_8jyTSrjD4vFIas0SsNUjIeUEnBbe5lO2RDGuzzJ/exec";
    const BICHOS = { 'D': 'D.png', 'I': 'I.png', 'S': 'S.png', 'C': 'C.png' };
    const urlBase = window.location.href.split('resultados.html')[0];
    document.getElementById("linkWA").href = "https://api.whatsapp.com/send?text=Olá! Preencha o teste: " + urlBase + "teste.html";

    let dadosGlobais = [];
    let charts = {};

    function limparDadosPlanilha(texto) {
        let partes = texto.replace(/--/g, '-').split('-').filter(p => p !== "" && p !== " ").map(v => Math.abs(parseFloat(v)));
        while(partes.length < 4) partes.push(0);
        return partes.slice(0, 4);
    }

    async function carregarDados() {
        try {
            const res = await fetch(URL_API);
            dadosGlobais = await res.json();
            const select = document.getElementById('selectJovem');
            const tabela = document.getElementById('corpoTabela');
            select.innerHTML = '<option value="">Selecione um jovem...</option>';
            tabela.innerHTML = "";
            dadosGlobais.forEach((item, index) => {
                select.innerHTML += `<option value="${index}">${item.nome}</option>`;
                tabela.innerHTML += `<tr><td>${item.nome}</td><td>${item.sap}</td><td>${item.disc}</td><td><button class="btn-delete" onclick="excluirInd('${item.nome}')">Excluir</button></td></tr>`;
            });
            renderizarGraficosGerais();
        } catch (e) { console.error("Erro ao carregar dados."); }
    }

    function desenhar(id, type, labels, data, label) {
        if (charts[id]) charts[id].destroy();
        const ctx = document.getElementById(id).getContext('2d');
        const cores = ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71'];
        charts[id] = new Chart(ctx, {
            type: type,
            data: { 
                labels: labels, 
                datasets: [{ 
                    label: label, 
                    data: data, 
                    backgroundColor: id.toLowerCase().includes('disc') ? cores : 'rgba(0, 86, 179, 0.4)', 
                    borderColor: '#0056b3' 
                }] 
            },
            options: { 
                responsive: true, maintainAspectRatio: false,
                scales: type === 'radar' ? { r: { min: 0, max: 5 } } : {}
            }
        });
    }

    function atualizarGraficosIndividuais() {
        const idx = document.getElementById('selectJovem').value;
        if (idx === "") return;
        const j = dadosGlobais[idx];
        const vDisc = limparDadosPlanilha(j.disc);
        
        let max = -1, dom = 'D';
        vDisc.forEach((v, i) => { if(v > max) { max = v; dom = ['D','I','S','C'][i]; } });
        document.getElementById('fotoInd').innerHTML = `<img src="${BICHOS[dom]}" class="pixar-img"><span class="pixar-label">PREDOMINANTE: ${dom}</span>`;

        desenhar('chartSapInd', 'radar', ['PROTAGONISMO', 'RESPONSABILIDADE', 'COMUNICAÇÃO', 'CIDADANIA', 'SOLUÇÃO', 'EQUIPE', 'APRENDER'], JSON.parse(j.sap), 'Individual SAP');
        desenhar('chartDiscInd', 'pie', ['D', 'I', 'S', 'C'], vDisc, 'Perfil DISC');
    }

    function renderizarGraficosGerais() {
        let mediasSap = [0,0,0,0,0,0,0], totaisDisc = [0,0,0,0];
        dadosGlobais.forEach(j => {
            JSON.parse(j.sap).forEach((v, i) => mediasSap[i] += Number(v));
            limparDadosPlanilha(j.disc).forEach((v, i) => totaisDisc[i] += v);
        });

        let maxG = -1, domG = 'D';
        totaisDisc.forEach((v, i) => { if(v > maxG) { maxG = v; domG = ['D','I','S','C'][i]; } });
        document.getElementById('fotoGeral').innerHTML = `<img src="${BICHOS[domG]}" class="pixar-img"><span class="pixar-label">CULTURA: ${domG}</span>`;

        desenhar('chartSapGeral', 'radar', ['PROTAGONISMO', 'RESPONSABILIDADE', 'COMUNICAÇÃO', 'CIDADANIA', 'SOLUÇÃO', 'EQUIPE', 'APRENDER'], mediasSap.map(v => v/dadosGlobais.length), 'Média Turma SAP');
        desenhar('chartDiscGeral', 'bar', ['D', 'I', 'S', 'C'], totaisDisc, 'Total Turma DISC');
    }

    function gerarLinkReset() {
        const link = urlBase + "teste.html?reset=true";
        navigator.clipboard.writeText(link);
        alert("Link de reset copiado!");
    }

    async function excluirInd(n) {
        if(confirm("Excluir "+n+"?")) {
            await fetch(URL_API+"?action=delete&nome="+n, {mode:'no-cors'});
            setTimeout(carregarDados, 1000);
        }
    }

    function exportarExcel() {
        let csv = "\ufeffNome;SAP;DISC\n";
        dadosGlobais.forEach(i => csv += `${i.nome};"${i.sap}";${i.disc}\n`);
        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
        link.download = "relatorio.csv";
        link.click();
    }

    carregarDados();
</script>
</body>
</html>
