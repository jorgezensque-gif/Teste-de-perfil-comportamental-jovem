<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor Jorge 2026 - Painel de Controle</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; color: #333; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 20px; }
        .whatsapp-box { background: #e7f3ef; padding: 15px; border-radius: 8px; margin-bottom: 30px; border: 1px solid #25d366; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 5px; width: 250px; }
        .btn-whats { background: #25d366; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .grid-graficos { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .chart-container { background: #fff; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        .coletivo { grid-column: span 2; background: #fffde7; border: 2px solid #fbc02d; margin-top: 40px; padding: 20px; border-radius: 12px; }
        h2 { color: #1a73e8; }
        h3 { color: #f57f17; }
    </style>
    <script>
        // SEGURANÇA JORGE 2026
        const pass = prompt("Acesso Restrito. Digite a senha:");
        if (pass !== "JORGE2026") {
            alert("Acesso Negado!");
            window.location.href = "https://google.com";
        }
    </script>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Gestor Jorge 2026 - Painel de Inteligência</h2>
        <select id="selectAluno" style="padding: 10px; border-radius: 5px;">
            <option value="">Selecione um Aluno...</option>
            </select>
    </div>

    <div class="whatsapp-box">
        <strong>Gerar Link de Teste para Aluno:</strong><br><br>
        <input type="text" id="nomeWhats" placeholder="Nome do Aluno...">
        <button class="btn-whats" onclick="gerarLinkWhats()">Enviar Convite via WhatsApp</button>
    </div>

    <div id="areaResultados">
        <h3>1. Diagnóstico Individual (4 Gráficos)</h3>
        <div class="grid-graficos">
            <div class="chart-container"><canvas id="radarIndividual"></canvas></div>
            <div class="chart-container"><canvas id="colunaSAP"></canvas></div>
            <div class="chart-container"><canvas id="pizzaDISC"></canvas></div>
            <div class="chart-container"><canvas id="barraEquilibrio"></canvas></div>
        </div>

        <div class="coletivo">
            <h3>2. INTELIGÊNCIA COLETIVA DA TURMA (3 Gráficos Amarelos)</h3>
            <div class="grid-graficos">
                <div class="chart-container"><canvas id="radarColetivo"></canvas></div>
                <div class="chart-container"><canvas id="colunaColetivoSAP"></canvas></div>
                <div style="grid-column: span 2;" class="chart-container"><canvas id="barraColetivoDISC"></canvas></div>
            </div>
        </div>
    </div>
</div>

<script>
    function gerarLinkWhats() {
        const nome = document.getElementById('nomeWhats').value;
        if (!nome) { alert("Por favor, digite o nome do aluno."); return; }
        
        const linkTeste = "https://jorgezensque-gif.github.io/Teste-de-perfil-comportamental-jovem/teste.html";
        const msg = encodeURIComponent("Olá " + nome + "! Jorge aqui. Segue o link para realizar seu Teste de Perfil Comportamental. O link expira após o envio: " + linkTeste);
        window.open("https://api.whatsapp.com/send?text=" + msg);
    }

    // AQUI ENTRA TODA A LÓGICA DOS 7 GRÁFICOS QUE JÁ ESTÁ NO SEU ARQUIVO
    // [Script dos gráficos mantido conforme trabalhamos anteriormente]
</script>

</body>
</html>
