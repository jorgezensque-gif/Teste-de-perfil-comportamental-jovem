<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>PAINEL GESTOR JORGE 2026 - FINAL</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --red: #ef4444; --blue: #38bdf8; --dark: #0f172a; --card: #1e293b; --yellow: #facc15; --green: #22c55e; }
        body { background: var(--dark); color: white; font-family: sans-serif; margin: 0; padding: 20px; overflow-x: hidden; }
        .container { max-width: 1300px; margin: auto; }
        .box { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; }
        
        .gerador-link { border: 2px dashed var(--blue); display: flex; gap: 10px; align-items: center; }
        input { flex: 1; padding: 12px; border-radius: 6px; border: none; font-size: 1rem; outline: none; }
        .btn-ws { background: var(--green); color: white; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; }

        .header-main { border-top: 4px solid var(--red); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .controles { display: flex; gap: 10px; flex-wrap: wrap; }
        select { background: #0f172a; color: white; padding: 10px; border-radius: 6px; border: 1px solid var(--blue); font-weight: bold; }
        .btn-exp { background: #3b82f6; color: white; padding: 10px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
        .btn-zerar { background: var(--red); color: white; padding: 10px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }

        .grid-charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; }
        .card-chart { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid #334155; height: 380px !important; position: relative; }
        .canvas-container { position: relative; height: 300px; width: 100%; }
        h3 { color: var(--yellow); text-align: center; text-transform: uppercase; font-size: 0.9em; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="box gerador-link">
        <strong style="color: var(--blue);">🔗 CONVITE:</strong>
        <input type="text" id="nomeAluno" placeholder="Nome Completo do Aluno">
        <button class="btn-ws" onclick="dispararWhats()">GERAR E DISPARAR WHATSAPP</button>
    </div>

    <div class="box header-main">
        <div>
            <h2 style="margin:0;">GESTOR: JORGE | PAINEL 2026</h2>
            <small style="color: var(--blue);">Responsável: Jorge Zensque</small>
        </div>
        <div class="controles">
            <select id="filtro" onchange="atualizarInterface()"></select>
            <button class="btn-exp" style="background: var(--green);" onclick="exportar('excel')">📊 EXCEL</button>
            <button class="btn-exp" onclick="exportar('csv')">📄 CSV</button>
            <button class="btn-zerar" onclick="limparTudo()">ZERAR</button>
        </div>
    </div>

    <div class="grid-charts">
        <div class="card-chart"><h3>1. AUTOAVALIAÇÃO SAP (RADAR)</h3><div class="canvas-container"><canvas id="gr1"></canvas></div></div>
        <div class="card-chart"><h3>2. PERFIL COMPORTAMENTAL (DISC)</h3><div class="canvas-container"><canvas id="gr2"></canvas></div></div>
        <div class="card-chart"><h3>3. COMPETÊNCIAS TÉCNICAS (SAP)</h3><div class="canvas-container"><canvas id="gr3"></canvas></div></div>
        <div class="card-chart"><h3>4. EQUILÍBRIO: DISC VS SAP</h3><div class="canvas-container"><canvas id="gr4"></canvas></div></div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://perfil-jovem--disc-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    
    let dadosLocais = [];
    let meusGraficos = {};

    function dispararWhats() {
        const n = document.getElementById('nomeAluno').value.trim();
        if(!n) return alert("Jorge, digite o nome!");
        const link = `https://jorgezensque-gif.github.io/Teste-de-perfil-comportamental-jovem/index.html?id=${Date.now()}&nome=${encodeURIComponent(n)}`;
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent("Olá " + n + "! Segue o link do seu teste: " + link)}`, '_blank');
    }

    function carregarGraficos() {
        const baseOpt = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 5 } } };
        
        meusGraficos.radar = new Chart(document.getElementById('gr1'), { 
            type: 'radar', 
            data: { 
                labels: ['Protagonismo','Responsab.','Comunicaç.','Ética','Prob.','Equipe','Aprender'], 
                datasets: [{ label: 'Média', data: [], borderColor: '#38bdf8', backgroundColor: 'rgba(56,189,248,0.3)', fill: true }] 
            }, 
            options: { ...baseOpt, scales: { r: { min:0, max:5, ticks: { display: false }, grid: { color: '#334155' } } } } 
        });
        meusGraficos.disc = new Chart(document.getElementById('gr2'), { type: 'bar', data: { labels: ['D','I','S','C'], datasets: [{ data: [], backgroundColor: ['#ef4444','#facc15','#22c55e','#3b82f6'] }] }, options: baseOpt });
        meusGraficos.sap = new Chart(document.getElementById('gr3'), { type: 'bar', data: { labels: ['P','R','C','E','Pr','Eq','A'], datasets: [{ data: [], backgroundColor: '#38bdf8' }] }, options: baseOpt });
        meusGraficos.corr = new Chart(document.getElementById('gr4'), { type: 'bar', data: { labels: ['D','I','S','C'], datasets: [{ data: [], backgroundColor: ['#ef4444','#facc15','#22c55e','#3b82f6'] }] }, options: baseOpt });
    }

    database.ref('resultados_testes').on('value', snap => {
        dadosLocais = [];
        const menu = document.getElementById('filtro');
        menu.innerHTML = '<option value="geral">📊 VISÃO GERAL DA TURMA</option>';
        snap.forEach(c => {
            let d = c.val(); d.key = c.key;
            dadosLocais.push(d);
            menu.innerHTML += `<option value="${d.key}">${d.aluno.toUpperCase()}</option>`;
        });
        atualizarInterface();
    });

    function atualizarInterface() {
        const selecao = document.getElementById('filtro').value;
        let s = [0,0,0,0,0,0,0], d = [0,0,0,0], c4 = [0,0,0,0], q4 = [0,0,0,0];

        if (selecao === 'geral' && dadosLocais.length > 0) {
            dadosLocais.forEach(r => {
                for(let i=0; i<7; i++) s[i] += parseFloat(r.sap['q'+i] || 0);
                d[0] += parseFloat(r.disc.D || 0);
                d[1] += parseFloat(r.disc.I || 0);
                d[2] += parseFloat(r.disc.S || 0);
                d[3] += parseFloat(r.disc.C || 0);
                
                let mediaSAP = 0; for(let i=0; i<7; i++) mediaSAP += parseFloat(r.sap['q'+i] || 0);
                const perfis = { D: r.disc.D, I: r.disc.I, S: r.disc.S, C: r.disc.C };
                const dom = Object.keys(perfis).reduce((a, b) => perfis[a] > perfis[b] ? a : b);
                const idx = ['D','I','S','C'].indexOf(dom);
                c4[idx] += (mediaSAP/7); q4[idx]++;
            });
            s = s.map(v => v/dadosLocais.length);
            d = d.map(v => v/dadosLocais.length);
            c4 = c4.map((v, i) => q4[i] > 0 ? v/q4[i] : 0);
        } else {
            const r = dadosLocais.find(x => x.key === selecao);
            if(r) {
                for(let i=0; i<7; i++) s[i] = parseFloat(r.sap['q'+i] || 0);
                d = [parseFloat(r.disc.D), parseFloat(r.disc.I), parseFloat(r.disc.S), parseFloat(r.disc.C)];
                const domInd = Object.keys(r.disc).reduce((a, b) => r.disc[a] > r.disc[b] ? a : b);
                c4[['D','I','S','C'].indexOf(domInd)] = s.reduce((a,b)=>a+b)/7;
            }
        }
        meusGraficos.radar.data.datasets[0].data = s;
        meusGraficos.sap.data.datasets[0].data = s;
        meusGraficos.disc.data.datasets[0].data = d;
        meusGraficos.corr.data.datasets[0].data = c4;
        Object.values(meusGraficos).forEach(g => g.update());
    }

    function exportar(tipo) {
        if(dadosLocais.length === 0) return alert("Sem dados!");
        let conteudo = "Aluno,D,I,S,C,Media SAP\n";
        dadosLocais.forEach(r => {
            let m = 0; for(let i=0; i<7; i++) m += parseFloat(r.sap['q'+i] || 0);
            conteudo += `${r.aluno},${r.disc.D},${r.disc.I},${r.disc.S},${r.disc.C},${(m/7).toFixed(2)}\n`;
        });
        const blob = new Blob(["\ufeff" + conteudo], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Relatorio_Jorge_${tipo.toUpperCase()}.csv`;
        link.click();
    }

    function limparTudo() { if(confirm("Jorge, apagar tudo?")) database.ref('resultados_testes').remove(); }
    window.onload = carregarGraficos;
</script>
</body>
</html>
