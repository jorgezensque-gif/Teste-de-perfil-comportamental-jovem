<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Gestor Jorge Zensque</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .box { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 12px; border-top: 10px solid #0056b3; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-wa { background: #25d366; color: white; padding: 15px; border-radius: 8px; text-decoration: none; font-weight: bold; display: block; text-align: center; margin-bottom: 10px; }
        .btn-liberar { background: #f39c12; color: white; padding: 15px; border-radius: 8px; text-decoration: none; font-weight: bold; display: block; text-align: center; margin-bottom: 10px; border: none; width: 100%; cursor: pointer; }
        
        /* Novos botões solicitados */
        .grid-botoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .btn-func { padding: 12px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }
        .btn-etapa { background: #34495e; }
        .btn-excel { background: #27ae60; }
        .btn-backup { background: #2980b9; }
        .btn-limpar { background: #c0392b; }
        .btn-arquivar { background: #7f8c8d; padding: 5px 10px; border-radius: 4px; color: white; border: none; cursor: pointer; }

        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 8px; text-align: center; min-height: 480px; }
        canvas { max-height: 250px !important; width: 100% !important; }
        .container-bicho { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 10px 0; min-height: 140px; }
        .img-bicho { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #0056b3; object-fit: cover; background: #f9f9f9; }
        .label-bicho { font-weight: bold; color: #0056b3; font-size: 0.9em; margin-top: 8px; text-transform: uppercase; }
        .controles { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        select { padding: 12px; width: 60%; border-radius: 6px; border: 1px solid #0056b3; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9em; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #0056b3; color: white; }
    </style>
</head>
<body>

<script>
    const SENHA_MESTRE = "Miraiotsuru@2026#Z";
    let acesso = prompt("Digite a senha de acesso:");
    if (acesso !== SENHA_MESTRE) { alert("Acesso negado!"); document.body.innerHTML = "<h1>Acesso Restrito</h1>"; throw new Error("Negado"); }
</script>

<div class="box">
    <h2 style="text-align:center; color: #0056b3;">PAINEL - GESTOR JORGE ZENSQUE</h2>
    
    <a href="#" id="linkWA" class="btn-wa" target="_blank">📲 ENVIAR LINK PADRÃO (WHATSAPP)</a>
    <button onclick="gerarLinkReset()" class="btn-liberar">🔓 GERAR LINK PARA REFAZER TESTE (LIMPAR TRAVA)</button>

    <div class="grid-botoes">
        <button class="btn-func btn-etapa" onclick="novaAvaliacao('Etapa I')">📝 ETAPA I</button>
        <button class="btn-func btn-etapa" onclick="novaAvaliacao('Etapa II')">📝 ETAPA II</button>
        <button class="btn-func btn-excel" onclick="exportarExcel()">📊 EXPORTAR EXCEL</button>
        <button class="btn-func btn-backup" onclick="backupGeralCSV()">📥 BACKUP CSV</button>
        <button class="btn-func btn-limpar" onclick="limparTudo()">⚠️ LIMPAR TUDO</button>
    </div>

    <div class="controles">
        <select id="selectJovem" onchange="atualizarGraficosIndividuais()"><option value="">Selecione um jovem...</option></select>
        <button style="padding: 10px;" onclick="carregarDados()">🔄 Atualizar Dados</button>
    </div>

    <div class="dashboard">
        <div class="card"><h3>Individual: SAP (Radar)</h3><canvas id="chartSapInd"></canvas></div>
        <div class="card"><h3>Individual: Perfil DISC</h3><div id="bichoInd" class="container-bicho"></div><canvas id="chartDiscInd"></canvas></div>
        <div class="card"><h3>Turma: Média SAP Geral</h3><canvas id="chartSapGeral"></canvas></div>
        <div class="card"><h3>Turma: Perfil Geral (DISC)</h3><div id="bichoGeral" class="container-bicho"></div><canvas id="chartDiscGeral"></canvas></div>
    </div>
    
    <table>
        <thead><tr><th>Nome</th><th>Valores SAP</th><th>DISC</th><th>Ação</th></tr></thead>
        <tbody id="corpoTabela"></tbody>
    </table>
</div>

<script>
    const URL_API = "https://script.google.com/macros/s/AKfycbwua4hn4gHs053z4_17z3JvBO2C_8jyTSrjD4vFIas0SsNUjIeUEnBbe5lO2RDGuzzJ/exec";
    const urlBase = window.location.href.split('resultados.html')[0];
    document.getElementById("linkWA").href = "https://api.whatsapp.com/send?text=Olá! Preencha sua autoavaliação aqui: " + urlBase + "teste.html";

    function gerarLinkReset() {
        const link = urlBase + "teste.html?reset=true";
        navigator.clipboard.writeText(link); alert("Link de reset copiado!");
    }

    // Funcionalidades de Gestão de Dados
    async function novaAvaliacao(etapa) { if(confirm("Iniciar nova avaliação: " + etapa + "?")) { alert("Configurado para " + etapa); } }

    async function arquivarInd(nome) {
        if(confirm("Deseja arquivar os dados de " + nome + "?")) {
            await fetch(URL_API + "?action=archive&nome=" + nome, {mode:'no-cors'});
            alert("Dados de " + nome + " arquivados com sucesso."); setTimeout(carregarDados, 1000);
        }
    }

    function exportarExcel() {
        let csv = "\ufeffNome;SAP;DISC\n"; 
        dadosGlobais.forEach(i => csv += `${i.nome};"${i.sap}";${i.disc}\n`);
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = "Painel_SAP_DISC.csv"; link.click();
    }

    function backupGeralCSV() {
        let csv = "data_hora,nome,sap,disc\n";
        dadosGlobais.forEach(i => csv += `${new Date().toLocaleString()},${i.nome},${i.sap},${i.disc}\n`);
        const blob = new Blob([csv], { type: 'text/csv' });
        const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = "backup_geral_sistema.csv"; link.click();
    }

    async function limparTudo() {
        if(confirm("⚠️ AVISO CRÍTICO: Deseja apagar TODOS os dados da planilha? Esta ação não pode ser desfeita.")) {
            await fetch(URL_API + "?action=clearAll", {mode:'no-cors'});
            setTimeout(carregarDados, 1500);
        }
    }

    const MAPA_BICHOS = { 0: { nome: 'LEÃO (D)', arq: 'D.png' }, 1: { nome: 'PAPAGAIO (I)', arq: 'I.png' }, 2: { nome: 'PANDA (S)', arq: 'S.png' }, 3: { nome: 'CORUJA (C)', arq: 'C.png' } };
    let dadosGlobais = []; let charts = {};

    async function carregarDados() {
        const res = await fetch(URL_API);
        dadosGlobais = await res.json();
        const select = document.getElementById('selectJovem'); const tabela = document.getElementById('corpoTabela');
        select.innerHTML = '<option value="">Selecione um jovem...</option>'; tabela.innerHTML = "";
        dadosGlobais.forEach((item, index) => {
            select.innerHTML += `<option value="${index}">${item.nome}</option>`;
            tabela.innerHTML += `<tr><td>${item.nome}</td><td>${item.sap}</td><td>${item.disc}</td><td>
                <button class="btn-arquivar" onclick="arquivarInd('${item.nome}')">Arquivar</button>
            </td></tr>`;
        });
        renderizarGraficosGerais();
    }

    function tratarValoresDisc(t) {
        if (!t) return [0,0,0,0];
        let l = t.toString().replace(/--/g, '-').split('-').filter(x => x !== "").map(v => Math.abs(parseFloat(v)));
        while(l.length < 4) l.push(0); return l.slice(0, 4);
    }

    function exibirBicho(v, d, t) {
        let m = Math.max(...v); let i = v.indexOf(m); let b = MAPA_BICHOS[i];
        document.getElementById(d).innerHTML = `<img src="${b.arq}" class="img-bicho" onerror="this.src='https://via.placeholder.com/100?text=Erro'"><span class="label-bicho">${t}: ${b.nome}</span>`;
    }

    function desenhar(id, type, labels, data, label) {
        if (charts[id]) charts[id].destroy();
        charts[id] = new Chart(document.getElementById(id).getContext('2d'), {
            type: type, data: { labels, datasets: [{ label, data, backgroundColor: id.includes('Disc') ? ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71'] : 'rgba(0, 86, 179, 0.4)', borderColor: '#0056b3' }] },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    function atualizarGraficosIndividuais() {
        const idx = document.getElementById('selectJovem').value; if (idx === "") return;
        const j = dadosGlobais[idx]; const vD = tratarValoresDisc(j.disc);
        exibirBicho(vD, 'bichoInd', 'PREDOMINANTE');
        desenhar('chartSapInd', 'radar', ['PROT', 'RESP', 'COM', 'CID', 'SOL', 'EQUIP', 'APR'], JSON.parse(j.sap), 'Individual SAP');
        desenhar('chartDiscInd', 'pie', ['D', 'I', 'S', 'C'], vD, 'Perfil DISC');
    }

    function renderizarGraficosGerais() {
        let mS = [0,0,0,0,0,0,0], tD = [0,0,0,0];
        dadosGlobais.forEach(j => { JSON.parse(j.sap).forEach((v, i) => mS[i] += Number(v)); tratarValoresDisc(j.disc).forEach((v, i) => tD[i] += v); });
        exibirBicho(tD, 'bichoGeral', 'CULTURA DA TURMA');
        desenhar('chartSapGeral', 'radar', ['PROT', 'RESP', 'COM', 'CID', 'SOL', 'EQUIP', 'APR'], mS.map(v => v/dadosGlobais.length), 'Média Turma');
        desenhar('chartDiscGeral', 'bar', ['D', 'I', 'S', 'C'], tD, 'Total Turma');
    }

    carregarDados();
</script>
</body>
</html>
