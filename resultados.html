<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Gestor Jorge Zensque</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .box { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 12px; border-top: 10px solid #0056b3; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-wa { background: #25d366; color: white; padding: 15px; border-radius: 8px; text-decoration: none; font-weight: bold; display: block; text-align: center; margin-bottom: 20px; }
        .btn-liberar { background: #f39c12; color: white; padding: 15px; border-radius: 8px; text-decoration: none; font-weight: bold; display: block; text-align: center; margin-bottom: 20px; border: none; width: 100%; cursor: pointer; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 8px; text-align: center; min-height: 400px; }
        .img-bicho { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #0056b3; margin-bottom: 5px; }
        .label-bicho { font-weight: bold; color: #0056b3; display: block; margin-bottom: 10px; }
        select { padding: 12px; width: 60%; border-radius: 6px; border: 1px solid #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #0056b3; color: white; }
    </style>
</head>
<body>

<div class="box">
    <h2 style="text-align:center; color: #0056b3;">PAINEL - GESTOR JORGE ZENSQUE</h2>
    
    <div style="display: flex; gap: 10px; margin-bottom: 20px; justify-content: center;">
        <select id="selectJovem" onchange="atualizarGraficosIndividuais()"></select>
        <button onclick="carregarDados()" style="padding: 10px;">Atualizar Dados</button>
    </div>

    <div class="dashboard">
        <div class="card">
            <h3>Individual: SAP (Radar)</h3>
            <canvas id="chartSapInd"></canvas>
        </div>
        <div class="card">
            <h3>Individual: Perfil DISC</h3>
            <div id="bichoInd"></div>
            <canvas id="chartDiscInd"></canvas>
        </div>
        <div class="card">
            <h3>Turma: Média SAP (Barras)</h3>
            <canvas id="chartSapGeral"></canvas>
        </div>
        <div class="card">
            <h3>Turma: Perfil Geral (DISC)</h3>
            <div id="bichoGeral"></div>
            <canvas id="chartDiscGeral"></canvas>
        </div>
    </div>

    <table id="tabelaDados">
        <thead><tr><th>Nome</th><th>SAP</th><th>DISC</th><th>Ação</th></tr></thead>
        <tbody id="corpoTabela"></tbody>
    </table>
</div>

<script>
    const URL_API = "SUA_URL_AQUI";
    let dadosGlobais = [];
    let charts = {};

    async function carregarDados() {
        const res = await fetch(URL_API);
        dadosGlobais = await res.json();
        const select = document.getElementById('selectJovem');
        const tabela = document.getElementById('corpoTabela');
        select.innerHTML = '<option value="">Selecione um jovem...</option>';
        tabela.innerHTML = "";
        
        dadosGlobais.forEach((item, index) => {
            select.innerHTML += `<option value="${index}">${item.nome}</option>`;
            tabela.innerHTML += `<tr><td>${item.nome}</td><td>${item.sap}</td><td>${item.disc}</td><td><button onclick="excluir('${item.nome}')">Excluir</button></td></tr>`;
        });
        renderizarGraficosGerais();
    }

    function desenhar(id, type, labels, data, label) {
        if (charts[id]) charts[id].destroy();
        
        const cores = ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71'];
        
        // CONFIGURAÇÃO SEM INVENÇÃO: Travado em 5 para SAP, Automático para DISC
        let escalaY = { beginAtZero: true };
        if (id.includes('Sap')) { escalaY.max = 5; }

        charts[id] = new Chart(document.getElementById(id).getContext('2d'), {
            type: type,
            data: {
                labels: labels,
                datasets: [{
                    label: label,
                    data: data,
                    backgroundColor: id.includes('Disc') ? cores : 'rgba(0, 86, 179, 0.4)',
                    borderColor: '#0056b3',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: (type === 'bar' || type === 'radar') ? { 
                    y: escalaY,
                    r: id.includes('Sap') ? { beginAtZero: true, max: 5 } : { beginAtZero: true }
                } : {}
            }
        });
    }

    function tratarValoresDisc(t) {
        if (!t) return [0,0,0,0];
        return t.split('-').map(v => parseFloat(v));
    }

    const MAPA_BICHOS = { 0: {nome:'LEÃO (D)', arq:'D.png'}, 1: {nome:'PAPAGAIO (I)', arq:'I.png'}, 2: {nome:'PANDA (S)', arq:'S.png'}, 3: {nome:'CORUJA (C)', arq:'C.png'} };

    function exibirBicho(v, d, t) {
        let m = Math.max(...v);
        let i = v.indexOf(m);
        let b = MAPA_BICHOS[i];
        document.getElementById(d).innerHTML = `<img src="${b.arq}" class="img-bicho"><span class="label-bicho">${t}: ${b.nome}</span>`;
    }

    function atualizarGraficosIndividuais() {
        const idx = document.getElementById('selectJovem').value;
        if (idx === "") return;
        const j = dadosGlobais[idx];
        const vDisc = tratarValoresDisc(j.disc);
        exibirBicho(vDisc, 'bichoInd', 'PREDOMINANTE');
        desenhar('chartSapInd', 'radar', ['PROT', 'RESP', 'COM', 'CID', 'SOL', 'EQUIP', 'APR'], JSON.parse(j.sap), 'Individual SAP');
        desenhar('chartDiscInd', 'pie', ['D', 'I', 'S', 'C'], vDisc, 'Perfil DISC');
    }

    function renderizarGraficosGerais() {
        if(!dadosGlobais.length) return;
        let mSap = [0,0,0,0,0,0,0], tDisc = [0,0,0,0];
        dadosGlobais.forEach(j => {
            JSON.parse(j.sap).forEach((v, i) => mSap[i] += Number(v));
            tratarValoresDisc(j.disc).forEach((v, i) => tDisc[i] += v);
        });
        const mediaSap = mSap.map(v => v/dadosGlobais.length);
        exibirBicho(tDisc, 'bichoGeral', 'MÉDIA TURMA');
        desenhar('chartSapGeral', 'bar', ['PROT', 'RESP', 'COM', 'CID', 'SOL', 'EQUIP', 'APR'], mediaSap, 'Média SAP');
        desenhar('chartDiscGeral', 'bar', ['D', 'I', 'S', 'C'], tDisc, 'Total DISC');
    }

    carregarDados();
</script>
</body>
</html>
