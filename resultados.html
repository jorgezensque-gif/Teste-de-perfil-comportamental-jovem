<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Gestor Jorge Zensque</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .box { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 12px; border-top: 10px solid #0056b3; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .grid-ferramentas { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .btn-tool { padding: 12px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; font-size: 0.85em; }
        .btn-fase { background: #34495e; border: 2px solid transparent; }
        .btn-fase.active { border-color: #f1c40f; box-shadow: 0 0 10px rgba(241, 196, 15, 0.5); }
        .btn-excel { background: #27ae60; }
        .btn-arquivar { background: #e67e22; }
        .btn-puxar { background: #8e44ad; }
        .btn-limpar { background: #c0392b; }

        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 8px; text-align: center; min-height: 500px; }
        
        .container-bicho { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 10px 0; min-height: 140px; }
        .img-bicho { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #0056b3; object-fit: cover; }
        .label-bicho { font-weight: bold; color: #0056b3; font-size: 0.9em; margin-top: 8px; text-transform: uppercase; }
        .controles { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        select { padding: 12px; width: 60%; border-radius: 6px; border: 1px solid #0056b3; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.85em; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #0056b3; color: white; }
    </style>
</head>
<body>

<div class="box">
    <h2 style="text-align:center; color: #0056b3;">PAINEL - GESTOR JORGE ZENSQUE</h2>
    
    <div class="grid-ferramentas">
        <button class="btn-tool btn-fase active" id="btnEtapa1" onclick="filtrarEtapa('I')">📊 ETAPA I</button>
        <button class="btn-tool btn-fase" id="btnEtapa2" onclick="filtrarEtapa('II')">📊 ETAPA II</button>
        <button class="btn-tool btn-excel" onclick="exportarExcel()">📊 EXCEL</button>
        <button class="btn-tool btn-arquivar" onclick="arquivarGeralCSV()">📁 ARQUIVAR (CSV)</button>
        <button class="btn-tool btn-puxar" onclick="carregarArquivados()">📥 VER ARQUIVADOS</button>
        <button class="btn-tool btn-limpar" onclick="limparTudo()">⚠️ LIMPAR</button>
    </div>

    <div class="controles">
        <select id="selectJovem" onchange="atualizarGraficosIndividuais()"><option value="">Selecione um jovem...</option></select>
        <button style="padding: 10px;" onclick="carregarDados()">🔄 Atualizar</button>
    </div>

    <div class="dashboard">
        <div class="card">
            <h3>Individual: SAP (Radar e Barras)</h3>
            <div style="height: 250px;"><canvas id="chartSapIndRadar"></canvas></div>
            <div style="height: 200px; margin-top: 20px;"><canvas id="chartSapIndBar"></canvas></div>
        </div>
        <div class="card">
            <h3>Individual: Perfil DISC</h3>
            <div id="bichoInd" class="container-bicho"></div>
            <div style="height: 250px;"><canvas id="chartDiscInd"></canvas></div>
        </div>
        <div class="card">
            <h3>Turma: Média SAP (Barras)</h3>
            <div style="height: 400px;"><canvas id="chartSapGeral"></canvas></div>
        </div>
        <div class="card">
            <h3>Turma: Perfil Geral (DISC)</h3>
            <div id="bichoGeral" class="container-bicho"></div>
            <div style="height: 300px;"><canvas id="chartDiscGeral"></canvas></div>
        </div>
    </div>
    
    <table id="tabelaDados">
        <thead><tr><th>Nome</th><th>Etapa</th><th>SAP</th><th>DISC</th><th>Ação</th></tr></thead>
        <tbody id="corpoTabela"></tbody>
    </table>
</div>

<script>
    const URL_API = "SUA_URL_AQUI"; 
    let dadosGlobais = [];
    let charts = {};
    let etapaAtualFiltro = 'I';

    const SAP_LABELS = ['PROT', 'RESP', 'COM', 'CID', 'SOL', 'EQUIP', 'APR'];

    async function carregarDados() {
        const res = await fetch(URL_API);
        dadosGlobais = await res.json();
        atualizarInterface();
    }

    function atualizarInterface() {
        const select = document.getElementById('selectJovem');
        const tabela = document.getElementById('corpoTabela');
        select.innerHTML = '<option value="">Selecione um jovem...</option>';
        tabela.innerHTML = "";
        
        let dadosFiltrados = dadosGlobais.filter(d => (d.etapa || 'I') === etapaAtualFiltro);
        dadosFiltrados.sort((a, b) => a.nome.localeCompare(b.nome));

        dadosFiltrados.forEach((item, index) => {
            select.innerHTML += `<option value="${index}">${item.nome}</option>`;
            tabela.innerHTML += `<tr><td>${item.nome}</td><td><b>Etapa ${etapaAtualFiltro}</b></td><td>${item.sap}</td><td>${item.disc}</td><td>
                <button style="color:red; cursor:pointer;" onclick="excluirInd('${item.nome}')">Excluir</button>
            </td></tr>`;
        });
        renderizarGraficosGerais(dadosFiltrados);
    }

    function desenhar(id, type, labels, data, label) {
        if (charts[id]) charts[id].destroy();
        
        const cores = ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71'];
        
        let configOpcoes = {
            responsive: true,
            maintainAspectRatio: false,
            scales: {}
        };

        if (type === 'bar') {
            configOpcoes.scales.y = { beginAtZero: true };
            if (id.includes('Sap')) {
                configOpcoes.scales.y.max = 5; // Trava o SAP no 5
                configOpcoes.scales.y.ticks = { stepSize: 1 };
            } else if (id.includes('Disc')) {
                configOpcoes.scales.y.suggestedMax = Math.max(...data) + 2; // Lógica que funcionou no DISC
            }
        } else if (type === 'radar') {
            configOpcoes.scales.r = { beginAtZero: true, max: 5, ticks: { display: false } };
        }

        charts[id] = new Chart(document.getElementById(id).getContext('2d'), {
            type: type,
            data: {
                labels: labels,
                datasets: [{
                    label: label,
                    data: data,
                    backgroundColor: id.includes('Disc') ? cores : 'rgba(0, 86, 179, 0.4)',
                    borderColor: '#0056b3',
                    borderWidth: 1
                }]
            },
            options: configOpcoes
        });
    }

    function atualizarGraficosIndividuais() {
        const idx = document.getElementById('selectJovem').value;
        if (idx === "") return;
        const dadosFiltrados = dadosGlobais.filter(d => (d.etapa || 'I') === etapaAtualFiltro).sort((a, b) => a.nome.localeCompare(b.nome));
        const j = dadosFiltrados[idx]; 
        const vD = tratarValoresDisc(j.disc);
        const vS = JSON.parse(j.sap);

        exibirBicho(vD, 'bichoInd', 'PREDOMINANTE');
        
        desenhar('chartSapIndRadar', 'radar', SAP_LABELS, vS, 'Individual SAP (Radar)');
        desenhar('chartSapIndBar', 'bar', SAP_LABELS, vS, 'Individual SAP (Barras)');
        desenhar('chartDiscInd', 'pie', ['D', 'I', 'S', 'C'], vD, 'Perfil DISC');
    }

    function renderizarGraficosGerais(dados) {
        if(!dados.length) return;
        let mS = [0,0,0,0,0,0,0], tD = [0,0,0,0];
        dados.forEach(j => {
            JSON.parse(j.sap).forEach((v, i) => mS[i] += Number(v));
            tratarValoresDisc(j.disc).forEach((v, i) => tD[i] += v);
        });
        const mediaS = mS.map(v => v/dados.length);
        exibirBicho(tD, 'bichoGeral', 'MÉDIA ' + etapaAtualFiltro);
        desenhar('chartSapGeral', 'bar', SAP_LABELS, mediaS, 'Média SAP (Turma)');
        desenhar('chartDiscGeral', 'bar', ['D', 'I', 'S', 'C'], tD, 'Total DISC (Turma)');
    }

    function tratarValoresDisc(t) {
        if (!t) return [0,0,0,0];
        let l = t.split('-').map(v => parseFloat(v));
        while(l.length < 4) l.push(0); return l.slice(0,4);
    }

    const MAPA_BICHOS = { 0: { nome: 'LEÃO (D)', arq: 'D.png' }, 1: { nome: 'PAPAGAIO (I)', arq: 'I.png' }, 2: { nome: 'PANDA (S)', arq: 'S.png' }, 3: { nome: 'CORUJA (C)', arq: 'C.png' } };

    function exibirBicho(v, d, t) {
        let m = Math.max(...v); let i = v.indexOf(m); let b = MAPA_BICHOS[i];
        document.getElementById(d).innerHTML = `<img src="${b.arq}" class="img-bicho"><span class="label-bicho">${t}: ${b.nome}</span>`;
    }

    function filtrarEtapa(fase) {
        etapaAtualFiltro = fase;
        document.getElementById('btnEtapa1').classList.toggle('active', fase === 'I');
        document.getElementById('btnEtapa2').classList.toggle('active', fase === 'II');
        atualizarInterface();
    }

    carregarDados();
</script>
</body>
</html>
