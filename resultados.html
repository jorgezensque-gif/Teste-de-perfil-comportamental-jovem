<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Gestor Jorge Zensque</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .box { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 12px; border-top: 10px solid #0056b3; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 8px; text-align: center; min-height: 480px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        canvas { max-height: 250px !important; width: 100% !important; }
        
        /* Fotos Pixar */
        .pixar-box { margin-top: 15px; text-align: center; min-height: 160px; }
        .pixar-img { width: 140px; height: 140px; border-radius: 50%; border: 6px solid #0056b3; object-fit: cover; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .pixar-label { font-weight: bold; color: #0056b3; margin-top: 10px; display: block; font-size: 16px; }
        
        .controles { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        select { padding: 12px; width: 60%; border-radius: 6px; border: 1px solid #0056b3; font-weight: bold; font-size: 16px; }
        .btn-refresh { padding: 10px 20px; cursor: pointer; background: #0056b3; color: white; border: none; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>
<div class="box">
    <h2 style="text-align:center; color: #0056b3;">PAINEL GESTOR - JORGE ZENSQUE</h2>
    
    <div class="controles">
        <select id="selectJovem" onchange="atualizarGraficosIndividuais()"><option value="">Selecione um jovem...</option></select>
        <button class="btn-refresh" onclick="carregarDados()">🔄 Atualizar</button>
    </div>

    <div class="dashboard">
        <div class="card"><h3>Individual: SAP</h3><canvas id="chartSapInd"></canvas></div>
        
        <div class="card">
            <h3>Individual: Perfil DISC</h3>
            <canvas id="chartDiscInd"></canvas>
            <div id="boxPixarInd" class="pixar-box" style="display:none;">
                <img id="imgPixarInd" src="" class="pixar-img">
                <span id="labelPixarInd" class="pixar-label"></span>
            </div>
        </div>

        <div class="card"><h3>Turma: Média SAP</h3><canvas id="chartSapGeral"></canvas></div>
        
        <div class="card">
            <h3>Turma: Cultura Geral</h3>
            <canvas id="chartDiscGeral"></canvas>
            <div id="boxPixarGeral" class="pixar-box">
                <img id="imgPixarGeral" src="" class="pixar-img">
                <span id="labelPixarGeral" class="pixar-label"></span>
            </div>
        </div>
    </div>
</div>

<script>
    const URL_API = "https://script.google.com/macros/s/AKfycbwua4hn4gHs053z4_17z3JvBO2C_8jyTSrjD4vFIas0SsNUjIeUEnBbe5lO2RDGuzzJ/exec";
    let dadosGlobais = [];
    let charts = {};

    async function carregarDados() {
        try {
            const res = await fetch(URL_API);
            dadosGlobais = await res.json();
            const select = document.getElementById('selectJovem');
            select.innerHTML = '<option value="">Selecione um jovem...</option>';
            dadosGlobais.forEach((item, index) => {
                select.innerHTML += `<option value="${index}">${item.nome}</option>`;
            });
            renderizarGraficosGerais();
        } catch (e) { console.error(e); }
    }

    function desenhar(id, type, labels, data, label) {
        if (charts[id]) charts[id].destroy();
        const ctx = document.getElementById(id).getContext('2d');
        const cores = ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71'];
        charts[id] = new Chart(ctx, {
            type: type,
            data: { labels: labels, datasets: [{ label: label, data: data, backgroundColor: id.includes('Disc') ? cores : 'rgba(0,86,179,0.4)', borderColor: '#0056b3', borderWidth: 2 }] },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    function atualizarGraficosIndividuais() {
        const idx = document.getElementById('selectJovem').value;
        if (idx === "") return;
        const j = dadosGlobais[idx];
        
        // CORREÇÃO DA LOGICA: Converte string para numero e garante que não seja Undefined
        const discVals = j.disc.split('-').map(v => Math.abs(parseFloat(v)) || 0);
        
        desenhar('chartSapInd', 'radar', ['PROTAGONISMO', 'RESPONSABILIDADE', 'COMUNICAÇÃO', 'CIDADANIA', 'SOLUÇÃO', 'EQUIPE', 'APRENDER'], JSON.parse(j.sap), 'SAP');
        desenhar('chartDiscInd', 'pie', ['D', 'I', 'S', 'C'], discVals, 'DISC');

        const siglas = ['D', 'I', 'S', 'C'];
        const nomes = {'D':'Dominante','I':'Influente','S':'Estável','C':'Conforme'};
        
        // Acha o maior valor
        const maxVal = Math.max(...discVals);
        const dominante = siglas[discVals.indexOf(maxVal)];
        
        // Força o carregamento da imagem certa
        document.getElementById('imgPixarInd').src = dominante + ".jpg?v=" + new Date().getTime(); 
        document.getElementById('labelPixarInd').innerText = "PERFIL: " + nomes[dominante];
        document.getElementById('boxPixarInd').style.display = "block";
    }

    function renderizarGraficosGerais() {
        if (!dadosGlobais.length) return;
        let totaisDisc = [0,0,0,0];
        dadosGlobais.forEach(j => {
            j.disc.split('-').map(v => Math.abs(parseFloat(v)) || 0).forEach((v, i) => totaisDisc[i] += v);
        });
        
        desenhar('chartDiscGeral', 'bar', ['D', 'I', 'S', 'C'], totaisDisc, 'Soma Turma');
        
        const siglas = ['D', 'I', 'S', 'C'];
        const domTurma = siglas[totaisDisc.indexOf(Math.max(...totaisDisc))];
        
        document.getElementById('imgPixarGeral').src = domTurma + ".jpg?v=" + new Date().getTime();
        document.getElementById('labelPixarGeral').innerText = "CULTURA: " + domTurma;
    }

    carregarDados();
</script>
</body>
</html>
