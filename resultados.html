<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Gestor Jorge Zensque</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .box { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 12px; border-top: 10px solid #0056b3; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 8px; text-align: center; min-height: 500px; display: flex; flex-direction: column; justify-content: space-between; }
        canvas { max-height: 250px !important; width: 100% !important; }
        .pixar-container { display: flex; justify-content: center; gap: 20px; margin-top: 15px; min-height: 180px; align-items: center; }
        .pixar-img { width: 110px; height: 110px; border-radius: 50%; border: 4px solid #0056b3; object-fit: cover; background: #eee; }
        .pixar-label { display: block; font-weight: bold; color: #0056b3; font-size: 0.85em; margin-top: 8px; text-transform: uppercase; }
        select { padding: 12px; width: 60%; border-radius: 6px; border: 2px solid #0056b3; font-weight: bold; }
    </style>
</head>
<body>

<script>
    // ESTA É A TRAVA QUE PRECISA APARECER
    const SENHA_MESTRE = "Miraiotsuru@2026#Z";
    let acesso = prompt("PAINEL RESTRITO - Digite a senha:");
    if (acesso !== SENHA_MESTRE) {
        alert("Acesso Negado!");
        document.body.innerHTML = "<h1 style='text-align:center;'>Acesso bloqueado</h1>";
        throw new Error("Trava ativa");
    }
</script>

<div class="box">
    <h2 style="text-align:center; color: #0056b3;">PAINEL - GESTOR JORGE ZENSQUE</h2>
    <div style="text-align:center;">
        <select id="selectJovem" onchange="atualizarGraficosIndividuais()"><option value="">Carregando...</option></select>
    </div>

    <div class="dashboard">
        <div class="card"><h3>Competências SAP</h3><canvas id="chartSapInd"></canvas></div>
        <div class="card">
            <h3>Perfil Comportamental</h3>
            <canvas id="chartDiscInd"></canvas>
            <div id="fotoInd" class="pixar-container"></div>
        </div>
        <div class="card"><h3>Média Turma SAP</h3><canvas id="chartSapGeral"></canvas></div>
        <div class="card">
            <h3>Cultura da Turma</h3>
            <canvas id="chartDiscGeral"></canvas>
            <div id="fotoGeral" class="pixar-container"></div>
        </div>
    </div>
</div>

<script>
    const URL_API = "https://script.google.com/macros/s/AKfycbwua4hn4gHs053z4_17z3JvBO2C_8jyTSrjD4vFIas0SsNUjIeUEnBbe5lO2RDGuzzJ/exec";
    
    // LINKS EXTERNOS DE SEGURANÇA (Caso o seu GitHub falhe, estes funcionam)
    const BICHOS = {
        'D': { nome: 'LEÃO', url: 'https://img.freepik.com/vetores-gratis/leao-bonito-sentado-ilustracao-em-vetor-desenho-animado-leao-personagem-de-desenho-animado-animal-isolado_138676-3165.jpg' },
        'I': { nome: 'PAPAGAIO', url: 'https://img.freepik.com/vetores-gratis/ilustracao-de-papagaio-bonito-dos-desenhos-animados_138676-2621.jpg' },
        'S': { nome: 'PANDA', url: 'https://img.freepik.com/vetores-gratis/personagem-de-desenho-animado-de-panda-sentado-bonito-ilustracao_138676-2101.jpg' },
        'C': { nome: 'CORUJA', url: 'https://img.freepik.com/vetores-gratis/ilustracao-de-coruja-bonito-dos-desenhos-animados-vetor-isolado_138676-2342.jpg' }
    };

    let dadosGlobais = [];
    let charts = {};

    async function carregarDados() {
        const res = await fetch(URL_API);
        dadosGlobais = await res.json();
        const select = document.getElementById('selectJovem');
        select.innerHTML = '<option value="">Escolha um Jovem...</option>';
        dadosGlobais.forEach((item, index) => {
            select.innerHTML += `<option value="${index}">${item.nome}</option>`;
        });
        renderizarGeral();
    }

    function renderizarGeral() {
        let totaisDisc = [0,0,0,0];
        dadosGlobais.forEach(j => {
            j.disc.split('-').forEach((v, i) => totaisDisc[i] += Math.abs(Number(v)));
        });
        
        let ranking = totaisDisc.map((v, i) => ({ v, s: ['D','I','S','C'][i] })).sort((a,b) => b.v - a.v);
        let html = "";
        for(let i=0; i<2; i++) {
            html += `<div class="pixar-item"><img src="${BICHOS[ranking[i].s].url}" class="pixar-img"><span class="pixar-label">${BICHOS[ranking[i].s].nome}</span></div>`;
        }
        document.getElementById('fotoGeral').innerHTML = html;
    }

    function atualizarGraficosIndividuais() {
        const idx = document.getElementById('selectJovem').value;
        if (!idx) return;
        const j = dadosGlobais[idx];
        const vDisc = j.disc.split('-').map(v => Math.abs(Number(v)));
        let maxVal = -1, dominante = 'D';
        vDisc.forEach((v, i) => { if(v > maxVal) { maxVal = v; dominante = ['D','I','S','C'][i]; } });

        document.getElementById('fotoInd').innerHTML = `
            <div class="pixar-item">
                <img src="${BICHOS[dominante].url}" class="pixar-img">
                <span class="pixar-label">PREDOMINANTE: ${BICHOS[dominante].nome}</span>
            </div>`;
    }

    carregarDados();
</script>
</body>
</html>
