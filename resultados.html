<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Gestor Jorge 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .box { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 10px solid #0056b3; }
        h2, h3 { color: #0056b3; text-align: center; }
        .gerador { background: #e7f3ff; padding: 15px; border-radius: 8px; margin-bottom: 25px; border: 1px dashed #0056b3; text-align: center; }
        .btn-w { background: #25d366; color: white; padding: 12px 25px; border-radius: 6px; text-decoration: none; font-weight: bold; display: inline-block; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        canvas { max-height: 300px; width: 100% !important; }
        .controles { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        select { padding: 10px; border-radius: 6px; border: 1px solid #0056b3; font-weight: bold; width: 60%; }
        table { width: 100%; border-collapse: collapse; margin-top: 30px; font-size: 0.9em; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background: #0056b3; color: white; }
    </style>
</head>
<body>

<div class="box">
    <h2>PAINEL DE CONTROLE - GESTOR JORGE</h2>

    <div class="gerador">
        <a href="https://api.whatsapp.com/send?text=Olá! Por favor, preencha sua autavaliação aqui: https://jorgezensque-gif.github.io/Teste-de-perfil-comportamental-jovem/teste.html" target="_blank" class="btn-w">📲 GERAR LINK E ENVIAR PARA TURMA VIA WHATSAPP</a>
    </div>

    <div class="controles">
        <select id="selectJovem" onchange="atualizarGraficosIndividuais()">
            <option value="">Selecione um jovem para análise individual...</option>
        </select>
        <button onclick="excluirTudo()" style="background:#000; color:#fff; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; font-weight:bold;">⚠️ APAGAR TUDO</button>
    </div>

    <div class="dashboard">
        <div class="card"><h3>Individual: Competências SAP</h3><canvas id="chartSapInd"></canvas></div>
        <div class="card"><h3>Individual: Perfil DISC</h3><canvas id="chartDiscInd"></canvas></div>
    </div>

    <div style="margin-top:40px; padding-top:20px; border-top:3px solid #f1c40f;">
        <h3>📊 INTELIGÊNCIA COLETIVA DA TURMA</h3>
        <div class="dashboard">
            <div class="card"><h3>Média da Turma (SAP)</h3><canvas id="chartSapGeral"></canvas></div>
            <div class="card"><h3>Distribuição DISC da Turma</h3><canvas id="chartDiscGeral"></canvas></div>
        </div>
    </div>

    <table id="tabelaDados">
        <thead><tr><th>Nome do Jovem</th><th>SAP (1-7)</th><th>Resultado DISC</th><th>Ações</th></tr></thead>
        <tbody id="corpoTabela"></tbody>
    </table>
</div>

<script>
    // URL ATUALIZADA DA VERSÃO 4
    const URL_API = "https://script.google.com/macros/s/AKfycbK_h4WDaFFCH2-Po8R9nTz8rDMvmlHI9NAZXH8cGKszpZeWmuUYruWTMMxmMoY59o/exec";
    let dadosGlobais = [];
    let charts = {};

    async function carregarDados() {
        try {
            const res = await fetch(URL_API);
            dadosGlobais = await res.json();
            const select = document.getElementById('selectJovem');
            const tabela = document.getElementById('corpoTabela');
            
            select.innerHTML = '<option value="">Selecione um jovem...</option>';
            tabela.innerHTML = "";

            if (dadosGlobais.length > 0) {
                dadosGlobais.forEach((item, index) => {
                    select.innerHTML += `<option value="${index}">${item.nome}</option>`;
                    tabela.innerHTML += `<tr>
                        <td><b>${item.nome}</b></td>
                        <td>${item.sap}</td>
                        <td style="color:#0056b3; font-weight:bold;">${item.disc}</td>
                        <td><button onclick="excluirInd('${item.nome}')" style="background:#dc3545; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">Excluir</button></td>
                    </tr>`;
                });
                renderizarGraficosGerais();
            }
        } catch (e) { alert("Erro ao carregar dados. Verifique a API."); }
    }

    function atualizarGraficosIndividuais() {
        const idx = document.getElementById('selectJovem').value;
        if (idx === "") return;
        const j = dadosGlobais[idx];
        
        const sapValores = JSON.parse(j.sap);
        const discValores = j.disc.split('-').map(Number);

        desenhar('chartSapInd', 'radar', ['Ser Protagonista', 'Responsável', 'Comunicar', 'Ético', 'Problemas', 'Trabalho Equipe', 'Visão Futuro'], sapValores, 'Competências');
        desenhar('chartDiscInd', 'pie', ['D', 'I', 'S', 'C'], discValores, 'Perfil DISC');
    }

    function renderizarGraficosGerais() {
        let mediasSap = [0,0,0,0,0,0,0];
        let totaisDisc = [0,0,0,0];

        dadosGlobais.forEach(j => {
            JSON.parse(j.sap).forEach((v, i) => mediasSap[i] += v);
            j.disc.split('-').map(Number).forEach((v, i) => totaisDisc[i] += v);
        });

        desenhar('chartSapGeral', 'radar', ['S1','S2','S3','S4','S5','S6','S7'], mediasSap.map(v => v/dadosGlobais.length), 'Média Turma');
        desenhar('chartDiscGeral', 'bar', ['D', 'I', 'S', 'C'], totaisDisc, 'Total DISC Turma');
    }

    function desenhar(id, type, labels, data, label) {
        if (charts[id]) charts[id].destroy();
        charts[id] = new Chart(document.getElementById(id).getContext('2d'), {
            type: type,
            data: {
                labels: labels,
                datasets: [{
                    label: label,
                    data: data,
                    backgroundColor: 'rgba(0, 86, 179, 0.2)',
                    borderColor: '#0056b3',
                    borderWidth: 2
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    async function excluirInd(nome) {
        if (confirm(`Excluir dados de ${nome}?`)) {
            await fetch(`${URL_API}?action=delete&nome=${encodeURIComponent(nome)}`, { mode: 'no-cors' });
            setTimeout(carregarDados, 1500);
        }
    }

    async function excluirTudo() {
        if (confirm("⚠️ APAGAR TUDO?")) {
            await fetch(`${URL_API}?action=deleteAll`, { mode: 'no-cors' });
            setTimeout(carregarDados, 1500);
        }
    }

    carregarDados();
</script>
</body>
</html>
