<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Gestor Jorge Zensque</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .box { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 12px; border-top: 10px solid #0056b3; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 8px; text-align: center; min-height: 400px; }
        canvas { max-height: 250px !important; width: 100% !important; }
        .pixar-container { display: flex; justify-content: center; align-items: center; flex-direction: column; margin-top: 10px; min-height: 120px; }
        .pixar-img { width: 90px; height: 90px; border-radius: 50%; border: 3px solid #0056b3; object-fit: cover; }
        .pixar-label { font-weight: bold; color: #0056b3; font-size: 0.8em; margin-top: 5px; text-transform: uppercase; }
        select { padding: 12px; width: 60%; border-radius: 6px; border: 2px solid #0056b3; font-weight: bold; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #0056b3; color: white; }
    </style>
</head>
<body>

<script>
    // TRAVA DE SEGURANÇA
    const SENHA_MESTRE = "Miraiotsuru@2026#Z";
    let acesso = prompt("Digite a senha de acesso:");
    if (acesso !== SENHA_MESTRE) {
        alert("Acesso negado.");
        document.body.innerHTML = "<h1>Acesso Restrito</h1>";
        throw new Error("Senha incorreta");
    }
</script>

<div class="box">
    <h2 style="text-align:center; color: #0056b3;">PAINEL - GESTOR JORGE ZENSQUE</h2>
    
    <div style="text-align:center;">
        <select id="selectJovem" onchange="atualizarTudo()"><option value="">Selecione um jovem...</option></select>
    </div>

    <div class="dashboard">
        <div class="card"><h3>Individual: Competências SAP</h3><canvas id="chartSapInd"></canvas></div>
        <div class="card">
            <h3>Individual: Perfil DISC</h3>
            <div id="fotoInd" class="pixar-container"></div>
            <canvas id="chartDiscInd"></canvas>
        </div>

        <div class="card"><h3>Turma: Média Competências</h3><canvas id="chartSapGeral"></canvas></div>
        <div class="card">
            <h3>Turma: Cultura Predominante</h3>
            <div id="fotoGeral" class="pixar-container"></div>
            <canvas id="chartDiscGeral"></canvas>
        </div>
    </div>

    <table>
        <thead><tr><th>Nome</th><th>Valores SAP</th><th>DISC</th></tr></thead>
        <tbody id="corpoTabela"></tbody>
    </table>
</div>

<script>
    const URL_API = "https://script.google.com/macros/s/AKfycbwua4hn4gHs053z4_17z3JvBO2C_8jyTSrjD4vFIas0SsNUjIeUEnBbe5lO2RDGuzzJ/exec";
    
    const BICHOS = {
        'D': { nome: 'LEÃO', url: 'D.png' },
        'I': { nome: 'PAPAGAIO', url: 'I.png' },
        'S': { nome: 'PANDA', url: 'S.png' },
        'C': { nome: 'CORUJA', url: 'C.png' }
    };

    let dadosGlobais = [];
    let charts = {};

    async function carregarDados() {
        try {
            const res = await fetch(URL_API);
            dadosGlobais = await res.json();
            const select = document.getElementById('selectJovem');
            const tabela = document.getElementById('corpoTabela');
            select.innerHTML = '<option value="">Escolha um Jovem...</option>';
            tabela.innerHTML = "";

            dadosGlobais.forEach((item, index) => {
                select.innerHTML += `<option value="${index}">${item.nome}</option>`;
                tabela.innerHTML += `<tr><td>${item.nome}</td><td>${item.sap}</td><td>${item.disc}</td></tr>`;
            });

            renderizarGeral(); // Desenha os gráficos da turma assim que carrega
        } catch (e) { console.error("Erro ao carregar dados."); }
    }

    function desenhar(id, type, labels, data, label) {
        if (charts[id]) charts[id].destroy();
        const ctx = document.getElementById(id).getContext('2d');
        const cores = ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71'];

        charts[id] = new Chart(ctx, {
            type: type,
            data: {
                labels: labels,
                datasets: [{
                    label: label,
                    data: data,
                    backgroundColor: id.includes('Disc') ? cores : 'rgba(0, 86, 179, 0.4)',
                    borderColor: id.includes('Disc') ? '#fff' : '#0056b3',
                    borderWidth: 2
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    function atualizarTudo() {
        const idx = document.getElementById('selectJovem').value;
        if (idx === "") return;
        const j = dadosGlobais[idx];

        // Processar DISC Individual
        const partes = j.disc.replace(/--/g, '-').split('-').filter(p => p !== "").map(v => Math.abs(Number(v)));
        const vDisc = partes.slice(0, 4);
        
        // Predominante Individual
        let maxVal = -1, dominante = 'D';
        const siglas = ['D', 'I', 'S', 'C'];
        vDisc.forEach((v, i) => { if (v > maxVal) { maxVal = v; dominante = siglas[i]; } });

        document.getElementById('fotoInd').innerHTML = `<img src="${BICHOS[dominante].url}" class="pixar-img"><span class="pixar-label">PREDOMINANTE: ${BICHOS[dominante].nome}</span>`;
        
        desenhar('chartSapInd', 'radar', ['PROT', 'RESP', 'COM', 'CID', 'SOL', 'EQUIP', 'APR'], JSON.parse(j.sap), 'Individual SAP');
        desenhar('chartDiscInd', 'pie', ['D', 'I', 'S', 'C'], vDisc, 'Perfil DISC');
    }

    function renderizarGeral() {
        if (!dadosGlobais.length) return;
        let mediasSap = [0,0,0,0,0,0,0], totaisDisc = [0,0,0,0];

        dadosGlobais.forEach(j => {
            JSON.parse(j.sap).forEach((v, i) => mediasSap[i] += Number(v));
            j.disc.replace(/--/g, '-').split('-').filter(p => p !== "").slice(0, 4).forEach((v, i) => totaisDisc[i] += Math.abs(Number(v)));
        });

        // Predominante da Turma
        let maxGeral = -1, domGeral = 'D';
        const siglas = ['D', 'I', 'S', 'C'];
        totaisDisc.forEach((v, i) => { if (v > maxGeral) { maxGeral = v; domGeral = siglas[i]; } });

        document.getElementById('fotoGeral').innerHTML = `<img src="${BICHOS[domGeral].url}" class="pixar-img"><span class="pixar-label">CULTURA: ${BICHOS[domGeral].nome}</span>`;

        desenhar('chartSapGeral', 'radar', ['PROT', 'RESP', 'COM', 'CID', 'SOL', 'EQUIP', 'APR'], mediasSap.map(v => v/dadosGlobais.length), 'Média Turma');
        desenhar('chartDiscGeral', 'bar', ['D', 'I', 'S', 'C'], totaisDisc, 'Total Perfis');
    }

    carregarDados();
</script>
</body>
</html>
