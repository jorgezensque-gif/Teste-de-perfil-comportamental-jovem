<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Gestor Jorge Zensque - DISC Animado</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .box { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 12px; border-top: 10px solid #0056b3; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 8px; text-align: center; }
        canvas { max-height: 250px !important; width: 100% !important; }
        
        /* Estilo dos Personagens Pixar */
        .avatar-container { margin-top: 10px; display: none; text-align: center; }
        .avatar-img { width: 140px; height: 140px; border-radius: 50%; border: 4px solid #0056b3; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .perfil-text { font-weight: bold; color: #0056b3; margin-top: 5px; }
    </style>
</head>
<body>
<div class="box">
    <h2 style="text-align:center; color: #0056b3;">PAINEL GESTOR - JORGE</h2>

    <div style="text-align:center; margin-bottom: 20px;">
        <select id="selectJovem" onchange="atualizarGraficosIndividuais()" style="padding: 10px; width: 50%;">
            <option value="">Selecione um jovem...</option>
        </select>
    </div>

    <div class="dashboard">
        <div class="card">
            <h3>Individual: Radar SAP</h3>
            <canvas id="chartSapInd"></canvas>
        </div>
        
        <div class="card">
            <h3>Individual: Perfil DISC</h3>
            <canvas id="chartDiscInd"></canvas>
            <div id="containerAvatarInd" class="avatar-container">
                <img id="imgAvatarInd" class="avatar-img" src="">
                <div id="labelAvatarInd" class="perfil-text"></div>
            </div>
        </div>

        <div class="card">
            <h3>Turma: Perfil Geral</h3>
            <canvas id="chartDiscGeral"></canvas>
            <div id="containerAvatarGeral" class="avatar-container" style="display:block;">
                <img id="imgAvatarGeral" class="avatar-img" src="">
                <div id="labelAvatarGeral" class="perfil-text"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // IMPORTANTE: Use os nomes dos arquivos que você salvou no seu Mac
    const FOTOS = {
        'D': 'leao_D.jpg', 
        'I': 'papagaio_I.jpg', 
        'S': 'panda_S.jpg', 
        'C': 'coruja_C.jpg'
    };

    let dadosGlobais = [];
    let charts = {};

    // Função para pegar o perfil dominante
    function getDominante(arr) {
        const p = ['D', 'I', 'S', 'C'];
        return p[arr.indexOf(Math.max(...arr))];
    }

    async function carregarDados() {
        // Simulação da sua API
        const res = await fetch("SUA_URL_DA_API_AQUI");
        dadosGlobais = await res.json();
        // ... (lógica para preencher o select)
        renderizarGraficosGerais();
    }

    function atualizarGraficosIndividuais() {
        const idx = document.getElementById('selectJovem').value;
        if (!idx) return;
        const j = dadosGlobais[idx];
        const disc = j.disc.split('-').map(v => Math.abs(Number(v)));
        const dom = getDominante(disc);

        // Mostra Personagem Individual
        document.getElementById('imgAvatarInd').src = FOTOS[dom];
        document.getElementById('labelAvatarInd').innerText = "Perfil: " + dom;
        document.getElementById('containerAvatarInd').style.display = "block";
        
        // ... (lógica do Chart.js para desenhar os gráficos)
    }

    function renderizarGraficosGerais() {
        // Lógica para calcular a média da turma
        // Supondo que a Conformidade (C) seja a maior (conforme seu print):
        document.getElementById('imgAvatarGeral').src = FOTOS['C']; 
        document.getElementById('labelAvatarGeral').innerText = "Cultura da Turma: Conformidade";
    }

    carregarDados();
</script>
</body>
</html>
