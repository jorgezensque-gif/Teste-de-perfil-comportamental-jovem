<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Gestor Jorge 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; color: #333; padding: 20px; }
        .container { background: white; padding: 25px; border-radius: 15px; max-width: 1100px; margin: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .chart-box { border: 1px solid #eee; border-radius: 10px; padding: 15px; }
        
        /* BOTÃO DE GERAR LINK - AGORA NO PAINEL ADM */
        .btn-gerar-link {
            background: #007bff; color: white; padding: 12px 20px; border-radius: 8px;
            text-decoration: none; font-weight: bold; display: inline-block; margin-bottom: 20px;
        }
        .btn-gerar-link:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <a href="#" class="btn-gerar-link" onclick="enviarLinkTurma()">🔗 GERAR LINK E ENVIAR PARA TURMA VIA WHATSAPP</a>

    <div class="header">
        <div>
            <h1 style="color: #0056b3; margin: 0;">Gestor Jorge 2026</h1>
            <p style="margin: 5px 0;">Painel de Inteligência Socioemocional</p>
        </div>
        <select id="filtroJovem" style="padding: 8px; border-radius: 5px;">
            <option>Selecione um Aluno...</option>
            <option value="jorge">JORGE</option>
        </select>
    </div>

    <div class="charts-grid">
        <div class="chart-box">
            <h3 style="text-align: center;">Individual: Competências SAP</h3>
            <canvas id="radarChart"></canvas>
        </div>
        <div class="chart-box">
            <h3 style="text-align: center;">Individual: Perfil DISC</h3>
            <canvas id="pieChart"></canvas>
        </div>
    </div>

    <div style="background: #fff9db; padding: 20px; border-radius: 10px; border: 1px solid #ffe066;">
        <h3 style="text-align: center; margin-top: 0;">📊 INTELIGÊNCIA COLETIVA DA TURMA</h3>
        <div class="charts-grid">
            <canvas id="radarGeral"></canvas>
            <canvas id="barGeral"></canvas>
        </div>
    </div>
</div>

<script>
    // FUNÇÃO PARA VOCÊ MANDAR O LINK PARA A TURMA
    function enviarLinkTurma() {
        // Altere o link abaixo para o link do seu site de resposta (o teste.html)
        const linkDoTeste = "https://jorgezensque-gif.github.io/teste.html"; 
        const mensagem = `Olá Jovens! Aqui é o Educador Social Jorge. 🚀%0A%0APor favor, respondam à Avaliação Socioemocional no link abaixo:%0A${linkDoTeste}`;
        window.open(`https://wa.me/?text=${mensagem}`, '_blank');
    }

    // Os códigos de inicialização dos seus gráficos (Chart.js) continuam aqui...
    // Mantenha as funções que puxam os dados da sua planilha Google.
</script>
</body>
</html>
