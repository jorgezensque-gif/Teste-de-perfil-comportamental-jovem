<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Gestor Jorge Zensque</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .box { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 12px; border-top: 10px solid #0056b3; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-wa { background: #25d366; color: white; padding: 15px; border-radius: 8px; text-decoration: none; font-weight: bold; display: block; text-align: center; margin-bottom: 20px; }
        .btn-liberar { background: #f39c12; color: white; padding: 15px; border-radius: 8px; text-decoration: none; font-weight: bold; display: block; text-align: center; margin-bottom: 20px; border: none; width: 100%; cursor: pointer; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 8px; text-align: center; min-height: 450px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        canvas { max-height: 250px !important; width: 100% !important; }
        .controles { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        select { padding: 12px; width: 60%; border-radius: 6px; border: 1px solid #0056b3; font-weight: bold; }
        
        /* Estilo para as Fotos Pixar */
        .pixar-container { margin-top: 10px; text-align: center; }
        .pixar-img { width: 120px; height: 120px; border-radius: 50%; border: 4px solid #0056b3; object-fit: cover; box-shadow: 0 4px 8px rgba(0,0,0,0.2); background: #eee; }
        .pixar-label { font-weight: bold; color: #0056b3; margin-top: 5px; font-size: 14px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9em; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #0056b3; color: white; }
        .btn-refresh { padding: 10px 20px; cursor: pointer; background: #0056b3; color: white; border: none; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>
<div class="box">
    <h2 style="text-align:center; color: #0056b3;">PAINEL - GESTOR JORGE ZENSQUE</h2>
    
    <a href="#" id="linkWA" class="btn-wa" target="_blank">📲 ENVIAR LINK PADRÃO (WHATSAPP)</a>
    <button onclick="gerarLinkReset()" class="btn-liberar">🔓 GERAR LINK PARA REFAZER TESTE (LIMPAR TRAVA)</button>

    <div class="controles">
        <select id="selectJovem" onchange="atualizarGraficosIndividuais()"><option value="">Selecione um jovem...</option></select>
        <button class="btn-refresh" onclick="carregarDados()">🔄 Atualizar Dados</button>
    </div>

    <div class="dashboard">
        <div class="card"><h3>Individual: SAP (Radar)</h3><canvas id="chartSapInd"></canvas></div>
        
        <div class="card">
            <h3>Individual: Perfil DISC</h3>
            <canvas id="chartDiscInd"></canvas>
            <div id="boxPixarInd" class="pixar-container" style="display:none;">
                <img id="imgPixarInd" src="" class="pixar-img">
                <div id="labelPixarInd" class="pixar-label"></div>
            </div>
        </div>

        <div class="card"><h3>Turma: Média SAP Geral</h3><canvas id="chartSapGeral"></canvas></div>
        
        <div class="card">
            <h3>Turma: Perfil Geral (DISC)</h3>
            <canvas id="chartDiscGeral"></canvas>
            <div id="boxPixarGeral" class="pixar-container">
                <img id="imgPixarGeral" src="" class="pixar-img">
                <div id="labelPixarGeral" class="pixar-label"></div>
            </div>
        </div>
    </div>

    <table>
        <thead><tr><th>Nome</th><th>Valores SAP</th><th>DISC</th></tr></thead>
        <tbody id="corpoTabela"></tbody>
    </table>
</div>

<script>
    const SENHA_MESTRE = "Miraiotsuru@2026#Z";
    let acesso = prompt("Digite a senha de acesso:");
    if (acesso !== SENHA_MESTRE) { alert("Acesso negado"); document.body.innerHTML=""; throw new Error(); }

    const URL_API = "https://script.google.com/macros/s/AKfycbwua4hn4gHs053z4_17z3JvBO2C_8jyTSrjD4vFIas0SsNUjIeUEnBbe5lO2RDGuzzJ/exec";
    let dadosGlobais = [];
    let charts = {};

    async function carregarDados() {
        try {
            const res = await fetch(URL_API);
            dadosGlobais = await res.json();
            const select = document.getElementById('selectJovem');
            select.innerHTML = '<option value="">Selecione um jovem...</option>';
            const tabela = document.getElementById('corpoTabela');
            tabela.innerHTML = "";
            dadosGlobais.forEach((item, index) => {
                select.innerHTML += `<option value="${index}">${item.nome}</option>`;
                tabela.innerHTML += `<tr><td>${item.nome}</td><td>${item.sap}</td><td>${item.disc}</td></tr>`;
            });
            renderizarGraficosGerais();
        } catch (e) { console.error("Erro ao carregar."); }
    }

    function desenhar(id, type, labels, data, label) {
        if (charts[id]) charts[id].destroy();
        const ctx = document.getElementById(id).getContext('2d');
        const cores = ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71'];
        charts[id] = new Chart(ctx, {
            type: type,
            data: { labels: labels, datasets: [{ label: label, data: data, backgroundColor: id.includes('Disc') ? cores : 'rgba(0,86,179,0.4)', borderColor: '#0056b3', borderWidth: 2 }] },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    function atualizarGraficosIndividuais() {
        const idx = document.getElementById('selectJovem').value;
        if (idx === "") return;
        const j = dadosGlobais[idx];
        const discVals = j.disc.split('-').map(v => Math.abs(Number(v)));
        
        desenhar('chartSapInd', 'radar', ['PROTAGONISMO', 'RESPONSABILIDADE', 'COMUNICAÇÃO', 'CIDADANIA', 'SOLUÇÃO', 'EQUIPE', 'APRENDER'], JSON.parse(j.sap), 'Individual SAP');
        desenhar('chartDiscInd', 'pie', ['D', 'I', 'S', 'C'], discVals, 'Perfil DISC');

        // Lógica da Imagem - Jorge, agora usando os nomes curtos que você salvou
        const perfis = ['D', 'I', 'S', 'C'];
        const dominante = perfis[discVals.indexOf(Math.max(...discVals))];
        
        document.getElementById('imgPixarInd').src = dominante + ".jpg"; 
        document.getElementById('labelPixarInd').innerText = "DOMINANTE: " + dominante;
        document.getElementById('boxPixarInd').style.display = "block";
    }

    function renderizarGraficosGerais() {
        if (!dadosGlobais.length) return;
        let totaisDisc = [0,0,0,0];
        dadosGlobais.forEach(j => {
            j.disc.split('-').map(Number).forEach((v, i) => totaisDisc[i] += Math.abs(v));
        });
        desenhar('chartDiscGeral', 'bar', ['D', 'I', 'S', 'C'], totaisDisc, 'Soma Turma');
        
        const perfis = ['D', 'I', 'S', 'C'];
        const domTurma = perfis[totaisDisc.indexOf(Math.max(...totaisDisc))];
        document.getElementById('imgPixarGeral').src = domTurma + ".jpg";
        document.getElementById('labelPixarGeral').innerText = "CULTURA: " + domTurma;
    }

    carregarDados();
</script>
</body>
</html>
