<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Gestor Jorge Zensque</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .box { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 12px; border-top: 10px solid #0056b3; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-wa { background: #25d366; color: white; padding: 15px; border-radius: 8px; text-decoration: none; font-weight: bold; display: block; text-align: center; margin-bottom: 20px; }
        .btn-liberar { background: #f39c12; color: white; padding: 15px; border-radius: 8px; text-decoration: none; font-weight: bold; display: block; text-align: center; margin-bottom: 20px; border: none; width: 100%; cursor: pointer; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 8px; text-align: center; min-height: 450px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        canvas { max-height: 250px !important; width: 100% !important; }
        .controles { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        select { padding: 12px; width: 60%; border-radius: 6px; border: 1px solid #0056b3; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9em; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #0056b3; color: white; }
        .btn-refresh { padding: 10px 20px; cursor: pointer; background: #0056b3; color: white; border: none; border-radius: 6px; font-weight: bold; }
        
        /* ESTILO DAS IMAGENS COMPORTAMENTAIS */
        .pixar-container { display: flex; justify-content: center; gap: 15px; margin-top: 10px; min-height: 140px; align-items: center; }
        .pixar-item { text-align: center; }
        .pixar-img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #0056b3; object-fit: cover; background: #eee; }
        .pixar-label { display: block; font-weight: bold; color: #0056b3; font-size: 0.85em; margin-top: 5px; text-transform: uppercase; }
    </style>
</head>
<body>

<script>
    // --- TRAVA DE SEGURANÇA MESTRE ---
    const SENHA_MESTRE = "Miraiotsuru@2026#Z";
    let acesso = prompt("Digite a senha de acesso ao Painel Gestor:");
    if (acesso !== SENHA_MESTRE) {
        alert("Senha incorreta! Acesso negado.");
        document.body.innerHTML = "<h1 style='text-align:center; margin-top:50px;'>Acesso Restrito</h1>";
        window.location.href = "index.html";
    }
</script>

<div class="box">
    <h2 style="text-align:center; color: #0056b3;">PAINEL - GESTOR JORGE ZENSQUE</h2>
    
    <a href="#" id="linkWA" class="btn-wa" target="_blank">📲 ENVIAR LINK PARA JOVENS (WHATSAPP)</a>
    <button onclick="gerarLinkReset()" class="btn-liberar">🔓 GERAR LINK PARA REFAZER TESTE (LIMPAR TRAVA)</button>

    <div class="controles">
        <select id="selectJovem" onchange="atualizarGraficosIndividuais()"><option value="">Carregando jovens...</option></select>
        <button class="btn-refresh" onclick="carregarDados()">🔄 Sincronizar Agora</button>
    </div>

    <div class="dashboard">
        <div class="card">
            <h3>Individual: Competências SAP</h3>
            <canvas id="chartSapInd"></canvas>
        </div>
        <div class="card">
            <h3>Individual: Perfil Comportamental</h3>
            <canvas id="chartDiscInd"></canvas>
            <div id="fotoInd" class="pixar-container"></div>
        </div>

        <div class="card">
            <h3>Turma: Média de Competências</h3>
            <canvas id="chartSapGeral"></canvas>
        </div>
        <div class="card">
            <h3>Turma: Cultura Predominante</h3>
            <canvas id="chartDiscGeral"></canvas>
            <div id="fotoGeral" class="pixar-container"></div>
        </div>
    </div>

    <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button class="btn-refresh" style="background: #2c3e50; flex: 1;" onclick="window.print()">🖨️ Gerar PDF do Painel</button>
        <button class="btn-refresh" style="background: #27ae60; flex: 1;" onclick="exportarExcel()">📊 Exportar Planilha Excel</button>
    </div>

    <table id="tabelaDados">
        <thead><tr><th>Nome</th><th>SAP (Valores)</th><th>DISC (D-I-S-C)</th></tr></thead>
        <tbody id="corpoTabela"></tbody>
    </table>
</div>

<script>
    const URL_API = "https://script.google.com/macros/s/AKfycbwua4hn4gHs053z4_17z3JvBO2C_8jyTSrjD4vFIas0SsNUjIeUEnBbe5lO2RDGuzzJ/exec";
    const SIGLAS = ['D', 'I', 'S', 'C'];
    const NOMES = {'D':'LEÃO','I':'PAPAGAIO','S':'PANDA','C':'CORUJA'};
    
    let dadosGlobais = [];
    let charts = {};

    function gerarLinkReset() {
        const urlBase = window.location.href.split('resultados.html')[0];
        const linkReset = urlBase + "teste.html?reset=true";
        navigator.clipboard.writeText(linkReset);
        alert("Link de Reset copiado!");
    }

    async function carregarDados() {
        try {
            const res = await fetch(URL_API);
            dadosGlobais = await res.json();
            const select = document.getElementById('selectJovem');
            const tabela = document.getElementById('corpoTabela');
            
            select.innerHTML = '<option value="">Escolha um Jovem para analisar...</option>';
            tabela.innerHTML = "";

            dadosGlobais.forEach((item, index) => {
                select.innerHTML += `<option value="${index}">${item.nome}</option>`;
                tabela.innerHTML += `<tr><td>${item.nome}</td><td>${item.sap}</td><td>${item.disc}</td></tr>`;
            });

            renderizarGraficosGerais();
        } catch (e) { alert("Erro ao conectar com a base de dados."); }
    }

    function desenhar(id, type, labels, data, label) {
        if (charts[id]) charts[id].destroy();
        const ctx = document.getElementById(id).getContext('2d');
        const cores = ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71'];

        charts[id] = new Chart(ctx, {
            type: type,
            data: { 
                labels: labels, 
                datasets: [{ 
                    label: label, 
                    data: data, 
                    backgroundColor: id.includes('Disc') ? cores : 'rgba(0, 86, 179, 0.2)', 
                    borderColor: '#0056b3',
                    borderWidth: 2 
                }] 
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                scales: type === 'radar' ? { r: { min: 0, max: 5 } } : {}
            }
        });
    }

    function atualizarGraficosIndividuais() {
        const idx = document.getElementById('selectJovem').value;
        if (idx === "") return;
        const j = dadosGlobais[idx];
        const vDisc = j.disc.split('-').map(v => Math.abs(Number(v)));
        
        // Gráficos
        desenhar('chartSapInd', 'radar', ['PROT', 'RESP', 'COM', 'CID', 'SOL', 'EQUIP', 'APR'], JSON.parse(j.sap), 'Individual');
        desenhar('chartDiscInd', 'pie', SIGLAS, vDisc, 'Perfil');

        // REGRA 1: INDIVIDUAL - APENAS MAIOR AMPLITUDE
        let maiorVal = Math.max(...vDisc);
        let dominante = SIGLAS[vDisc.indexOf(maiorVal)];
        
        document.getElementById('fotoInd').innerHTML = `
            <div class="pixar-item">
                <img src="${dominante}.png" class="pixar-img">
                <span class="pixar-label">PREDOMINANTE: ${NOMES[dominante]}</span>
            </div>`;
    }

    function renderizarGraficosGerais() {
        let mediasSap = [0,0,0,0,0,0,0], totaisDisc = [0,0,0,0];
        
        dadosGlobais.forEach(j => {
            JSON.parse(j.sap).forEach((v, i) => mediasSap[i] += Number(v));
            j.disc.split('-').forEach((v, i) => totaisDisc[i] += Math.abs(Number(v)));
        });

        desenhar('chartSapGeral', 'radar', ['PROT', 'RESP', 'COM', 'CID', 'SOL', 'EQUIP', 'APR'], mediasSap.map(v => v/dadosGlobais.length), 'Média');
        desenhar('chartDiscGeral', 'bar', SIGLAS, totaisDisc, 'Soma Turma');

        // REGRA 2: GERAL - DUAS IMAGENS (MENOR PARA MAIOR)
        let lista = totaisDisc.map((v, i) => ({ valor: v, sigla: SIGLAS[i], nome: NOMES[SIGLAS[i]] }));
        lista.sort((a, b) => a.valor - b.valor); // Escada: Menor -> Maior

        const top2 = [lista[2], lista[3]]; // As duas maiores amplitudes
        let htmlGeral = "";
        top2.forEach(item => {
            htmlGeral += `
                <div class="pixar-item">
                    <img src="${item.sigla}.png" class="pixar-img">
                    <span class="pixar-label">${item.nome} (${item.valor.toFixed(0)})</span>
                </div>`;
        });
        document.getElementById('fotoGeral').innerHTML = htmlGeral;
    }

    function exportarExcel() {
        let csv = "\ufeffNome;SAP;DISC\n"; 
        dadosGlobais.forEach(item => { csv += `${item.nome};"${item.sap}";${item.disc}\n`; });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.setAttribute("download", "Relatorio_Projeto_Pescar.csv");
        link.click();
    }

    carregarDados();
</script>
</body>
</html>
