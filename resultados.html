<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Gestor Jorge 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .box { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 12px; border-top: 10px solid #0056b3; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 8px; text-align: center; }
        canvas { max-height: 280px; width: 100% !important; }
        select { padding: 12px; width: 60%; border-radius: 6px; border: 1px solid #0056b3; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background: #0056b3; color: white; }
    </style>
</head>
<body>
<div class="box">
    <h2 style="text-align:center;">PAINEL DE CONTROLE - GESTOR JORGE</h2>
    <div style="text-align:center; margin-bottom:20px;">
        <select id="selectJovem" onchange="atualizarGraficosIndividuais()">
            <option value="">Selecione um jovem para análise...</option>
        </select>
        <button onclick="carregarDados()" style="padding:10px;">🔄 Atualizar</button>
    </div>

    <div class="dashboard">
        <div class="card"><h3>Individual: SAP (Escala 5)</h3><canvas id="chartSapInd"></canvas></div>
        <div class="card"><h3>Individual: Perfil DISC</h3><canvas id="chartDiscInd"></canvas></div>
        <div class="card"><h3>Turma: Média SAP</h3><canvas id="chartSapGeral"></canvas></div>
        <div class="card"><h3>Turma: Total DISC</h3><canvas id="chartDiscGeral"></canvas></div>
    </div>

    <table id="tabelaDados">
        <thead><tr><th>Nome</th><th>SAP</th><th>DISC</th><th>Ação</th></tr></thead>
        <tbody id="corpoTabela"></tbody>
    </table>
</div>

<script>
    const URL_API = "https://script.google.com/macros/s/AKfycbyHHscPDi3fZ55Hp6YvjZqciHhBJNzUIgoXCcCG_Trghhz71EdpsSSG8tXpveLxCtdb/exec";
    let dadosGlobais = [];
    let charts = {};

    async function carregarDados() {
        try {
            const res = await fetch(URL_API);
            dadosGlobais = await res.json();
            const select = document.getElementById('selectJovem');
            const tabela = document.getElementById('corpoTabela');
            select.innerHTML = '<option value="">Selecione um jovem...</option>';
            tabela.innerHTML = "";
            dadosGlobais.forEach((item, index) => {
                select.innerHTML += `<option value="${index}">${item.nome}</option>`;
                tabela.innerHTML += `<tr><td>${item.nome}</td><td>${item.sap}</td><td>${item.disc}</td><td><button onclick="excluirInd('${item.nome}')">Excluir</button></td></tr>`;
            });
            renderizarGraficosGerais();
        } catch (e) { alert("Erro ao conectar na API Versão 6."); }
    }

    function atualizarGraficosIndividuais() {
        const idx = document.getElementById('selectJovem').value;
        if (idx === "") return;
        const j = dadosGlobais[idx];
        desenhar('chartSapInd', 'radar', ['S1','S2','S3','S4','S5','S6','S7'], JSON.parse(j.sap), 'SAP (1-5)', 5);
        desenhar('chartDiscInd', 'pie', ['D', 'I', 'S', 'C'], j.disc.split('-').map(Number), 'Perfil DISC');
    }

    function renderizarGraficosGerais() {
        if (!dadosGlobais.length) return;
        let mediasSap = [0,0,0,0,0,0,0], totaisDisc = [0,0,0,0];
        dadosGlobais.forEach(j => {
            JSON.parse(j.sap).forEach((v, i) => mediasSap[i] += v);
            j.disc.split('-').map(Number).forEach((v, i) => totaisDisc[i] += v);
        });
        desenhar('chartSapGeral', 'radar', ['S1','S2','S3','S4','S5','S6','S7'], mediasSap.map(v => v/dadosGlobais.length), 'Média Turma (1-5)', 5);
        desenhar('chartDiscGeral', 'bar', ['D', 'I', 'S', 'C'], totaisDisc, 'Total DISC');
    }

    function desenhar(id, type, labels, data, label, maxVal) {
        if (charts[id]) charts[id].destroy();
        const config = {
            type: type,
            data: { labels: labels, datasets: [{ label: label, data: data, backgroundColor: 'rgba(0, 86, 179, 0.2)', borderColor: '#0056b3', borderWidth: 2 }] },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                scales: (type === 'radar' || type === 'bar') ? { r: { min: 0, max: 5 }, y: { min: 0, max: 5 } } : {}
            }
        };
        charts[id] = new Chart(document.getElementById(id), config);
    }

    async function excluirInd(n) { if(confirm("Apagar?")) { await fetch(URL_API+"?action=delete&nome="+n, {mode:'no-cors'}); setTimeout(carregarDados, 1500); } }
    
    carregarDados();
</script>
</body>
</html>
