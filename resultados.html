<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor Jorge 2026 - Painel de Inteligência</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #1c1e21; padding: 20px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e4e6eb; padding-bottom: 20px; margin-bottom: 30px; }
        .grid-graficos { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .chart-container { background: #fff; padding: 20px; border: 1px solid #e4e6eb; border-radius: 12px; min-height: 350px; }
        h2 { color: #1a73e8; margin: 0; }
        select { padding: 12px; border-radius: 8px; border: 1px solid #ccd0d5; font-size: 16px; cursor: pointer; background: #fff; }
        .title-chart { text-align: center; font-weight: bold; margin-bottom: 10px; color: #4b4b4b; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h2>Gestor Jorge 2026</h2>
            <small>Painel de Inteligência Socioemocional</small>
        </div>
        <select id="selectAluno">
            <option value="">Carregando dados da planilha...</option>
        </select>
    </div>

    <div class="grid-graficos">
        <div class="chart-container">
            <div class="title-chart">Competências SAP (Radar)</div>
            <canvas id="radarSAP"></canvas>
        </div>
        <div class="chart-container">
            <div class="title-chart">Perfil Comportamental DISC</div>
            <canvas id="pizzaDISC"></canvas>
        </div>
    </div>
</div>

<script>
    // --- SEGURANÇA ---
    const pass = prompt("Acesso Restrito. Digite a senha:");
    if (pass !== "JORGE2026") {
        alert("Acesso Negado!");
        window.location.href = "https://google.com";
    }

    // --- CONFIGURAÇÃO ---
    const csvURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQZ6O-GfmHDaViJQv3cwJlz9heWuG9IKLCntXWE0BdPaZPo3k_bnJgC8KxQjn5LxbgNLvSLsBSNT_d4/pub?output=csv";
    let dadosGlobais = [];
    let charts = {};

    async function carregarDados() {
        try {
            const res = await fetch(csvURL);
            const csv = await res.text();
            // Divide linhas e trata vírgulas dentro de aspas (comum em CSV do Google)
            const linhas = csv.split('\n').map(l => l.split(','));
            dadosGlobais = linhas.slice(1); 

            const select = document.getElementById('selectAluno');
            select.innerHTML = '<option value="">Selecione um Aluno...</option>';
            
            dadosGlobais.forEach((linha, index) => {
                if(linha[0] && linha[0].trim() !== "") {
                    let opt = document.createElement('option');
                    opt.value = index;
                    opt.innerHTML = linha[0];
                    select.appendChild(opt);
                }
            });
        } catch (e) {
            alert("Erro ao conectar com a planilha. Verifique se ela está 'Publicada na Web' como CSV.");
        }
    }

    document.getElementById('selectAluno').onchange = function() {
        const idx = this.value;
        if(idx !== "") {
            const d = dadosGlobais[idx];
            atualizarGraficos(d);
        }
    };

    function atualizarGraficos(d) {
        // --- 1. RADAR SAP ---
        const ctxRadar = document.getElementById('radarSAP').getContext('2d');
        if(charts.radar) charts.radar.destroy();
        charts.radar = new Chart(ctxRadar, {
            type: 'radar',
            data: {
                labels: ["Protagonismo", "Responsabilidade", "Comunicação", "Ética", "Problemas", "Equipe", "Aprender"],
                datasets: [{
                    label: d[0],
                    data: [d[1], d[2], d[3], d[4], d[5], d[6], d[7]],
                    backgroundColor: 'rgba(26, 115, 232, 0.2)',
                    borderColor: '#1a73e8',
                    borderWidth: 3,
                    pointBackgroundColor: '#1a73e8'
                }]
            },
            options: { scales: { r: { beginAtZero: true, max: 5 } } }
        });

        // --- 2. PIZZA DISC ---
        const ctxPizza = document.getElementById('pizzaDISC').getContext('2d');
        if(charts.pizza) charts.pizza.destroy();
        
        // Se a coluna I (DISC) estiver vazia, ele divide igual. 
        // Se tiver dados tipo 10-40-20-30, ele desenha o perfil real.
        const discRaw = d[8] ? d[8].split('-') : [25, 25, 25, 25];
        const discData = discRaw.map(v => parseFloat(v));

        charts.pizza = new Chart(ctxPizza, {
            type: 'pie',
            data: {
                labels: ["Dominância", "Influência", "Estabilidade", "Conformidade"],
                datasets: [{
                    data: discData,
                    backgroundColor: ['#e74c3c', '#f1c40f', '#2ecc71', '#3498db'],
                    borderWidth: 2
                }]
            },
            options: {
                plugins: {
                    legend: { position: 'bottom' }
                }
            }
        });
    }

    carregarDados();
</script>

</body>
</html>
