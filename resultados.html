<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Gestor Jorge Zensque</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .box { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 12px; border-top: 10px solid #0056b3; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 8px; text-align: center; min-height: 520px; display: flex; flex-direction: column; justify-content: space-between; }
        canvas { max-height: 250px !important; width: 100% !important; }
        .pixar-container { display: flex; justify-content: center; gap: 20px; margin-top: 15px; min-height: 160px; align-items: center; }
        .pixar-item { text-align: center; }
        .pixar-img { width: 110px; height: 110px; border-radius: 50%; border: 4px solid #0056b3; object-fit: cover; background: #f9f9f9; }
        .pixar-label { display: block; font-weight: bold; color: #0056b3; font-size: 0.9em; margin-top: 8px; text-transform: uppercase; }
        select { padding: 12px; width: 60%; border-radius: 6px; border: 2px solid #0056b3; font-weight: bold; margin-bottom: 20px; }
        .btn-refresh { padding: 10px 20px; cursor: pointer; background: #0056b3; color: white; border: none; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <h2 style="text-align:center; color: #0056b3;">PAINEL - GESTOR JORGE ZENSQUE</h2>
    <div style="text-align:center;">
        <select id="selectJovem" onchange="atualizarGraficosIndividuais()"><option value="">Carregando...</option></select>
        <button class="btn-refresh" onclick="carregarDados()">🔄 Sincronizar</button>
    </div>

    <div class="dashboard">
        <div class="card">
            <h3>Individual: Competências SAP</h3>
            <canvas id="chartSapInd"></canvas>
            <div style="height: 160px;"></div>
        </div>
        <div class="card">
            <h3>Individual: Perfil DISC</h3>
            <canvas id="chartDiscInd"></canvas>
            <div id="fotoInd" class="pixar-container"></div>
        </div>

        <div class="card">
            <h3>Turma: Média Competências</h3>
            <canvas id="chartSapGeral"></canvas>
            <div style="height: 160px;"></div>
        </div>
        <div class="card">
            <h3>Turma: Cultura Predominante</h3>
            <canvas id="chartDiscGeral"></canvas>
            <div id="fotoGeral" class="pixar-container"></div>
        </div>
    </div>
</div>

<script>
    const URL_API = "https://script.google.com/macros/s/AKfycbwua4hn4gHs053z4_17z3JvBO2C_8jyTSrjD4vFIas0SsNUjIeUEnBbe5lO2RDGuzzJ/exec";
    
    // Mapeamento Centralizado e Seguro
    const INFO_BICHOS = {
        'D': { nome: 'LEÃO', arq: 'D.png' },
        'I': { nome: 'PAPAGAIO', arq: 'I.png' },
        'S': { nome: 'PANDA', arq: 'S.png' },
        'C': { nome: 'CORUJA', arq: 'C.png' }
    };
    
    const SIGLAS = ['D', 'I', 'S', 'C'];
    let dadosGlobais = [];
    let charts = {};

    async function carregarDados() {
        try {
            const res = await fetch(URL_API);
            dadosGlobais = await res.json();
            const select = document.getElementById('selectJovem');
            select.innerHTML = '<option value="">Escolha um Jovem...</option>';
            dadosGlobais.forEach((item, index) => {
                select.innerHTML += `<option value="${index}">${item.nome}</option>`;
            });
            renderizarGraficosGerais();
        } catch (e) { console.error("Erro de conexão."); }
    }

    function desenhar(id, type, labels, data, label) {
        if (charts[id]) charts[id].destroy();
        const ctx = document.getElementById(id).getContext('2d');
        charts[id] = new Chart(ctx, {
            type: type,
            data: { 
                labels: labels, 
                datasets: [{ 
                    label: label, 
                    data: data, 
                    backgroundColor: id.includes('Disc') ? ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71'] : 'rgba(0, 86, 179, 0.2)', 
                    borderColor: '#0056b3', borderWidth: 2 
                }] 
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    function atualizarGraficosIndividuais() {
        const idx = document.getElementById('selectJovem').value;
        if (idx === "") return;
        const j = dadosGlobais[idx];
        const vDisc = j.disc.split('-').map(v => Math.abs(Number(v)));
        
        desenhar('chartSapInd', 'radar', ['PROT', 'RESP', 'COM', 'CID', 'SOL', 'EQUIP', 'APR'], JSON.parse(j.sap), 'Individual');
        desenhar('chartDiscInd', 'pie', SIGLAS, vDisc, 'Perfil');

        // LÓGICA INDIVIDUAL: APENAS 1 BICHO (O MAIOR)
        let maxIdx = vDisc.indexOf(Math.max(...vDisc));
        let dominante = SIGLAS[maxIdx];
        
        document.getElementById('fotoInd').innerHTML = `
            <div class="pixar-item">
                <img src="${INFO_BICHOS[dominante].arq}" class="pixar-img" onerror="this.src='https://via.placeholder.com/110?text=${dominante}'">
                <span class="pixar-label">PREDOMINANTE: ${INFO_BICHOS[dominante].nome}</span>
            </div>`;
    }

    function renderizarGraficosGerais() {
        let mediasSap = [0,0,0,0,0,0,0], totaisDisc = [0,0,0,0];
        dadosGlobais.forEach(j => {
            JSON.parse(j.sap).forEach((v, i) => mediasSap[i] += Number(v));
            j.disc.split('-').forEach((v, i) => totaisDisc[i] += Math.abs(Number(v)));
        });

        desenhar('chartSapGeral', 'radar', ['PROT', 'RESP', 'COM', 'CID', 'SOL', 'EQUIP', 'APR'], mediasSap.map(v => v/dadosGlobais.length), 'Média');
        desenhar('chartDiscGeral', 'bar', SIGLAS, totaisDisc, 'Total Turma');

        // LÓGICA TURMA: OBRIGATORIAMENTE OS 2 MAIORES
        let ranking = totaisDisc.map((v, i) => ({ valor: v, sigla: SIGLAS[i] }))
                                .sort((a, b) => b.valor - a.valor);

        let htmlTurma = "";
        for(let i=0; i<2; i++) {
            let item = ranking[i];
            htmlTurma += `
                <div class="pixar-item">
                    <img src="${INFO_BICHOS[item.sigla].arq}" class="pixar-img" onerror="this.src='https://via.placeholder.com/110?text=${item.sigla}'">
                    <span class="pixar-label">${INFO_BICHOS[item.sigla].nome} (${item.valor.toFixed(0)})</span>
                </div>`;
        }
        document.getElementById('fotoGeral').innerHTML = htmlTurma;
    }

    carregarDados();
</script>
</body>
</html>
