<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel de Inteligência Socioemocional - Jorge</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 10px solid #0056b3; }
        h2, h3 { color: #0056b3; margin-top: 0; text-align: center; }
        
        .gerador-link { background: #e7f3ff; padding: 15px; border-radius: 8px; margin-bottom: 25px; border: 1px dashed #0056b3; text-align: center; }
        .btn-whatsapp { background: #25d366; color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; font-size: 1.1em; }
        
        .controles { display: flex; gap: 10px; margin-bottom: 20px; }
        #buscaNome { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; }
        .btn-excluir-geral { background: #000; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .card-grafico { border: 1px solid #eee; padding: 15px; border-radius: 8px; background: #fff; }
        
        .secao-turma { margin-top: 40px; padding-top: 20px; border-top: 3px solid #f1c40f; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9em; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #0056b3; color: white; }
        .btn-row-del { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>PAINEL DE CONTROLE - GESTOR JORGE</h2>

    <div class="gerador-link">
        <p><strong>🔗 Enviar teste para a turma:</strong></p>
        <a href="https://api.whatsapp.com/send?text=Olá pessoal! Por favor, preencham o teste aqui: https://jorgezensque-gif.github.io/Teste-de-perfil-comportamental-jovem/teste.html" target="_blank" class="btn-whatsapp">
            📲 GERAR LINK E ENVIAR VIA WHATSAPP
        </a>
    </div>

    <div class="controles">
        <select id="selectJovem" onchange="atualizarGraficosIndividuais()" style="padding: 10px; border-radius: 6px; border: 1px solid #0056b3; font-weight: bold;">
            <option value="">Selecione um Jovem para analisar...</option>
        </select>
        <button class="btn-excluir-geral" onclick="excluirTudo()">⚠️ APAGAR TUDO</button>
    </div>

    <div class="dashboard">
        <div class="card-grafico">
            <h3>Individual: Competências SAP</h3>
            <canvas id="chartSapInd"></canvas>
        </div>
        <div class="card-grafico">
            <h3>Individual: Perfil DISC</h3>
            <canvas id="chartDiscInd"></canvas>
        </div>
    </div>

    <div class="secao-turma">
        <h3>📊 INTELIGÊNCIA COLETIVA DA TURMA</h3>
        <div class="dashboard">
            <div class="card-grafico">
                <h3>Média da Turma (SAP)</h3>
                <canvas id="chartSapGeral"></canvas>
            </div>
            <div class="card-grafico">
                <h3>Distribuição DISC da Turma</h3>
                <canvas id="chartDiscGeral"></canvas>
            </div>
        </div>
    </div>

    <div style="overflow-x:auto; margin-top:40px;">
        <table id="tabelaDados">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>SAP 1-7</th>
                    <th>DISC (D-I-S-C)</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
        </table>
    </div>
</div>

<script>
    const URL_API = "https://script.google.com/macros/s/AKfycbwwwi-8ZVUYTdmg3Pu1eU4ueK5HV1L7zJBni9b8qwT22w7f-O8CTB8c6OsbtMm73NE-/exec";
    let dadosGlobais = [];
    let charts = {};

    async function carregar() {
        try {
            const res = await fetch(URL_API);
            dadosGlobais = await res.json();
            
            const select = document.getElementById('selectJovem');
            const tabela = document.getElementById('corpoTabela');
            select.innerHTML = '<option value="">Selecione um Jovem...</option>';
            tabela.innerHTML = "";

            if (dadosGlobais.length > 0) {
                dadosGlobais.forEach((item, index) => {
                    select.innerHTML += `<option value="${index}">${item.nome}</option>`;
                    tabela.innerHTML += `
                        <tr>
                            <td>${item.nome}</td>
                            <td>${item.sap}</td>
                            <td>${item.disc}</td>
                            <td><button class="btn-row-del" onclick="excluirInd('${item.nome}')">Excluir</button></td>
                        </tr>`;
                });
                renderizarGraficosGerais();
            }
        } catch (e) { console.error(e); }
    }

    function atualizarGraficosIndividuais() {
        const idx = document.getElementById('selectJovem').value;
        if (idx === "") return;
        const j = dadosGlobais[idx];
        
        const sapValores = JSON.parse(j.sap); // Converte string "[1,2...]" em array
        const discValores = j.disc.split('-').map(Number);

        // 1. RADAR SAP INDIVIDUAL
        updateChart('chartSapInd', 'radar', ['SAP1', 'SAP2', 'SAP3', 'SAP4', 'SAP5', 'SAP6', 'SAP7'], sapValores, 'Competências');
        
        // 2. PIZZA DISC INDIVIDUAL
        updateChart('chartDiscInd', 'pie', ['Dominância', 'Influência', 'Estabilidade', 'Conformidade'], discValores, 'Perfil DISC');
    }

    function renderizarGraficosGerais() {
        // 3. RADAR SAP GERAL (MÉDIA)
        let mediasSap = [0,0,0,0,0,0,0];
        dadosGlobais.forEach(j => {
            JSON.parse(j.sap).forEach((v, i) => mediasSap[i] += v);
        });
        mediasSap = mediasSap.map(v => v / dadosGlobais.length);
        updateChart('chartSapGeral', 'radar', ['SAP1', 'SAP2', 'SAP3', 'SAP4', 'SAP5', 'SAP6', 'SAP7'], mediasSap, 'Média SAP Turma');

        // 4. BARRAS DISC GERAL
        let totaisDisc = [0,0,0,0];
        dadosGlobais.forEach(j => {
            j.disc.split('-').map(Number).forEach((v, i) => totaisDisc[i] += v);
        });
        updateChart('chartDiscGeral', 'bar', ['D', 'I', 'S', 'C'], totaisDisc, 'Total DISC Turma');
    }

    function updateChart(id, type, labels, data, label) {
        if (charts[id]) charts[id].destroy();
        charts[id] = new Chart(document.getElementById(id), {
            type: type,
            data: {
                labels: labels,
                datasets: [{
                    label: label,
                    data: data,
                    backgroundColor: ['rgba(0, 86, 179, 0.2)', 'rgba(255, 99, 132, 0.2)', 'rgba(255, 206, 86, 0.2)', 'rgba(75, 192, 192, 0.2)'],
                    borderColor: '#0056b3',
                    borderWidth: 2
                }]
            },
            options: { responsive: true }
        });
    }

    async function excluirInd(nome) {
        if (confirm(`Excluir ${nome}?`)) {
            await fetch(`${URL_API}?action=delete&nome=${encodeURIComponent(nome)}`, { mode: 'no-cors' });
            setTimeout(carregar, 1500);
        }
    }

    async function excluirTudo() {
        if (confirm("⚠️ APAGAR TUDO?")) {
            await fetch(`${URL_API}?action=deleteAll`, { mode: 'no-cors' });
            setTimeout(carregar, 1500);
        }
    }

    carregar();
</script>
</body>
</html>
