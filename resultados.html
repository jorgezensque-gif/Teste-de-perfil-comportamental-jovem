<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Gestor Jorge Zensque</title>
    
    <script>
        (function() {
            const senhaCorreta = "Miraiotsuru@2026#Z";
            const tentativa = prompt("🔒 Acesso Restrito. Digite a senha:");
            if (tentativa !== senhaCorreta) {
                alert("Acesso Negado!");
                window.location.href = "index.html";
                document.write("Acesso negado."); 
            }
        })();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #0056b3; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 12px solid var(--primary); }
        h2 { text-align: center; color: var(--primary); }
        .controles { display: flex; gap: 15px; justify-content: center; margin-bottom: 30px; padding: 20px; background: #f8f9fa; border-radius: 10px; }
        select { padding: 12px; width: 50%; border-radius: 8px; border: 2px solid var(--primary); font-size: 16px; font-weight: bold; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 25px; }
        .card { background: white; border: 1px solid #e1e4e8; padding: 20px; border-radius: 12px; text-align: center; }
        .chart-container { width: 100%; height: 300px; }
        .pixar-box { margin-top: 15px; display: flex; flex-direction: column; align-items: center; }
        .pixar-img { width: 160px; height: 160px; border-radius: 50%; border: 6px solid var(--primary); object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .pixar-label { font-weight: 800; color: var(--primary); margin-top: 10px; font-size: 18px; text-transform: uppercase; }
        .btn-sync { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 Painel de Performance - Gestor Jorge Zensque</h2>
    
    <div class="controles">
        <select id="selectJovem" onchange="atualizarGraficosIndividuais()">
            <option value="">Selecione um jovem...</option>
        </select>
        <button class="btn-sync" onclick="carregarDados()">🔄 Sincronizar</button>
    </div>

    <div class="dashboard">
        <div class="card">
            <h3>Individual: SAP (Radar)</h3>
            <div class="chart-container"><canvas id="chartSapInd"></canvas></div>
        </div>
        
        <div class="card">
            <h3>Individual: Perfil DISC</h3>
            <div class="chart-container"><canvas id="chartDiscInd"></canvas></div>
            <div id="boxPixarInd" class="pixar-box" style="display:none;">
                <img id="imgPixarInd" src="" class="pixar-img">
                <span id="labelPixarInd" class="pixar-label"></span>
            </div>
        </div>

        <div class="card">
            <h3>Turma: Média SAP Geral</h3>
            <div class="chart-container"><canvas id="chartSapGeral"></canvas></div>
        </div>
        
        <div class="card">
            <h3>Turma: Cultura Geral</h3>
            <div class="chart-container"><canvas id="chartDiscGeral"></canvas></div>
            <div id="boxPixarGeral" class="pixar-box">
                <img id="imgPixarGeral" src="" class="pixar-img">
                <span id="labelPixarGeral" class="pixar-label"></span>
            </div>
        </div>
    </div>
</div>

<script>
    const URL_API = "https://script.google.com/macros/s/AKfycbwua4hn4gHs053z4_17z3JvBO2C_8jyTSrjD4vFIas0SsNUjIeUEnBbe5lO2RDGuzzJ/exec";
    let dadosGlobais = [];
    let charts = {};

    function desenhar(id, type, labels, data, label) {
        const el = document.getElementById(id);
        if (!el) return;
        if (charts[id]) charts[id].destroy();
        const ctx = el.getContext('2d');
        charts[id] = new Chart(ctx, {
            type: type,
            data: {
                labels: labels,
                datasets: [{
                    label: label,
                    data: data,
                    backgroundColor: id.includes('Disc') ? ['#e74c3c','#3498db','#f1c40f','#2ecc71'] : 'rgba(0,86,179,0.2)',
                    borderColor: '#0056b3',
                    borderWidth: 2
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    async function carregarDados() {
        try {
            const res = await fetch(URL_API);
            dadosGlobais = await res.json();
            const select = document.getElementById('selectJovem');
            select.innerHTML = '<option value="">Selecione um jovem...</option>';
            dadosGlobais.forEach((item, index) => {
                select.innerHTML += `<option value="${index}">${item.nome}</option>`;
            });
            renderizarGraficosGerais();
        } catch (e) { console.error(e); }
    }

    function atualizarGraficosIndividuais() {
        const idx = document.getElementById('selectJovem').value;
        if (idx === "") return;
        const j = dadosGlobais[idx];
        const discVals = j.disc.split('-').map(v => Math.abs(parseFloat(v)) || 0);
        
        desenhar('chartSapInd', 'radar', ['Protagonismo', 'Responsabilidade', 'Comunicação', 'Cidadania', 'Solução', 'Equipe', 'Aprender'], JSON.parse(j.sap), 'SAP');
        desenhar('chartDiscInd', 'doughnut', ['D', 'I', 'S', 'C'], discVals, 'DISC');

        const siglas = ['D', 'I', 'S', 'C'];
        const dominante = siglas[discVals.indexOf(Math.max(...discVals))];
        
        // CORREÇÃO FINAL DAS IMAGENS: Força PNG e ignora o cache
        const imgElement = document.getElementById('imgPixarInd');
        imgElement.src = dominante + ".png?v=" + new Date().getTime(); 
        document.getElementById('labelPixarInd').innerText = "Perfil: " + dominante;
        document.getElementById('boxPixarInd').style.display = "flex";
    }

    function renderizarGraficosGerais() {
        if (!dadosGlobais.length) return;
        let totaisDisc = [0,0,0,0];
        let somaSap = [0,0,0,0,0,0,0];
        dadosGlobais.forEach(j => {
            j.disc.split('-').map(v => Math.abs(parseFloat(v)) || 0).forEach((v, i) => totaisDisc[i] += v);
            JSON.parse(j.sap).forEach((v, i) => somaSap[i] += v);
        });

        desenhar('chartSapGeral', 'radar', ['Protagonismo', 'Responsabilidade', 'Comunicação', 'Cidadania', 'Solução', 'Equipe', 'Aprender'], somaSap.map(v => v/dadosGlobais.length), 'Média Turma');
        desenhar('chartDiscGeral', 'bar', ['D', 'I', 'S', 'C'], totaisDisc, 'Total Turma');

        const siglas = ['D', 'I', 'S', 'C'];
        const domTurma = siglas[totaisDisc.indexOf(Math.max(...totaisDisc))];
        
        // CORREÇÃO DAS IMAGENS NA TURMA
        document.getElementById('imgPixarGeral').src = domTurma + ".png?v=" + new Date().getTime();
        document.getElementById('labelPixarGeral').innerText = "Cultura: " + domTurma;
    }

    document.addEventListener('DOMContentLoaded', carregarDados);
</script>
</body>
</html>
