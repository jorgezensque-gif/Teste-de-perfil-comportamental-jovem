<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Gestor Jorge 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .box { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 12px; border-top: 10px solid #0056b3; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-wa { background: #25d366; color: white; padding: 15px; border-radius: 8px; text-decoration: none; font-weight: bold; display: block; text-align: center; margin-bottom: 20px; font-size: 1.1em; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 8px; text-align: center; min-height: 350px; }
        canvas { max-height: 300px !important; width: 100% !important; }
        .controles { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        select { padding: 12px; width: 60%; border-radius: 6px; border: 1px solid #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #0056b3; color: white; }
    </style>
</head>
<body>
<div class="box">
    <h2 style="text-align:center;">PAINEL INTELIGENTE - GESTOR JORGE</h2>
    
    <a href="#" id="linkWA" class="btn-wa" target="_blank">📲 GERAR LINK E ENVIAR VIA WHATSAPP</a>

    <div class="controles">
        <select id="selectJovem" onchange="atualizarGraficosIndividuais()">
            <option value="">Selecione um jovem...</option>
        </select>
        <button onclick="carregarDados()" style="cursor:pointer">🔄 Atualizar Painel</button>
    </div>

    <div class="dashboard">
        <div class="card"><h3>Individual: SAP (1 a 5)</h3><canvas id="chartSapInd"></canvas></div>
        <div class="card"><h3>Individual: Perfil DISC</h3><canvas id="chartDiscInd"></canvas></div>
        <div class="card"><h3>Turma: Média SAP</h3><canvas id="chartSapGeral"></canvas></div>
        <div class="card"><h3>Turma: Perfil Geral</h3><canvas id="chartDiscGeral"></canvas></div>
    </div>

    <table>
        <thead><tr><th>Nome</th><th>SAP</th><th>DISC</th><th>Ações</th></tr></thead>
        <tbody id="corpoTabela"></tbody>
    </table>
</div>

<script>
    const URL_API = "https://script.google.com/macros/s/AKfycbyHHscPDi3fZ55Hp6YvjZqciHhBJNzUIgoXCcCG_Trghhz71EdpsSSG8tXpveLxCtdb/exec";
    
    // Configura o Link do WhatsApp automaticamente
    const urlQuiz = window.location.href.replace("resultados.html", "teste.html");
    document.getElementById("linkWA").href = "https://api.whatsapp.com/send?text=Olá! Por favor, preencha sua autoavaliação aqui: " + urlQuiz;

    let dadosGlobais = [];
    let charts = {};

    async function carregarDados() {
        try {
            const res = await fetch(URL_API);
            const texto = await res.text(); // Lê como texto primeiro para evitar erro de parse
            dadosGlobais = JSON.parse(texto);
            
            const select = document.getElementById('selectJovem');
            const tabela = document.getElementById('corpoTabela');
            select.innerHTML = '<option value="">Selecione um jovem...</option>';
            tabela.innerHTML = "";

            dadosGlobais.forEach((item, index) => {
                select.innerHTML += `<option value="${index}">${item.nome}</option>`;
                tabela.innerHTML += `<tr><td>${item.nome}</td><td>${item.sap}</td><td>${item.disc}</td><td><button onclick="excluirInd('${item.nome}')">Excluir</button></td></tr>`;
            });
            renderizarGraficosGerais();
        } catch (e) { 
            console.error(e);
            alert("Erro de conexão na Versão 6. Verifique se a planilha tem a aba 'Respostas'."); 
        }
    }

    function desenhar(id, type, labels, data, label) {
        if (charts[id]) charts[id].destroy();
        const ctx = document.getElementById(id).getContext('2d');
        
        const options = {
            responsive: true,
            maintainAspectRatio: false,
            scales: (type === 'radar' || type === 'bar') ? {
                r: { min: 0, max: 5, ticks: { stepSize: 1 } },
                y: { min: 0, max: 5, ticks: { stepSize: 1 } }
            } : {}
        };

        charts[id] = new Chart(ctx, {
            type: type,
            data: { 
                labels: labels, 
                datasets: [{ label: label, data: data, backgroundColor: 'rgba(0, 86, 179, 0.4)', borderColor: '#0056b3', borderWidth: 2 }] 
            },
            options: options
        });
    }

    function atualizarGraficosIndividuais() {
        const idx = document.getElementById('selectJovem').value;
        if (idx === "") return;
        const j = dadosGlobais[idx];
        desenhar('chartSapInd', 'radar', ['S1','S2','S3','S4','S5','S6','S7'], JSON.parse(j.sap), 'Individual');
        desenhar('chartDiscInd', 'pie', ['D', 'I', 'S', 'C'], j.disc.split('-').map(Number), 'DISC');
    }

    function renderizarGraficosGerais() {
        if (!dadosGlobais.length) return;
        let mediasSap = [0,0,0,0,0,0,0], totaisDisc = [0,0,0,0];
        dadosGlobais.forEach(j => {
            JSON.parse(j.sap).forEach((v, i) => mediasSap[i] += v);
            j.disc.split('-').map(Number).forEach((v, i) => totaisDisc[i] += v);
        });
        desenhar('chartSapGeral', 'radar', ['S1','S2','S3','S4','S5','S6','S7'], mediasSap.map(v => v/dadosGlobais.length), 'Média Turma');
        desenhar('chartDiscGeral', 'bar', ['D', 'I', 'S', 'C'], totaisDisc, 'Total Turma');
    }

    async function excluirInd(n) { if(confirm("Deseja apagar os dados de "+n+"?")) { await fetch(URL_API+"?action=delete&nome="+n, {mode:'no-cors'}); setTimeout(carregarDados, 1000); } }

    carregarDados();
</script>
</body>
</html>
