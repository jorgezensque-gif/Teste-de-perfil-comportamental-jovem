<head>

    <title>Painel Gestor Jorge Zensque</title>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 20px; margin: 0; }
        .box { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 15px; border-top: 10px solid #0056b3; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .header-title { text-align: center; color: #0056b3; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
        .selector-container { text-align: center; margin-bottom: 30px; }
        select { padding: 12px 20px; width: 80%; max-width: 500px; border-radius: 8px; border: 2px solid #0056b3; font-size: 16px; font-weight: bold; color: #333; cursor: pointer; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 25px; }
        .card { background: #fff; border: 1px solid #e1e4e8; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card h3 { color: #444; margin-top: 0; border-bottom: 2px solid #f0f2f5; padding-bottom: 10px; }
        .chart-container { position: relative; height: 300px; width: 100%; }
        .pixar-container { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 15px; min-height: 140px; }
        .pixar-img { width: 110px; height: 110px; border-radius: 50%; border: 4px solid #0056b3; object-fit: cover; background: #f9f9f9; transition: transform 0.3s; }
        .pixar-img:hover { transform: scale(1.1); }
        .pixar-label { font-weight: 800; color: #0056b3; font-size: 0.9em; margin-top: 10px; background: #eef4ff; padding: 5px 15px; border-radius: 20px; }
        @media (max-width: 600px) { .dashboard { grid-template-columns: 1fr; } .box { padding: 15px; } }
    </style>
</head>

    // Mapeamento direto para os arquivos no seu GitHub
    const BICHOS = {
        'D': { nome: 'LEÃO (Dominância)', url: 'D.png' },
        'I': { nome: 'PAPAGAIO (Influência)', url: 'I.png' },

        'C': { nome: 'CORUJA (Conformidade)', url: 'C.png' }
    };

    let dadosGlobais = [];

    // CARGA INICIAL
    async function carregarDados() {
        try {
            const res = await fetch(URL_API);
            dadosGlobais = await res.json();
            const select = document.getElementById('selectJovem');
            select.innerHTML = '<option value="">Escolha um Jovem para analisar...</option>';
            
            dadosGlobais.forEach((item, index) => {
                let opt = document.createElement('option');
                opt.value = index;
                opt.textContent = item.nome;
                select.appendChild(opt);
            });
        } catch (error) {
            console.error("Erro ao carregar API:", error);
            alert("Erro ao conectar com a planilha do Google.");
        }
    }

    function atualizarInterface() {
        const idx = document.getElementById('selectJovem').value;
        if (idx === "") return;
        
        const jovem = dadosGlobais[idx];

        // --- TRATAMENTO BLINDADO DO DISC (Coluna I) ---
        // Resolve o problema de "--" e números negativos na planilha
        let discBruto = jovem.disc.replace(/--/g, '-'); 
        let partes = discBruto.split('-').filter(p => p !== "" && p !== " ");
        
        // Converte para números positivos e garante que temos os 4 (D-I-S-C)
        let valoresDisc = partes.map(v => Math.abs(parseFloat(v)));
        while(valoresDisc.length < 4) valoresDisc.push(0); 

        // Descobrir o predominante
        let maxVal = -1;
        let dominante = 'D';
        const siglas = ['D', 'I', 'S', 'C'];
        valoresDisc.forEach((v, i) => {
            if (v > maxVal) { maxVal = v; dominante = siglas[i]; }
        });

        // Atualizar Imagem e Label
        document.getElementById('fotoInd').innerHTML = `
            <img src="${BICHOS[dominante].url}" class="pixar-img" onerror="this.src='https://via.placeholder.com/110?text=Foto'">
            <span class="pixar-label">${BICHOS[dominante].nome}</span>
        `;

        // GRÁFICO DISC (Pizza/Donut)
        renderizarGrafico('chartDisc', 'doughnut', ['D', 'I', 'S', 'C'], valoresDisc, 
            ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71']);

        // GRÁFICO SAP (Radar - Colunas B até H)
        const valoresSap = [
            jovem.sap1, jovem.sap2, jovem.sap3, 
            jovem.sap4, jovem.sap5, jovem.sap6, jovem.sap7
        ];
        renderizarGrafico('chartSap', 'radar', 
            ['Autogestão', 'Engajamento', 'Amabilidade', 'Resiliência', 'Abertura', 'Foco', 'Social'], 
            valoresSap, '#0056b3');
    }
