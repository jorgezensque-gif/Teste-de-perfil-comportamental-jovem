<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico 2026</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        :root { --blue: #38bdf8; --dark: #0f172a; --card: #1e293b; --accent: #facc15; }
        body { background: var(--dark); color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { width: 90%; max-width: 450px; background: var(--card); padding: 30px; border-radius: 15px; text-align: center; border: 1px solid #334155; }
        .btn { width: 100%; padding: 15px; background: var(--blue); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .hidden { display: none; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container" id="main-box">
    <h2 id="status">Verificando...</h2>
    
    <div id="area-form" class="hidden">
        <p>Olá! Digite seu nome para começar:</p>
        <input type="text" id="nomeAluno" placeholder="Nome Completo">
        <button class="btn" onclick="enviarFinal()">FINALIZAR TESTE</button>
    </div>

    <div id="area-bloqueio" class="hidden">
        <h1 style="color:var(--accent);">⚠️ LINK JÁ UTILIZADO</h1>
        <p>Este teste já foi respondido. Solicite um novo link ao Jorge.</p>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://perfil-jovem--disc-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const linkID = urlParams.get('id');

    if (!linkID) {
        document.getElementById('status').innerText = "❌ Link Inválido";
    } else {
        // BUSCA A TRAVA NA PASTA CORRETA
        db.ref('links_travados/' + linkID).once('value', snap => {
            if (snap.exists()) {
                document.getElementById('status').classList.add('hidden');
                document.getElementById('area-bloqueio').classList.remove('hidden');
            } else {
                document.getElementById('status').innerText = "Bem-vindo!";
                document.getElementById('area-form').classList.remove('hidden');
            }
        });
    }

    function enviarFinal() {
        const nome = document.getElementById('nomeAluno').value;
        if (!nome) return alert("Digite seu nome!");

        // 1. Cria a trava (impede o reuso do link)
        db.ref('links_travados/' + linkID).set({
            aluno: nome,
            data: new Date().toLocaleString(),
            usado: true
        }).then(() => {
            // 2. Salva o resultado para você ver no dashboard
            db.ref('resultados_testes').push({
                aluno: nome,
                link_id: linkID,
                data: new Date().toLocaleString()
            });

            alert("Teste enviado com sucesso!");
            window.location.reload(); // Recarrega para ativar o bloqueio na hora
        });
    }
</script>
</body>
</html>
