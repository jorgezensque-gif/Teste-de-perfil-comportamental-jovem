<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Gestor - Fundação Pescar</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; border-top: 4px solid #ef4444; }
        .header-admin { border: 2px dashed #38bdf8; padding: 15px; border-radius: 10px; display: flex; gap: 10px; margin-bottom: 20px; }
        .header-admin input { flex: 1; padding: 10px; border-radius: 5px; border: none; background: #000; color: #fff; }
        select { background: #111827; color: white; padding: 8px; border-radius: 5px; border: 1px solid #38bdf8; min-width: 150px; }
        .grid-charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card-chart { background: #111827; padding: 15px; border-radius: 10px; height: 300px; }
        .btn-green { background: #22c55e; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-red { background: #ef4444; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header-admin">
        <input type="text" id="nomeAluno" placeholder="Nome do Aluno">
        <button class="btn-green" onclick="gerarLink()">GERAR E DISPARAR WHATSAPP</button>
    </div>

    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
                <h2 style="margin:0;">PAINEL GESTOR</h2>
                <small>Responsável: Jorge Zensque</small>
            </div>
            <div style="display:flex; gap:10px;">
                <select id="selectTurma" onchange="mostrarResultado(this.value)">
                    <option value="">📊 CARREGANDO TURMA...</option>
                </select>
                <button class="btn-green" onclick="baixarExcel()">📊 EXCEL</button>
                <button class="btn-red" onclick="zerarDados()">ZERAR</button>
            </div>
        </div>

        <div class="grid-charts">
            <div class="card-chart"><h3>1. Autoavaliação SAP</h3><canvas id="radarSap"></canvas></div>
            <div class="card-chart"><h3>2. Perfil (DISC)</h3><canvas id="barDisc"></canvas></div>
            <div class="card-chart"><h3>3. Técnico (SAP)</h3><canvas id="barSapTecnico"></canvas></div>
            <div class="card-chart"><h3>4. Equilíbrio</h3><canvas id="barEquilibrio"></canvas></div>
        </div>
    </div>

<script>
    const firebaseConfig = { databaseURL: "https://perfil-jovem--disc-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ESSA FUNÇÃO BUSCA OS NOMES NO BANCO E COLOCA NO BOTÃO "TURMA"
    function carregarAlunos() {
        db.ref('resultados').on('value', (snap) => {
            const select = document.getElementById('selectTurma');
            select.innerHTML = '<option value="">📊 SELECIONE UM ALUNO</option>';
            
            snap.forEach((alunoSnap) => {
                const id = alunoSnap.key;
                const nome = alunoSnap.val().nome || id;
                let opt = document.createElement('option');
                opt.value = id;
                opt.innerHTML = nome;
                select.appendChild(opt);
            });
        });
    }

    function mostrarResultado(id) {
        if(!id) return;
        db.ref('resultados/' + id).once('value', (snap) => {
            const r = snap.val();
            // Lógica para desenhar os gráficos com r.sap_1, r.disc_1, etc.
            console.log("Mostrando dados de:", r.nome);
        });
    }

    function gerarLink() {
        const nome = document.getElementById('nomeAluno').value;
        if(!nome) return alert("Digite o nome!");
        const link = window.location.origin + "/index.html?id=" + encodeURIComponent(nome);
        window.open(`https://api.whatsapp.com/send?text=Olá, faça seu teste aqui: ${link}`);
    }

    function zerarDados() {
        if(confirm("Apagar tudo?")) { db.ref('resultados').remove(); location.reload(); }
    }

    window.onload = carregarAlunos;
</script>
</body>
</html>
