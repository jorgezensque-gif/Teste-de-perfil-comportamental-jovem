<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Gestor - Jorge Zensque</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        /* TELA DE LOGIN */
        #tela-login { text-align: center; background: #1e293b; padding: 40px; border-radius: 15px; border: 2px solid #38bdf8; box-shadow: 0 0 20px rgba(56, 189, 248, 0.2); }
        input { padding: 12px; border-radius: 8px; border: none; width: 200px; margin-bottom: 15px; font-size: 16px; text-align: center; }
        .btn-login { background: #38bdf8; color: #0f172a; border: none; padding: 12px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* CONTEÚDO DO PAINEL (ESCONDIDO) */
        #conteudo-painel { display: none; width: 100%; padding: 20px; box-sizing: border-box; }
        .header { background: #1e293b; padding: 20px; border-radius: 10px; border-bottom: 4px solid #38bdf8; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; width: 100%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; width: 100%; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; }
        select { background: #334155; color: white; border: 2px solid #38bdf8; padding: 10px; border-radius: 8px; width: 250px; }
        .btn-zerar { background: #ef4444; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

    <div id="tela-login">
        <h2 style="color: #38bdf8;">Acesso Restrito</h2>
        <p>Jorge, digite sua senha:</p>
        <input type="password" id="senhaInput" placeholder="Sua senha aqui..."><br>
        <button class="btn-login" onclick="verificarSenha()">ENTRAR NO PAINEL</button>
    </div>

    <div id="conteudo-painel">
        <div class="header">
            <div>
                <h1>PAINEL GESTOR</h1>
                <div style="color: #38bdf8; font-weight: bold;">Responsável: Jorge Zensque</div>
            </div>
            <div>
                <select id="selectAlunos"><option value="">Carregando...</option></select>
                <button class="btn-zerar" onclick="zerarTudo()">LIMPAR BANCO</button>
            </div>
        </div>

        <div class="grid">
            <div class="card"><h2>1. AUTOAVALIAÇÃO SAP (RADAR)</h2><canvas id="chartRadar"></canvas></div>
            <div class="card"><h2>2. PERFIL COMPORTAMENTAL (DISC)</h2><canvas id="chartDisc"></canvas></div>
        </div>
    </div>

<script>
    // CONFIGURAÇÃO FIREBASE
    const config = { databaseURL: "https://perfil-jovem--disc-default-rtdb.firebaseio.com" };
    firebase.initializeApp(config);
    const db = firebase.database();
    let radarChart, discChart;

    // FUNÇÃO DE LOGIN
    function verificarSenha() {
        const pass = document.getElementById('senhaInput').value;
        if (pass === "pitukinha") {
            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('conteudo-painel').style.display = 'block';
            document.body.style.alignItems = 'flex-start'; // Ajusta o layout após entrar
            iniciarPainel();
        } else {
            alert("Senha incorreta!");
        }
    }

    function iniciarPainel() {
        db.ref('resultados').on('value', (snapshot) => {
            const select = document.getElementById('selectAlunos');
            const dados = snapshot.val();
            select.innerHTML = '<option value="">-- Selecione o Aluno --</option>';
            if (dados) {
                const nomesUnicos = [...new Set(Object.values(dados).map(d => d.nome))];
                nomesUnicos.forEach(nome => {
                    const opt = document.createElement('option');
                    opt.value = nome; opt.text = nome;
                    select.appendChild(opt);
                });
            }
        });
    }

    function zerarTudo() {
        if(confirm("Jorge, confirma a limpeza total?")) {
            db.ref('/').remove();
            location.reload();
        }
    }

    document.getElementById('selectAlunos').addEventListener('change', (e) => {
        const nome = e.target.value;
        if (!nome) return;
        db.ref('resultados').orderByChild('nome').equalTo(nome).once('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const result = Object.values(data).pop();
                atualizarGraficos(result.pontosDISC, result.pontosSAP);
            }
        });
    });

    function atualizarGraficos(disc, sap) {
        if (radarChart) radarChart.destroy();
        if (discChart) discChart.destroy();

        radarChart = new Chart(document.getElementById('chartRadar'), {
            type: 'radar',
            data: {
                labels: ['Protagonismo', 'Responsabilidade', 'Comunicação', 'Ética', 'Prob.', 'Equipe', 'Aprender'],
                datasets: [{ label: 'SAP', data: sap, borderColor: '#38bdf8', backgroundColor: 'rgba(56, 189, 248, 0.2)' }]
            },
            options: { scales: { r: { beginAtZero: true, max: 5 } } }
        });

        discChart = new Chart(document.getElementById('chartDisc'), {
            type: 'bar',
            data: {
                labels: ['D', 'I', 'S', 'C'],
                datasets: [{ label: 'DISC', data: [disc.D, disc.I, disc.S, disc.C], backgroundColor: ['#ef4444', '#f59e0b', '#10b981', '#3b82f6'] }]
            }
        });
    }
</script>
</body>
</html>
