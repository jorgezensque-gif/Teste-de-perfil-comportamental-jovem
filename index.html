<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico Socioemocional 2026</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        :root { --blue: #38bdf8; --dark: #0f172a; --card: #1e293b; --accent: #facc15; --green: #25d366; }
        body { background: var(--dark); color: white; font-family: sans-serif; padding: 0; margin: 0; }
        .header-fixo { position: sticky; top: 0; background: var(--dark); z-index: 1000; padding: 15px; border-bottom: 2px solid var(--blue); text-align: center; }
        .container { max-width: 650px; margin: 20px auto; padding: 0 15px 100px 15px; }
        .step { display: none; }
        .active { display: block; }
        .question-card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 25px; border-left: 5px solid var(--blue); }
        .btn { width: 100%; padding: 20px; background: var(--blue); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .rating-row { display: flex; justify-content: space-between; background: #0f172a; padding: 15px; border-radius: 10px; }
        .rating-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; flex: 1; }
        .disc-opt { display: block; background: #0f172a; padding: 15px; margin: 10px 0; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div id="conteudo-teste">
    <div class="header-fixo">
        <h3 id="titulo-etapa">Diagnóstico 2026</h3>
        <p id="texto-instrucao">Aguardando Identificação...</p>
    </div>

    <div class="container">
        <div id="step0" class="step active">
            <input type="text" id="nomeAluno" style="width:100%; padding:18px; border-radius:10px; border:none; background:#1a2232; color:white;" placeholder="Digite seu Nome Completo">
            <button class="btn" style="margin-top:20px;" onclick="proximo(1)">INICIAR TESTE</button>
        </div>

        <div id="step1" class="step">
            <div id="sap-area"></div>
            <button class="btn" onclick="proximo(2)">AVANÇAR PARA O DISC</button>
        </div>

        <div id="step2" class="step">
            <div id="disc-area"></div>
            <button class="btn" style="background:var(--green);" onclick="enviar()">FINALIZAR E ENVIAR</button>
        </div>
    </div>
</div>

<script>
    // CONFIGURAÇÃO FIREBASE
    const firebaseConfig = { databaseURL: "https://perfil-jovem--disc-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const linkID = urlParams.get('id');

    // VERIFICA SE O LINK JÁ FOI USADO
    if (linkID) {
        db.ref('resultados_testes').orderByChild('link_id').equalTo(linkID).once('value', snap => {
            if (snap.exists()) {
                document.getElementById('conteudo-teste').innerHTML = `
                    <div style="text-align:center; padding:100px 20px;">
                        <h2 style="color:#facc15;">⚠️ LINK JÁ UTILIZADO</h2>
                        <p>Este teste já foi respondido. Solicite um novo link ao Jorge.</p>
                    </div>`;
            }
        });
    }

    const sapData = [
        { t: "1. SER PROTAGONISTA", e: "• Referência no grupo\n• Respeito mútuo\n• Projeto de Vida" },
        { t: "2. SER RESPONSÁVEL", e: "• Cumpre prazos\n• Pontualidade\n• Cumpre regras" },
        { t: "3. COMUNICAR-SE", e: "• Postura coerente\n• Sabe ouvir" },
        { t: "4. ÉTICA E CIDADANIA", e: "• Honestidade\n• Assume erros" },
        { t: "5. RESOLVER PROBLEMAS", e: "• Sem fofocas\n• Pensa antes de agir" },
        { t: "6. TRABALHO EM EQUIPE", e: "• Busca consenso\n• Bem estar do grupo" },
        { t: "7. APRENDER A APRENDER", e: "• Busca conhecimento\n• Curioso" }
    ];

    const discData = [
        { q: "1. Em um grupo, você geralmente é:", d: "Decidido", i: "Animado", s: "Amigável", c: "Preciso" },
        { q: "2. Seu foco é:", d: "Resultados", i: "Pessoas", s: "Harmonia", c: "Processos" },
        { q: "3. Em desafios, você:", d: "Lidera", i: "Persuade", s: "Apoia", c: "Analisa" },
        { q: "4. Você é mais:", d: "Direto", i: "Alegre", s: "Calmo", c: "Lógico" },
        { q: "5. Na conversa, você é:", d: "Objetivo", i: "Expressivo", s: "Ouvinte", c: "Técnico" }
    ];

    // RENDERIZAR SAP
    const sapArea = document.getElementById('sap-area');
    sapData.forEach((item, i) => {
        let rs = '';
        for(let v=1; v<=5; v++) rs += `<label class="rating-item"><input type="radio" name="sap${i}" value="${v}"><span>${v}</span></label>`;
        sapArea.innerHTML += `<div class="question-card"><b>${item.t}</b><pre style="font-size:0.8em; color:#cbd5e1;">${item.e}</pre><div class="rating-row">${rs}</div></div>`;
    });

    // RENDERIZAR DISC
    const discArea = document.getElementById('disc-area');
    discData.forEach((item, i) => {
        discArea.innerHTML += `<div class="question-card">
            <b>${item.q}</b>
            <label class="disc-opt"><input type="radio" name="d${i}" value="D"> ${item.d}</label>
            <label class="disc-opt"><input type="radio" name="d${i}" value="I"> ${item.i}</label>
            <label class="disc-opt"><input type="radio" name="d${i}" value="S"> ${item.s}</label>
            <label class="disc-opt"><input type="radio" name="d${i}" value="C"> ${item.c}</label>
        </div>`;
    });

    function proximo(s) { 
        if(s===1 && !document.getElementById('nomeAluno').value) return alert("Digite seu nome!");
        document.querySelectorAll('.step').forEach(d => d.classList.remove('active'));
        document.getElementById('step'+s).classList.add('active');
        window.scrollTo(0,0);
    }

    function enviar() {
        const nome = document.getElementById('nomeAluno').value;
        let sapRes = {};
        sapData.forEach((_, i) => {
            const r = document.querySelector(`input[name="sap${i}"]:checked`);
            sapRes['q'+i] = r ? r.value : "0";
        });
        let dRes = { D: 0, I: 0, S: 0, C: 0 };
        for(let i=0; i<discData.length; i++) {
            const r = document.querySelector(`input[name="d${i}"]:checked`);
            if(r) dRes[r.value]++;
        }

        db.ref('resultados_testes').push({ 
            aluno: nome, 
            sap: sapRes, 
            disc: dRes, 
            link_id: linkID || "sem-id",
            data: new Date().toLocaleString() 
        }).then(() => {
            alert("Enviado com sucesso!");
            window.location.reload();
        });
    }
</script>
</body>
</html>
