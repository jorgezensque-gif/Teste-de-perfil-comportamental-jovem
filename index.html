<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste DISC - Resposta</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; padding: 50px 20px; }
        .caixa { background: #1e293b; padding: 30px; border-radius: 15px; max-width: 400px; margin: auto; border: 1px solid #334155; }
        .btn { width: 100%; padding: 15px; background: #38bdf8; color: black; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .escondido { display: none; }
    </style>
</head>
<body>
    <div class="caixa">
        <div id="verificando">Verificando seu acesso...</div>

        <div id="tela-teste" class="escondido">
            <h2>Bem-vindo!</h2>
            <p>Clique abaixo para enviar sua resposta única.</p>
            <button class="btn" onclick="responder()">ENVIAR RESPOSTA</button>
        </div>

        <div id="tela-bloqueio" class="escondido">
            <h1 style="color:#facc15;">⚠️ LINK USADO</h1>
            <p>Este teste já foi respondido. Peça um novo link ao Jorge.</p>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://perfil-jovem--disc-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const linkID = urlParams.get('id');

        if (!linkID) {
            document.getElementById('verificando').innerText = "❌ Link Inválido!";
        } else {
            // VERIFICA SE JÁ EXISTE TRAVA
            db.ref('travas/' + linkID).once('value', snap => {
                document.getElementById('verificando').classList.add('escondido');
                if (snap.exists()) {
                    document.getElementById('tela-bloqueio').classList.remove('escondido');
                } else {
                    document.getElementById('tela-teste').classList.remove('escondido');
                }
            });
        }

        function responder() {
            db.ref('travas/' + linkID).set({ status: "usado" }).then(() => {
                alert("Enviado com sucesso!");
                window.location.reload();
            });
        }
    </script>
</body>
</html>
