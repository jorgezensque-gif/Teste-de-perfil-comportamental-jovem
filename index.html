<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico Socioemocional 2026</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        :root { --blue: #38bdf8; --dark: #0f172a; --card: #1e293b; --accent: #facc15; }
        body { background: var(--dark); color: white; font-family: sans-serif; margin: 0; padding-bottom: 50px; }
        .container { max-width: 650px; margin: 20px auto; padding: 20px; }
        .header { text-align: center; border-bottom: 2px solid var(--blue); padding-bottom: 10px; margin-bottom: 20px; }
        .question-card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; border-left: 5px solid var(--blue); }
        .btn { width: 100%; padding: 18px; background: var(--blue); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .hidden { display: none; }
        .rating-row { display: flex; justify-content: space-between; padding: 15px 0; }
        input[type="text"] { width: 100%; padding: 15px; border-radius: 8px; border: none; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>DIAGNÓSTICO 2026</h2>
        <p id="status">Verificando link...</p>
    </div>

    <div id="tela-bloqueio" class="hidden" style="text-align:center;">
        <h1 style="color:var(--accent);">⚠️ LINK JÁ UTILIZADO</h1>
        <p>Este teste já foi enviado. Solicite um novo link ao Jorge.</p>
    </div>

    <div id="tela-inicio">
        <div class="question-card">
            <input type="text" id="nomeAluno" placeholder="Seu Nome Completo">
            <button class="btn" style="margin-top:15px;" onclick="irParaTeste()">INICIAR TESTE</button>
        </div>
    </div>

    <div id="tela-perguntas" class="hidden">
        <div id="area-perguntas"></div>
        <button class="btn" style="background:#22c55e;" onclick="enviarTudo()">FINALIZAR E ENVIAR</button>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://perfil-jovem--disc-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const linkID = urlParams.get('id');

    // VERIFICAÇÃO DE USO ÚNICO
    if (linkID) {
        db.ref('resultados_testes').orderByChild('link_id').equalTo(linkID).once('value', snap => {
            if (snap.exists()) {
                document.getElementById('tela-inicio').classList.add('hidden');
                document.getElementById('tela-bloqueio').classList.remove('hidden');
                document.getElementById('status').innerText = "Acesso Negado";
            } else {
                document.getElementById('status').innerText = "Link Autorizado";
            }
        });
    }

    const perguntas = ["SER PROTAGONISTA", "SER RESPONSÁVEL", "COMUNICAR-SE", "ÉTICA E CIDADANIA"];

    function irParaTeste() {
        if (!document.getElementById('nomeAluno').value) return alert("Digite seu nome!");
        document.getElementById('tela-inicio').classList.add('hidden');
        document.getElementById('tela-perguntas').classList.remove('hidden');
        
        const area = document.getElementById('area-perguntas');
        perguntas.forEach((p, i) => {
            area.innerHTML += `<div class="question-card"><b>${p}</b><div class="rating-row">
                ${[1,2,3,4,5].map(n => `<label><input type="radio" name="p${i}" value="${n}"> ${n}</label>`).join('')}
            </div></div>`;
        });
    }

    function enviarTudo() {
        const nome = document.getElementById('nomeAluno').value;
        db.ref('resultados_testes').push({
            aluno: nome,
            link_id: linkID || "sem-id",
            data: new Date().toLocaleString()
        }).then(() => {
            alert("Enviado com sucesso!");
            window.location.reload();
        });
    }
</script>
</body>
</html>
