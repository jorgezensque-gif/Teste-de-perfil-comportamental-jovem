<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico Socioemocional 2026</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        :root { --blue: #38bdf8; --dark: #0f172a; --card: #1e293b; --text: #f1f5f9; --accent: #facc15; }
        body { background: var(--dark); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: var(--card); padding: 30px; border-radius: 15px; border: 1px solid #334155; }
        .secao-titulo { color: var(--blue); border-bottom: 2px solid var(--blue); margin: 30px 0 15px; padding-bottom: 5px; text-transform: uppercase; font-weight: bold; }
        .card { background: #1a2233; padding: 20px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid var(--accent); }
        .opcoes-disc { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 10px; }
        .item-disc { background: #2d3748; padding: 12px; border-radius: 5px; cursor: pointer; display: flex; align-items: center; }
        input[type="radio"] { margin-right: 15px; transform: scale(1.2); accent-color: var(--blue); }
        .btn-enviar { width: 100%; padding: 20px; background: #22c55e; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 18px; margin-top: 30px; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="container">
    <div id="status">Verificando acesso...</div>
    <div id="tela-bloqueio" class="hidden">
        <h1 style="color:var(--accent); text-align: center;">⚠️ LINK JÁ UTILIZADO</h1>
    </div>
    <div id="tela-teste" class="hidden">
        <h2 style="text-align:center;">DIAGNÓSTICO 2026</h2>
        <div class="secao-titulo">PARTE 1: SAP (AUTOAVALIAÇÃO)</div>
        <div id="sap-container"></div>
        <div class="secao-titulo">PARTE 2: PERFIL DISC</div>
        <div id="disc-container"></div>
        <button class="btn-enviar" onclick="enviarTudo()">FINALIZAR E ENVIAR</button>
    </div>
</div>
<script>
    const firebaseConfig = { databaseURL: "https://perfil-jovem--disc-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const urlParams = new URLSearchParams(window.location.search);
    const linkID = urlParams.get('id');

    const saps = [
        { t: "1-SER PROTAGONISTA", d: "Identidade, autônomo, solidário e construtor do destino. [cite: 14]" },
        { t: "2-SER RESPONSÁVEL E COMPROMETIDO", d: "Pontualidade, cumpre prazos, regras e higiene pessoal. [cite: 14]" },
        { t: "3-COMPREENDER CONTEXTOS E COMUNICAR-SE", d: "Expressão clara e capacidade de ouvir. [cite: 14]" },
        { t: "4-SER DEMOCRÁTICO, ÉTICO E CIDADÃO", d: "Valores, honestidade e respeito às diferenças. [cite: 14]" },
        { t: "5-RESOLVER SITUAÇÕES-PROBLEMA", d: "Enfrentar problemas e tomar decisões. [cite: 14]" },
        { t: "6-TRABALHAR E PRODUZIR EM EQUIPE", d: "Colaboração e foco nos interesses do grupo. [cite: 14]" },
        { t: "7-APRENDER A APRENDER", d: "Habilidade para buscar e construir novos conhecimentos. [cite: 14]" }
    ];

    const discPerguntas = [
        ["Animado", "Aventureiro", "Analítico", "Adaptável"], ["Brincalhão", "Persuasivo", "Persistente", "Pacífico"],
        ["Sociável", "Decidido", "Auto-sacrifício", "Submisso"], ["Convincente", "Competitivo", "Considerado", "Controlado"],
        ["Estimulante", "Ousado", "Respeitoso", "Reservado"], ["Espirituoso", "Auto-confiante", "Sensível", "Satisfeito"],
        ["Promotor", "Positivo", "Planejador", "Paciente"], ["Espontâneo", "Seguro", "Pontual", "Tímido"],
        ["Otimista", "Franco", "Ordeiro", "Cortês"], ["Engraçado", "Vigoroso", "Fiel", "Amigável"],
        ["Encantador", "Audaz", "Minucioso", "Diplomático"], ["Alegre", "Confiante", "Culto", "Tolerante"],
        ["Inspirador", "Independente", "Idealista", "Inofensivo"], ["Demonstrativo", "Decisivo", "Profundo", "Irônico"],
        ["Misturável", "Impaciente", "Músico", "Mediador"], ["Vivo", "Obstinado", "Pensativo", "Condescendente"]
    ];

    const sapDiv = document.getElementById('sap-container');
    saps.forEach((s, i) => {
        sapDiv.innerHTML += `<div class="card"><strong>${s.t}</strong><br><small>${s.d}</small><div style="display:flex; justify-content:space-between; margin-top:10px;">${[1,2,3,4,5].map(n => `<div>${n}<br><input type="radio" name="sap${i}" value="${n}"></div>`).join('')}</div></div>`;
    });

    const discDiv = document.getElementById('disc-container');
    discPerguntas.forEach((p, i) => {
        discDiv.innerHTML += `<div class="card" style="border-left-color: var(--blue);"><strong>Linha ${i+1}:</strong><div class="opcoes-disc">${p.map((palavra, idx) => `<label class="item-disc"><input type="radio" name="disc${i}" value="${['I','D','C','S'][idx]}"> ${palavra}</label>`).join('')}</div></div>`;
    });

    if (linkID) {
        db.ref('travas/' + linkID).once('value', snap => {
            document.getElementById('status').classList.add('hidden');
            if (snap.exists()) document.getElementById('tela-bloqueio').classList.remove('hidden');
            else document.getElementById('tela-teste').classList.remove('hidden');
        });
    }

    function enviarTudo() {
        let dados = { link_id: linkID, data: new Date().toLocaleString() };
        for(let i=0; i<7; i++) {
            const v = document.querySelector(`input[name="sap${i}"]:checked`)?.value;
            if(!v) return alert("Responda todo o SAP!");
            dados[`sap_${i+1}`] = v;
        }
        for(let i=0; i<16; i++) {
            const v = document.querySelector(`input[name="disc${i}"]:checked`)?.value;
            if(!v) return alert("Responda todo o DISC!");
            dados[`disc_${i+1}`] = v;
        }
        db.ref('resultados/' + linkID).set(dados).then(() => {
            db.ref('travas/' + linkID).set({ status: "usado" }).then(() => {
                alert("Enviado!");
                window.location.reload();
            });
        });
    }
</script>
</body>
</html>
