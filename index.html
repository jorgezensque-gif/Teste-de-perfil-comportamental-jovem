<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Links - Jorge</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #1e293b; padding: 30px; border-radius: 15px; text-align: center; width: 400px; border: 1px solid #334155; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #38bdf8; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #resultado { margin-top: 20px; padding: 15px; border: 1px dashed #38bdf8; border-radius: 8px; display: none; font-size: 14px; word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Gerador de Links - Jorge</h2>
        <input type="text" id="nomeAluno" placeholder="Nome do aluno">
        <button onclick="gerar()">GERAR LINK E COPIAR</button>
        <div id="resultado"></div>
    </div>

    <script>
        function gerar() {
            const nome = document.getElementById('nomeAluno').value.trim();
            if (!nome) return alert("Digite o nome!");

            // Transforma "Maria Leopoldina" em "maria-leopoldina"
            const id = nome.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-');
            const link = `https://teste-de-perfil-comportamental-jove.vercel.app/?id=${id}`;

            const resDiv = document.getElementById('resultado');
            resDiv.style.display = 'block';
            resDiv.innerText = link;

            navigator.clipboard.writeText(link);
            alert("Link de " + nome + " copiado!");
        }
    </script>
</body>
</html>
