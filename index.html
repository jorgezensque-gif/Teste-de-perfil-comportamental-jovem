<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Gestor - Jorge</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { background-color: #111827; color: white; font-family: sans-serif; padding: 20px; }
        .header-admin { border: 2px dashed #38bdf8; padding: 15px; border-radius: 10px; display: flex; gap: 10px; margin-bottom: 20px; }
        .header-admin input { flex: 1; padding: 10px; border-radius: 5px; border: none; }
        .btn-wpp { background-color: #22c55e; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .painel-box { background-color: #1f2937; border-radius: 15px; padding: 20px; border-top: 4px solid #ef4444; }
        .grid-charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card-chart { background-color: #111827; padding: 15px; border-radius: 10px; min-height: 300px; }
        .btn-acao { padding: 8px 15px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; color: white; }
        .btn-excel { background-color: #22c55e; }
        .btn-zerar { background-color: #ef4444; }
        h3 { margin-top: 0; font-size: 14px; text-transform: uppercase; color: #f3f4f6; }
    </style>
</head>
<body>

    <div class="header-admin">
        <input type="text" id="nomeAluno" placeholder="Nome do Aluno">
        <button class="btn-wpp" onclick="gerarLink()">GERAR E DISPARAR WHATSAPP</button>
    </div>

    <div class="painel-box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div>
                <h2 style="margin:0;">PAINEL GESTOR</h2>
                <small>Responsável: Jorge Zensque</small>
            </div>
            <div style="display: flex; gap: 10px;">
                <select style="background: #111827; color:white; padding: 5px 10px; border-radius: 5px;">
                    <option>📊 TURMA</option>
                </select>
                <button class="btn-acao btn-excel">📊 EXCEL</button>
                <button class="btn-acao btn-zerar">ZERAR</button>
            </div>
        </div>

        <div class="grid-charts">
            <div class="card-chart">
                <h3>1. Autoavaliação SAP (Radar)</h3>
                <canvas id="radarSap"></canvas>
            </div>
            <div class="card-chart">
                <h3>2. Perfil (DISC)</h3>
                <canvas id="barDisc"></canvas>
            </div>
            <div class="card-chart">
                <h3>3. Técnico (SAP)</h3>
                <canvas id="barSapTecnico"></canvas>
            </div>
            <div class="card-chart">
                <h3>4. Equilíbrio: DISC vs SAP</h3>
                <canvas id="barEquilibrio"></canvas>
            </div>
        </div>
    </div>

<script>
    // Configuração Firebase
    const firebaseConfig = { databaseURL: "https://perfil-jovem--disc-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function gerarLink() {
        const nome = document.getElementById('nomeAluno').value;
        if(!nome) return alert("Digite o nome");
        const link = window.location.origin + "/index.html?id=" + encodeURIComponent(nome);
        window.open(`https://api.whatsapp.com/send?text=Olá, faça seu teste aqui: ${link}`);
    }

    // Inicialização dos Gráficos (Visual Vazio conforme prints)
    const ctxRadar = document.getElementById('radarSap').getContext('2d');
    new Chart(ctxRadar, {
        type: 'radar',
        data: {
            labels: ['P', 'R', 'C', 'E', 'Pr', 'Eq', 'A'],
            datasets: [{ label: 'Média', data: [1, 1, 1, 1, 1, 1, 1], borderColor: '#38bdf8', backgroundColor: 'rgba(56,189,248,0.2)' }]
        },
        options: { scales: { r: { grid: { color: '#374151' }, ticks: { display: false } } } }
    });

    // Outros gráficos seguem o mesmo padrão de cores dos prints
</script>
</body>
</html>
