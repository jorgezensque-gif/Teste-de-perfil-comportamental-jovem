<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico Socioemocional 2026</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        :root { --blue: #38bdf8; --dark: #0f172a; --card: #1e293b; --accent: #facc15; }
        body { background: var(--dark); color: white; font-family: sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 90%; max-width: 500px; background: var(--card); padding: 30px; border-radius: 20px; text-align: center; border: 1px solid #334155; }
        .btn { width: 100%; padding: 15px; background: var(--blue); color: #000; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .hidden { display: none; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="status-msg">Validando link...</h2>
    
    <div id="area-teste" class="hidden">
        <p>Informe seu nome para começar:</p>
        <input type="text" id="nomeAluno" placeholder="Seu Nome Completo">
        <button class="btn" onclick="salvarERecarregar()">INICIAR E TRAVAR LINK</button>
    </div>

    <div id="area-bloqueio" class="hidden">
        <h1 style="color:var(--accent);">⚠️ ACESSO NEGADO</h1>
        <p>Este link (ID: <span id="display-id"></span>) já foi utilizado para enviar uma resposta.</p>
    </div>
</div>

<script>
    // Configuração do Banco
    const firebaseConfig = { databaseURL: "https://perfil-jovem--disc-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Captura o ID da URL
    const urlParams = new URLSearchParams(window.location.search);
    const linkID = urlParams.get('id');
    document.getElementById('display-id').innerText = linkID || "Nenhum";

    if (!linkID) {
        document.getElementById('status-msg').innerText = "Link inválido ou ausente.";
    } else {
        // VERIFICAÇÃO REAL NO BANCO DE DADOS
        db.ref('resultados_testes').orderByChild('link_id').equalTo(linkID).once('value', snap => {
            if (snap.exists()) {
                // Link já existe no banco -> Bloqueia
                document.getElementById('status-msg').classList.add('hidden');
                document.getElementById('area-bloqueio').classList.remove('hidden');
            } else {
                // Link novo -> Libera
                document.getElementById('status-msg').innerText = "Link Autorizado";
                document.getElementById('area-teste').classList.remove('hidden');
            }
        });
    }

    function salvarERecarregar() {
        const nome = document.getElementById('nomeAluno').value;
        if (!nome) return alert("Digite seu nome!");

        // Salva o ID junto com o resultado
        db.ref('resultados_testes').push({
            aluno: nome,
            link_id: linkID,
            data: new Date().toLocaleString()
        }).then(() => {
            alert("Resposta enviada! Este link agora será desativado.");
            window.location.reload(); // Recarrega para cair na tela de bloqueio
        });
    }
</script>
</body>
</html>
