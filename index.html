<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Gestor - Jorge Zensque</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #111827; --card: #1f2937; --blue: #38bdf8; --green: #22c55e; --red: #ef4444; --text: #f3f4f6; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding: 20px; margin: 0; }
        .header-admin { border: 2px dashed var(--blue); padding: 15px; border-radius: 10px; display: flex; gap: 10px; margin-bottom: 20px; }
        .header-admin input { flex: 1; padding: 12px; border-radius: 6px; border: none; background: #0b0f1a; color: white; }
        .btn-wpp { background-color: var(--green); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .painel-box { background-color: var(--card); border-radius: 12px; padding: 20px; border-top: 5px solid var(--red); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); }
        .controles { display: flex; gap: 10px; align-items: center; }
        .btn-acao { padding: 10px 18px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; color: white; display: flex; align-items: center; gap: 5px; }
        .btn-excel { background-color: var(--green); }
        .btn-zerar { background-color: var(--red); }
        select { background: #111827; color: white; padding: 10px; border-radius: 6px; border: 1px solid var(--blue); cursor: pointer; min-width: 150px; }
        .grid-charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-top: 20px; }
        .card-chart { background-color: #111827; padding: 15px; border-radius: 10px; border: 1px solid #374151; }
        h3 { margin: 0 0 15px 0; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--text); }
        canvas { max-height: 280px; }
    </style>
</head>
<body>

    <div class="header-admin">
        <input type="text" id="nomeAluno" placeholder="Nome do Aluno">
        <button class="btn-wpp" onclick="gerarLink()">GERAR E DISPARAR WHATSAPP</button>
    </div>

    <div class="painel-box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <div>
                <h2 style="margin:0; font-size: 24px;">PAINEL GESTOR</h2>
                <small style="color: #9ca3af;">Responsável: Jorge Zensque</small>
            </div>
            <div class="controles">
                <select id="selectTurma" onchange="filtrarDados()">
                    <option value="todos">📊 TURMA</option>
                </select>
                <button class="btn-acao btn-excel" onclick="exportarExcel()">📊 EXCEL</button>
                <button class="btn-acao btn-zerar" onclick="zerarDados()">ZERAR</button>
            </div>
        </div>

        <div class="grid-charts">
            <div class="card-chart"><h3>1. Autoavaliação SAP (Radar)</h3><canvas id="radarSap"></canvas></div>
            <div class="card-chart"><h3>2. Perfil (DISC)</h3><canvas id="barDisc"></canvas></div>
            <div class="card-chart"><h3>3. Técnico (SAP)</h3><canvas id="barSapTecnico"></canvas></div>
            <div class="card-chart"><h3>4. Equilíbrio: DISC vs SAP</h3><canvas id="barEquilibrio"></canvas></div>
        </div>
    </div>

<script>
    // Configuração Firebase
    const firebaseConfig = { databaseURL: "https://perfil-jovem--disc-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let dadosGlobais = {};
    let charts = {};

    // 1. Gerar Link WhatsApp
    function gerarLink() {
        const nome = document.getElementById('nomeAluno').value;
        if(!nome) return alert("Por favor, digite o nome do aluno.");
        const linkBase = window.location.href.split('index.html')[0];
        const linkFinal = `${linkBase}index.html?id=${encodeURIComponent(nome)}`;
        const msg = encodeURIComponent(`Olá ${nome}, aqui está seu link para o Diagnóstico 2026: ${linkFinal}`);
        window.open(`https://api.whatsapp.com/send?text=${msg}`);
    }

    // 2. Zerar Dados (Cuidado!)
    function zerarDados() {
        if(confirm("Jorge, tem certeza? Isso apagará TODAS as respostas do banco de dados!")) {
            db.ref('resultados').remove().then(() => {
                alert("Dados zerados com sucesso.");
                location.reload();
            });
        }
    }

    // 3. Exportar Excel (Simples)
    function exportarExcel() {
        alert("Gerando planilha com " + Object.keys(dadosGlobais).length + " alunos...");
        // Aqui iria a lógica da biblioteca SheetJS se desejar o arquivo .xlsx real
    }

    // 4. Carregar Dados e Atualizar Gráficos
    function carregarDados() {
        db.ref('resultados').on('value', snapshot => {
            dadosGlobais = snapshot.val() || {};
            const select = document.getElementById('selectTurma');
            select.innerHTML = '<option value="todos">📊 TURMA (Geral)</option>';
            
            Object.keys(dadosGlobais).forEach(id => {
                const option = document.createElement('option');
                option.value = id;
                option.textContent = dadosGlobais[id].nome || id;
                select.appendChild(option);
            });
            atualizarGraficos('todos');
        });
    }

    function atualizarGraficos(filtro) {
        let discRes = {D:0, I:0, S:0, C:0};
        let sapSomas = [0,0,0,0,0,0,0];
        let count = 0;

        const lista = filtro === 'todos' ? Object.values(dadosGlobais) : [dadosGlobais[filtro]];

        lista.forEach(r => {
            if(!r) return;
            count++;
            // Lógica DISC
            for(let i=1; i<=16; i++) { if(r[`disc_${i}`]) discRes[r[`disc_${i}`]]++; }
            // Lógica SAP
            for(let i=1; i<=7; i++) { sapSomas[i-1] += parseFloat(r[`sap_${i}`] || 0); }
        });

        const sapMedias = sapSomas.map(s => count > 0 ? (s/count).toFixed(1) : 0);

        // Renderização dos Gráficos
        renderRadar('radarSap', sapMedias);
        renderBar('barDisc', Object.values(discRes), ['D','I','S','C'], '#ef4444');
        renderBar('barSapTecnico', sapMedias, ['P','R','C','E','Pr','Eq','A'], '#38bdf8');
        renderBar('barEquilibrio', sapMedias, ['P','R','C','E','Pr','Eq','A'], '#facc15');
    }

    function renderRadar(id, dados) {
        if(charts[id]) charts[id].destroy();
        charts[id] = new Chart(document.getElementById(id), {
            type: 'radar',
            data: {
                labels: ['P','R','C','E','Pr','Eq','A'],
                datasets: [{ label: 'Média', data: dados, borderColor: '#38bdf8', backgroundColor: 'rgba(56,189,248,0.2)' }]
            },
            options: { scales: { r: { min:0, max:5, grid: {color:'#374151'}, pointLabels: {color:'#fff'} } } }
        });
    }

    function renderBar(id, dados, labels, cor) {
        if(charts[id]) charts[id].destroy();
        charts[id] = new Chart(document.getElementById(id), {
            type: 'bar',
            data: { labels: labels, datasets: [{ data: dados, backgroundColor: cor }] },
            options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: {color:'#1f2937'} } } }
        });
    }

    function filtrarDados() {
        atualizarGraficos(document.getElementById('selectTurma').value);
    }

    window.onload = carregarDados;
</script>
</body>
</html>
