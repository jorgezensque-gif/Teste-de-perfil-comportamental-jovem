<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico Socioemocional 2026</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        :root { --blue: #38bdf8; --dark: #0f172a; --card: #1e293b; --accent: #facc15; }
        body { background: var(--dark); color: white; font-family: sans-serif; margin: 0; }
        .container { max-width: 650px; margin: 20px auto; padding: 20px; }
        .header { text-align: center; border-bottom: 2px solid var(--blue); padding-bottom: 10px; margin-bottom: 20px; }
        .question-card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; border-left: 5px solid var(--blue); }
        .btn { width: 100%; padding: 18px; background: var(--blue); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .hidden { display: none; }
        .rating-row { display: flex; justify-content: space-between; padding: 10px 0; }
        input[type="text"] { width: 100%; padding: 15px; border-radius: 8px; border: none; margin-bottom: 15px; }
    </style>
</head>
<body>

<div id="app" class="container">
    <div class="header">
        <h2>DIAGNÓSTICO 2026</h2>
        <p id="status-link">Verificando link...</p>
    </div>

    <div id="tela-bloqueio" class="hidden" style="text-align:center; padding:50px 0;">
        <h1 style="color:var(--accent);">⚠️ LINK JÁ UTILIZADO</h1>
        <p>Este teste já foi enviado com sucesso. Se precisar refazer, solicite um novo link ao Jorge.</p>
    </div>

    <div id="tela-teste">
        <div class="question-card">
            <input type="text" id="nomeAluno" placeholder="Seu Nome Completo">
            <p style="font-size: 0.9em; color: #94a3b8;">Responda com atenção. Cada link é único.</p>
            <button class="btn" onclick="iniciar()">COMEÇAR</button>
        </div>
    </div>
</div>

<script>
    // 1. Configuração do seu Banco de Dados
    const firebaseConfig = { databaseURL: "https://perfil-jovem--disc-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. Identifica quem é o aluno pelo link
    const urlParams = new URLSearchParams(window.location.search);
    const linkID = urlParams.get('id');

    // 3. TRAVA DE SEGURANÇA: Verifica se já existe um resultado para este ID
    if (linkID) {
        db.ref('resultados_testes').orderByChild('link_id').equalTo(linkID).once('value', snap => {
            if (snap.exists()) {
                // Se o ID já foi usado, esconde o teste e mostra a trava
                document.getElementById('tela-teste').classList.add('hidden');
                document.getElementById('tela-bloqueio').classList.remove('hidden');
                document.getElementById('status-link').innerText = "Acesso Negado";
            } else {
                document.getElementById('status-link').innerText = "Link Autorizado";
            }
        });
    } else {
        document.getElementById('status-link').innerText = "Acesso Geral";
    }

    function iniciar() {
        const nome = document.getElementById('nomeAluno').value;
        if (!nome) return alert("Por favor, digite seu nome!");
        alert("Teste Iniciado para: " + nome + ". (Aqui entrariam as perguntas)");
        
        // Simulação de envio para testar a trava
        // Quando o aluno clica em enviar no teste real, ele salva o 'link_id'
        /* db.ref('resultados_testes').push({
            aluno: nome,
            link_id: linkID,
            data: new Date().toLocaleString()
        }).then(() => { window.location.reload(); });
        */
    }
</script>
</body>
</html>
