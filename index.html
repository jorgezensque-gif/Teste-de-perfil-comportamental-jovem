<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico Socioemocional 2026</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        :root { --blue: #38bdf8; --dark: #0f172a; --card: #1e293b; --text: #f1f5f9; --accent: #facc15; }
        body { background: var(--dark); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: var(--card); padding: 30px; border-radius: 15px; border: 1px solid #334155; }
        .secao-titulo { color: var(--blue); border-bottom: 2px solid var(--blue); margin: 30px 0 15px; padding-bottom: 5px; text-transform: uppercase; font-weight: bold; }
        .card { background: #1a2233; padding: 20px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid var(--accent); }
        .enunciado-disc { color: var(--accent); font-weight: bold; margin-bottom: 10px; display: block; }
        .opcoes-disc { display: grid; grid-template-columns: 1fr; gap: 8px; }
        .item-disc { background: #2d3748; padding: 12px; border-radius: 5px; cursor: pointer; display: flex; align-items: center; }
        input[type="radio"] { margin-right: 15px; transform: scale(1.2); accent-color: var(--blue); }
        .btn-enviar { width: 100%; padding: 20px; background: #22c55e; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 18px; margin-top: 30px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="status">Verificando acesso...</div>
    <div id="tela-bloqueio" class="hidden">
        <h1 style="color:var(--accent); text-align: center;">⚠️ LINK JÁ UTILIZADO</h1>
    </div>

    <div id="tela-teste" class="hidden">
        <h2 style="text-align:center;">DIAGNÓSTICO 2026</h2>

        <div class="secao-titulo">PARTE 1: SAP (AUTOAVALIAÇÃO)</div>
        <div id="sap-container"></div>

        <div class="secao-titulo">PARTE 2: PERFIL COMPORTAMENTAL (DISC)</div>
        <div id="disc-container"></div>

        <button class="btn-enviar" onclick="enviarTudo()">FINALIZAR E ENVIAR</button>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://perfil-jovem--disc-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const urlParams = new URLSearchParams(window.location.search);
    const linkID = urlParams.get('id');

    // 7 COMPETÊNCIAS SAP
    const saps = [
        { t: "1-SER PROTAGONISTA", d: "Se conscientiza de sua identidade, autônomo e construtor do destino." },
        { t: "2-SER RESPONSÁVEL E COMPROMETIDO", d: "Pontualidade, prazos, regras e higiene pessoal." },
        { t: "3-COMPREENDER CONTEXTOS E COMUNICAR-SE", d: "Capacidade de compreender o outro e se expressar." },
        { t: "4-SER DEMOCRÁTICO, ÉTICO E CIDADÃO", d: "Valores, princípios, honestidade e respeito." },
        { t: "5-RESOLVER SITUAÇÕES-PROBLEMA", d: "Enfrentar problemas, pensar alternativas e decidir." },
        { t: "6-TRABALHAR E PRODUZIR EM EQUIPE", d: "Colaborar e colocar o grupo acima do pessoal." },
        { t: "7-APRENDER A APRENDER", d: "Habilidade para buscar e construir novos conhecimentos." }
    ];

    // 16 PERGUNTAS DISC COM ENUNCIADOS
    const discDados = [
        { q: "Como você se descreve em situações sociais?", opts: ["Animado", "Aventureiro", "Analítico", "Adaptável"] },
        { q: "Qual característica é mais forte em você?", opts: ["Brincalhão", "Persuasivo", "Persistente", "Pacífico"] },
        { q: "Como você age em um grupo?", opts: ["Sociável", "Decidido", "Auto-sacrifício", "Submisso"] },
        { q: "Ao tentar convencer alguém, você é:", opts: ["Convincente", "Competitivo", "Considerado", "Controlado"] },
        { q: "Em novos desafios, você se sente:", opts: ["Estimulante", "Ousado", "Respeitoso", "Reservado"] },
        { q: "Como os outros te percebem?", opts: ["Espirituoso", "Auto-confiante", "Sensível", "Satisfeito"] },
        { q: "Sua postura no trabalho/estudo é:", opts: ["Promotor", "Positivo", "Planejador", "Paciente"] },
        { q: "Como você lida com imprevistos?", opts: ["Espontâneo", "Seguro", "Pontual", "Tímido"] },
        { q: "Sua atitude perante a vida é:", opts: ["Otimista", "Franco", "Ordeiro", "Cortês"] },
        { q: "Em momentos de descontração, você é:", opts: ["Engraçado", "Vigoroso", "Fiel", "Amigável"] },
        { q: "Ao lidar com pessoas, você busca ser:", opts: ["Encantador", "Audaz", "Minucioso", "Diplomático"] },
        { q: "Sua maior qualidade é ser:", opts: ["Alegre", "Confiante", "Culto", "Tolerante"] },
        { q: "Sua forma de pensar é:", opts: ["Inspirador", "Independente", "Idealista", "Inofensivo"] },
        { q: "Como você expressa suas opiniões?", opts: ["Demonstrativo", "Decisivo", "Profundo", "Irônico"] },
        { q: "Como você se adapta ao ambiente?", opts: ["Misturável", "Impaciente", "Músico", "Mediador"] },
        { q: "Sua energia diária é:", opts: ["Vivo", "Obstinado", "Pensativo", "Condescendente"] }
    ];

    const sapDiv = document.getElementById('sap-container');
    saps.forEach((s, i) => {
        sapDiv.innerHTML += `<div class="card"><strong>${s.t}</strong><br><small>${s.d}</small><div style="display:flex; justify-content:space-between; margin-top:10px;">${[1,2,3,4,5].map(n => `<div>${n}<br><input type="radio" name="sap${i}" value="${n}"></div>`).join('')}</div></div>`;
    });

    const discDiv = document.getElementById('disc-container');
    discDados.forEach((item, i) => {
        discDiv.innerHTML += `
            <div class="card" style="border-left-color: var(--blue);">
                <span class="enunciado-disc">${i+1}. ${item.q}</span>
                <div class="opcoes-disc">
                    ${item.opts.map((palavra, idx) => `
                        <label class="item-disc">
                            <input type="radio" name="disc${i}" value="${['I','D','C','S'][idx]}"> ${palavra}
                        </label>
                    `).join('')}
                </div>
            </div>`;
    });

    if (linkID) {
        db.ref('travas/' + linkID).once('value', snap => {
            document.getElementById('status').classList.add('hidden');
            if (snap.exists()) document.getElementById('tela-bloqueio').classList.remove('hidden');
            else document.getElementById('tela-teste').classList.remove('hidden');
        });
    }

    function enviarTudo() {
        let dados = { link_id: linkID, data: new Date().toLocaleString() };
        for(let i=0; i<7; i++) {
            const v = document.querySelector(`input[name="sap${i}"]:checked`)?.value;
            if(!v) return alert("Responda todo o SAP!");
            dados[`sap_${i+1}`] = v;
        }
        for(let i=0; i<16; i++) {
            const v = document.querySelector(`input[name="disc${i}"]:checked`)?.value;
            if(!v) return alert("Responda todo o DISC!");
            dados[`disc_${i+1}`] = v;
        }
        db.ref('resultados/' + linkID).set(dados).then(() => {
            db.ref('travas/' + linkID).set({ status: "usado" }).then(() => {
                alert("Enviado!");
                window.location.reload();
            });
        });
    }
</script>
</body>
</html>
