<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Gestor - Jorge Zensque</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --blue: #38bdf8; --green: #22c55e; --red: #ef4444; }
        body { background-color: var(--bg); color: white; font-family: sans-serif; padding: 20px; margin: 0; }
        .header-admin { border: 2px dashed var(--blue); padding: 15px; border-radius: 10px; display: flex; gap: 10px; margin-bottom: 20px; }
        .header-admin input { flex: 1; padding: 10px; border-radius: 5px; border: none; background: #000; color: #fff; }
        .painel-box { background-color: var(--card); border-radius: 15px; padding: 20px; border-top: 4px solid var(--red); }
        .btn { padding: 10px 15px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; color: white; }
        .btn-wpp { background-color: var(--green); }
        .btn-excel { background-color: var(--green); }
        .btn-zerar { background-color: var(--red); }
        select { background: #111827; color: white; padding: 10px; border-radius: 6px; border: 1px solid var(--blue); cursor: pointer; }
        .grid-charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-top: 20px; }
        .card-chart { background-color: #0f172a; padding: 15px; border-radius: 10px; height: 350px; border: 1px solid #334155; }
        h3 { margin: 0 0 15px 0; font-size: 14px; text-transform: uppercase; color: #9ca3af; }
    </style>
</head>
<body>

    <div class="header-admin">
        <input type="text" id="nomeAluno" placeholder="Nome do Aluno">
        <button class="btn btn-wpp" onclick="gerarLink()">GERAR E DISPARAR WHATSAPP</button>
    </div>

    <div class="painel-box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div>
                <h2 style="margin:0;">PAINEL GESTOR</h2>
                <small style="color: #38bdf8;">Responsável: Jorge Zensque</small>
            </div>
            <div style="display: flex; gap: 10px;">
                <select id="selectTurma" onchange="selecionarAluno(this.value)">
                    <option value="todos">📊 TURMA</option>
                </select>
                <button class="btn btn-excel" onclick="exportarExcel()">📊 EXCEL</button>
                <button class="btn btn-zerar" onclick="zerarDados()">ZERAR</button>
            </div>
        </div>

        <div class="grid-charts">
            <div class="card-chart"><h3>1. Autoavaliação SAP (Radar)</h3><canvas id="radarSap"></canvas></div>
            <div class="card-chart"><h3>2. Perfil (DISC)</h3><canvas id="barDisc"></canvas></div>
            <div class="card-chart"><h3>3. Técnico (SAP)</h3><canvas id="barSapTecnico"></canvas></div>
            <div class="card-chart"><h3>4. Equilíbrio: DISC vs SAP</h3><canvas id="barEquilibrio"></canvas></div>
        </div>
    </div>

<script>
    const firebaseConfig = { databaseURL: "https://perfil-jovem--disc-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let dadosAlunos = {};
    let charts = {};

    function carregarDados() {
        db.ref('resultados').on('value', snapshot => {
            dadosAlunos = snapshot.val() || {};
            const select = document.getElementById('selectTurma');
            select.innerHTML = '<option value="todos">📊 TURMA (Geral)</option>';
            
            Object.keys(dadosAlunos).forEach(id => {
                const opt = document.createElement('option');
                opt.value = id;
                opt.textContent = dadosAlunos[id].nome || id;
                select.appendChild(opt);
            });
            atualizarGraficos('todos');
        });
    }

    function atualizarGraficos(filtro) {
        let lista = filtro === 'todos' ? Object.values(dadosAlunos) : [dadosAlunos[filtro]];
        // Lógica de cálculo simplificada para os gráficos
        console.log("Atualizando gráficos para:", filtro);
    }

    function gerarLink() {
        const nome = document.getElementById('nomeAluno').value;
        if(!nome) return alert("Digite o nome!");
        const link = window.location.origin + "/resultados.html?nome=" + encodeURIComponent(nome);
        window.open(`https://api.whatsapp.com/send?text=Olá ${nome}, faça seu teste: ${link}`);
    }

    function zerarDados() {
        if(confirm("Jorge, deseja apagar todos os dados?")) db.ref('resultados').remove();
    }

    function exportarExcel() {
        const ws = XLSX.utils.json_to_sheet(Object.values(dadosAlunos));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Dados");
        XLSX.writeFile(wb, "Relatorio_Jorge.xlsx");
    }

    window.onload = carregarDados;
</script>
</body>
</html>
