<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação SAP & DISC - Jorge Zensque</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .quiz-container { background: #1e293b; padding: 30px; border-radius: 15px; max-width: 600px; width: 100%; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .pergunta { display: none; }
        .pergunta.ativa { display: block; }
        .opcoes { display: grid; gap: 10px; margin-top: 20px; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #22c55e; color: white; }
        .progresso { height: 8px; background: #334155; border-radius: 4px; margin-bottom: 20px; }
        .barra { height: 100%; background: #22c55e; width: 0%; transition: 0.3s; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="progresso"><div class="barra" id="barraProgresso"></div></div>
    <div id="quiz-content">
        </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://perfil-jovem--disc-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const params = new URLSearchParams(window.location.search);
    const nomeAluno = params.get('nome') || "Aluno";

    // 16 Perguntas (Exemplo misto SAP e DISC)
    const perguntas = [
        { t: "Em um grupo, você prefere:", o: ["Liderar as decisões (D)", "Animar as pessoas (I)", "Manter a harmonia (S)", "Analisar os fatos (C)"], v: ["D", "I", "S", "C"], tipo: "DISC" },
        { t: "Sobre prazos, você:", o: ["Cumpre a qualquer custo", "Se enrola um pouco", "Prefere ritmo constante", "É perfeccionista"], v: ["D", "I", "S", "C"], tipo: "DISC" },
        // ... Adicione as outras 14 perguntas aqui seguindo o padrão
    ];

    let atual = 0;
    let respostasDISC = { D:0, I:0, S:0, C:0 };
    let respostasSAP = [0,0,0,0,0,0,0]; // Médias das competências

    function carregarPergunta() {
        const p = perguntas[atual];
        if (!p) return finalizar();
        
        let html = `<h3>${p.t}</h3><div class="opcoes">`;
        p.o.forEach((opcao, i) => {
            html += `<button onclick="proxima('${p.v[i]}', ${p.tipo === 'SAP' ? i : -1})">${opcao}</button>`;
        });
        document.getElementById('quiz-content').innerHTML = html + `</div>`;
        document.getElementById('barraProgresso').style.width = ((atual / perguntas.length) * 100) + "%";
    }

    function proxima(valor, indexSAP) {
        if (indexSAP === -1) { respostasDISC[valor]++; } 
        else { respostasSAP[indexSAP] = (respostasSAP[indexSAP] || 0) + 1; }
        
        atual++;
        carregarPergunta();
    }

    function finalizar() {
        const resultado = {
            nome: nomeAluno,
            data: new Date().toLocaleString(),
            pontosDISC: respostasDISC,
            pontosSAP: [4, 3, 5, 2, 4, 3, 5] // Simulação SAP para o gráfico radar
        };

        db.ref('resultados').push(resultado).then(() => {
            document.getElementById('quiz-content').innerHTML = "<h2>Obrigado! Suas respostas foram enviadas para Jorge.</h2>";
        });
    }

    carregarPergunta();
</script>
</body>
</html>
