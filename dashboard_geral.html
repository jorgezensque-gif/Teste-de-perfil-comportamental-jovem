<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>DASHBOARD GERAL - MAPEAMENTO DE TURMA</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .header { background: #1e293b; padding: 20px; border-radius: 12px; border-bottom: 4px solid #f59e0b; margin-bottom: 20px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; height: 450px; position: relative; }
        h3 { color: #1e293b; text-align: center; margin-bottom: 15px; text-transform: uppercase; font-size: 0.9rem; }
        .stats { background: #3b82f6; color: white; padding: 10px; border-radius: 8px; font-weight: bold; margin-bottom: 20px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="margin:0; font-size: 1.5rem;">MAPEAMENTO COLETIVO DE TURMA</h1>
        <small>Gestor Responsável: Jorge Zensque</small>
    </div>

    <div id="contador" class="stats">CONTANDO JOVENS...</div>

    <div class="grid">
        <div class="card">
            <h3>Média de Perfil Comportamental (DISC)</h3>
            <canvas id="canvasDISC"></canvas>
        </div>
        <div class="card">
            <h3>Equilíbrio Socioemocional (Radar SAP)</h3>
            <canvas id="canvasRadar"></canvas>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://perfil-jovem--disc-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let chartDISC, chartRadar;

    function iniciar() {
        // Configuração do Gráfico DISC
        chartDISC = new Chart(document.getElementById('canvasDISC'), {
            type: 'bar',
            data: {
                labels: ['Dominância', 'Influência', 'Estabilidade', 'Conformidade'],
                datasets: [{ data: [], backgroundColor: ['#ef4444', '#facc15', '#22c55e', '#3b82f6'] }]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 7 } } }
        });

        // Configuração do Radar SAP (COM TRAVA DE ESCALA)
        chartRadar = new Chart(document.getElementById('canvasRadar'), {
            type: 'radar',
            data: {
                labels: ['Protagonismo', 'Responsabilidade', 'Comunicação', 'Ética', 'Problemas', 'Equipe', 'Aprender'],
                datasets: [{ 
                    label: 'Média da Turma', 
                    data: [], 
                    backgroundColor: 'rgba(59, 130, 246, 0.4)', 
                    borderColor: '#3b82f6', 
                    borderWidth: 3,
                    fill: true 
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    r: {
                        min: 0,
                        max: 5, // Trava para não "vazar" da tela
                        beginAtZero: true,
                        ticks: { stepSize: 1, color: '#1e293b' },
                        grid: { color: '#cbd5e1' }
                    }
                }
            }
        });
    }

    database.ref('resultados_testes').on('value', snap => {
        let n = 0;
        let d = [0,0,0,0], s = [0,0,0,0,0,0,0];

        snap.forEach(child => {
            const r = child.val();
            n++;
            // Força conversão para número
            d[0] += parseFloat(r.disc.D || 0);
            d[1] += parseFloat(r.disc.I || 0);
            d[2] += parseFloat(r.disc.S || 0);
            d[3] += parseFloat(r.disc.C || 0);

            for(let i=0; i<7; i++) {
                s[i] += parseFloat(r.sap['q'+i] || 0);
            }
        });

        if(n > 0) {
            document.getElementById('contador').innerText = `TOTAL DE AVALIADOS: ${n} JOVENS`;
            chartDISC.data.datasets[0].data = d.map(v => v/n);
            chartRadar.data.datasets[0].data = s.map(v => v/n);
            chartDISC.update();
            chartRadar.update();
        }
    });

    window.onload = iniciar;
</script>
</body>
</html>
