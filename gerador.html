<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Links - Jorge</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .box { background: #1e293b; padding: 30px; border-radius: 15px; width: 100%; max-width: 500px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; color: black; }
        button { width: 100%; padding: 15px; background: #38bdf8; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #resultado { background: #0f172a; padding: 15px; margin-top: 20px; border-radius: 8px; border: 1px dashed #38bdf8; display: none; word-break: break-all; }
    </style>
</head>
<body>

<div class="box" id="painel-gerador" style="display:none;">
    <h2>Gerador de Links - Jorge</h2>
    <p>Digite o nome do aluno para gerar o link:</p>
    <input type="text" id="idAluno" placeholder="Ex: Maria Silva">
    <button onclick="gerarLink()">GERAR LINK E COPIAR</button>
    <div id="resultado">
        <b style="color: #38bdf8;">Link copiado! Envie no WhatsApp:</b><br><br>
        <span id="linkFinal"></span>
    </div>
</div>

<script>
    // 🔑 MUDE SUA SENHA AQUI:
    const SENHA_MESTRA = "1234"; 

    // Só mostra o gerador se a senha estiver certa
    const tentativa = prompt("Digite a Senha do Jorge para acessar o Gerador:");
    
    if (tentativa === SENHA_MESTRA) {
        document.getElementById('painel-gerador').style.display = 'block';
    } else {
        alert("Senha Incorreta!");
        // Se errar, ele apenas recarrega para tentar de novo, não volta pro teste
        window.location.reload(); 
    }

    function gerarLink() {
        const nome = document.getElementById('idAluno').value.trim();
        if (!nome) return alert("Digite o nome!");

        const idLimpo = nome.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-');
        const link = "https://teste-de-perfil-comportamental-jove.vercel.app/?id=" + idLimpo;

        document.getElementById('linkFinal').innerText = link;
        document.getElementById('resultado').style.display = 'block';

        navigator.clipboard.writeText(link).then(() => {
            alert("Link de " + nome + " copiado com sucesso!");
        });
    }
</script>
</body>
</html>
