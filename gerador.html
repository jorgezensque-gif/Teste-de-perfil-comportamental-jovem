<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel do Jorge - Gerador</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: #1e293b; padding: 30px; border-radius: 15px; text-align: center; width: 400px; border: 1px solid #334155; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #38bdf8; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: #000; }
        #link-box { margin-top: 20px; padding: 15px; border: 1px dashed #38bdf8; display: none; word-break: break-all; color: #facc15; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Gerador de Links</h2>
        <input type="text" id="nomeAluno" placeholder="Nome do Aluno">
        <button onclick="gerar()">GERAR LINK DO ALUNO</button>
        <div id="link-box"></div>
    </div>

    <script>
        function gerar() {
            const nome = document.getElementById('nomeAluno').value.trim();
            if (!nome) return alert("Digite o nome!");
            
            // Cria o ID limpo (ex: maria-leopoldina)
            const id = nome.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-');
            
            // O LINK AGORA APONTA PARA index.html (O TESTE)
            const link = window.location.origin + "/index.html?id=" + id;

            const box = document.getElementById('link-box');
            box.style.display = 'block';
            box.innerText = link;

            navigator.clipboard.writeText(link);
            alert("Link de " + nome + " copiado! Mande este link para o aluno.");
        }
    </script>
</body>
</html>
