<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação de Competências - Jorge Zensque</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f9; color: #333; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); border-top: 10px solid #0056b3; }
        h2 { color: #0056b3; text-align: center; margin-bottom: 30px; }
        .pergunta-bloco { margin-bottom: 40px; padding: 20px; border: 1px solid #eee; border-radius: 10px; background-color: #fafafa; }
        .titulo-competencia { font-size: 1.2em; font-weight: bold; color: #0056b3; display: block; margin-bottom: 5px; text-transform: uppercase; }
        .descricao-apoio { font-size: 0.95em; color: #555; line-height: 1.5; margin-bottom: 15px; display: block; font-style: italic; background: #eef2f7; padding: 10px; border-left: 4px solid #0056b3; }
        .opcoes { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; background: white; padding: 10px; border-radius: 8px; }
        .opcao-item { text-align: center; flex: 1; }
        input[type="radio"] { width: 20px; height: 20px; cursor: pointer; }
        .label-escala { font-size: 0.8em; color: #777; display: block; margin-top: 5px; }
        input[type="text"] { width: 100%; padding: 12px; margin: 10px 0 25px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 1em; }
        button { width: 100%; padding: 15px; background-color: #0056b3; color: white; border: none; border-radius: 8px; font-size: 1.1em; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #003d80; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="tituloFase">AVALIAÇÃO DE COMPETÊNCIAS</h2>
    
    <div id="formIdentificacao">
        <label><b>DIGITE SEU NOME COMPLETO:</b></label>
        <input type="text" id="nomeParticipante" placeholder="Ex: João Silva">
        <button onclick="iniciarAvaliacao()">INICIAR AVALIAÇÃO</button>
    </div>

    <div id="questoes" style="display:none;">
        <p style="text-align: center; font-weight: bold; color: #d35400;">Escala de 1 (Mínimo) a 10 (Máximo)</p>
        <div id="listaPerguntas"></div>
        <button onclick="finalizar()">ENVIAR RESPOSTAS</button>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const etapa = urlParams.get('etapa') || 'I';
    document.getElementById('tituloFase').innerText = "AVALIAÇÃO DE COMPETÊNCIAS - ETAPA " + etapa;

    const COMPETENCIAS = [
        { 
            ref: "PROT", 
            titulo: "PROTAGONISMO", 
            desc: "Capacidade de assumir a responsabilidade por sua própria vida e ações. Envolve iniciativa, liderança pessoal e a busca ativa por soluções, sem esperar que os outros decidam por você." 
        },
        { 
            ref: "RESP", 
            titulo: "RESPONSABILIDADE", 
            desc: "Cumprimento de deveres e obrigações de forma íntegra. Capacidade de responder pelas consequências de suas escolhas e manter o compromisso com prazos e combinados." 
        },
        { 
            ref: "COM", 
            titulo: "COMUNICAÇÃO", 
            desc: "Habilidade de expressar ideias com clareza e ouvir ativamente. Envolve empatia, assertividade e a capacidade de transmitir mensagens de forma que sejam compreendidas sem conflitos." 
        },
        { 
            ref: "CID", 
            titulo: "CIDADANIA E ÉTICA", 
            desc: "Atuação baseada em princípios morais e respeito ao coletivo. Compreender seu papel na sociedade, respeitando direitos alheios e agindo de forma justa e honesta." 
        },
        { 
            ref: "SOL", 
            titulo: "SOLUÇÃO DE PROBLEMAS", 
            desc: "Capacidade analítica para identificar desafios e propor caminhos eficazes. Envolve criatividade, pensamento crítico e foco na resolução prática de obstáculos." 
        },
        { 
            ref: "EQUIP", 
            titulo: "TRABALHO EM EQUIPE", 
            desc: "Capacidade de colaborar com outros para um objetivo comum. Valorizar a diversidade de opiniões, ajudar os colegas e contribuir para um clima de cooperação." 
        },
        { 
            ref: "APR", 
            titulo: "APRENDER A APRENDER", 
            desc: "Disposição para adquirir novos conhecimentos constantemente. Reconhecer que não sabe tudo, ter curiosidade intelectual e resiliência para evoluir com novos desafios." 
        }
    ];

    function iniciarAvaliacao() {
        const nome = document.getElementById('nomeParticipante').value;
        if (nome.length < 3) return alert("Por favor, digite seu nome completo.");
        
        document.getElementById('formIdentificacao').style.display = 'none';
        const areaPerguntas = document.getElementById('questoes');
        areaPerguntas.style.display = 'block';

        const lista = document.getElementById('listaPerguntas');
        COMPETENCIAS.forEach((c) => {
            let htmlOpcoes = "";
            for(let i=1; i<=10; i++) {
                htmlOpcoes += `
                    <div class="opcao-item">
                        <input type="radio" name="${c.ref}" value="${i}">
                        <span class="label-escala">${i}</span>
                    </div>`;
            }

            lista.innerHTML += `
                <div class="pergunta-bloco">
                    <span class="titulo-competencia">${c.titulo}</span>
                    <span class="descricao-apoio">${c.desc}</span>
                    <div class="opcoes">${htmlOpcoes}</div>
                </div>`;
        });
    }

    async function finalizar() {
        const nome = document.getElementById('nomeParticipante').value;
        const respostasSap = [];
        let todasRespondidas = true;

        COMPETENCIAS.forEach(c => {
            const r = document.querySelector(`input[name="${c.ref}"]:checked`);
            if (r) respostasSap.push(r.value);
            else todasRespondidas = false;
        });

        if (!todasRespondidas) return alert("Por favor, responda todas as competências!");

        // Redireciona para o teste DISC após o SAP
        const sapString = JSON.stringify(respostasSap);
        window.location.href = `disc.html?nome=${encodeURIComponent(nome)}&sap=${sapString}&etapa=${etapa}`;
    }
</script>

</body>
</html>
