<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Quiz 16 Perguntas</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: #1e293b; padding: 30px; border-radius: 15px; width: 90%; max-width: 500px; border-top: 5px solid #38bdf8; }
        .btn { background: #334155; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; margin-top: 10px; width: 100%; text-align: left; }
        .btn:hover { background: #38bdf8; color: #0f172a; }
    </style>
</head>
<body>
    <div class="box">
        <h2 id="pergunta"></h2>
        <div id="opcoes"></div>
    </div>

<script>
    const config = { databaseURL: "https://perfil-jovem--disc-default-rtdb.firebaseio.com" };
    firebase.initializeApp(config);
    const db = firebase.database();

    const nome = new URLSearchParams(window.location.search).get('nome') || "Jorge";
    
    // As 16 perguntas completas
    const lista = [
        { q: "1. Como prefere atuar em projetos?", o: ["Liderar", "Motivar", "Paciência", "Técnica"], v: ["D","I","S","C"] },
        { q: "2. Qual sua prioridade?", o: ["Metas", "Pessoas", "Segurança", "Regras"], v: ["D","I","S","C"] },
        { q: "3. Na conversa, você é:", o: ["Direto", "Entusiasmado", "Ouvinte", "Preciso"], v: ["D","I","S","C"] },
        { q: "4. Reação a desafios:", o: ["Determinação", "Otimismo", "Cautela", "Análise"], v: ["D","I","S","C"] },
        { q: "5. O que incomoda?", o: ["Falta de poder", "Isolamento", "Mudança", "Desordem"], v: ["D","I","S","C"] },
        { q: "6. Como decide?", o: ["Rápido", "Intuição", "Grupo", "Dados"], v: ["D","I","S","C"] },
        { q: "7. Sob pressão:", o: ["Autoritário", "Agitado", "Calado", "Crítico"], v: ["D","I","S","C"] },
        { q: "8. Como te veem?", o: ["Decidido", "Alegre", "Fiel", "Sério"], v: ["D","I","S","C"] },
        // SAP
        { q: "9. Autoconfiança:", o: ["Baixa", "Média", "Alta", "Total"], v: [1,2,4,5], s: 0 },
        { q: "10. Entrega prazos?", o: ["Não", "Às vezes", "Sempre", "Adiantado"], v: [1,2,4,5], s: 1 },
        { q: "11. Organização:", o: ["Nenhuma", "Pouca", "Muita", "Total"], v: [1,2,4,5], s: 2 },
        { q: "12. Sociabilidade:", o: ["Tímido", "Normal", "Gosta", "Ama"], v: [1,2,4,5], s: 3 },
        { q: "13. Mantém a calma?", o: ["Nunca", "Raramente", "Geralmente", "Sempre"], v: [1,2,4,5], s: 4 },
        { q: "14. Curiosidade:", o: ["Zero", "Pouca", "Bastante", "Muita"], v: [1,2,4,5], s: 5 },
        { q: "15. Empatia:", o: ["Não", "Às vezes", "Sim", "Sempre"], v: [1,2,4,5], s: 6 },
        { q: "16. Foco total?", o: ["Não", "Difícil", "Fácil", "Sempre"], v: [1,2,4,5], s: 7 }
    ];

    let index = 0;
    let disc = { D:0, I:0, S:0, C:0 };
    let sap = [0,0,0,0,0,0,0,0];

    function mostrar() {
        if (index >= lista.length) {
            db.ref('resultados').push({ nome, disc, sap }).then(() => {
                document.body.innerHTML = "<h1>✅ Sucesso! Dados enviados.</h1>";
            });
            return;
        }
        const p = lista[index];
        document.getElementById('pergunta').innerText = p.q;
        const div = document.getElementById('opcoes');
        div.innerHTML = "";
        p.o.forEach((txt, i) => {
            const b = document.createElement('button');
            b.className = "btn";
            b.innerText = txt;
            b.onclick = () => {
                const val = p.v[i];
                if (typeof val === 'string') disc[val]++;
                else sap[p.s] = val;
                index++;
                mostrar();
            };
            div.appendChild(b);
        });
    }
    mostrar();
</script>
</body>
</html>
