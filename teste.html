<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Avaliação Pescar 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
        .box { background: white; padding: 25px; border-radius: 8px; max-width: 800px; margin: auto; border-top: 10px solid #0056b3; }
        .sap-item { margin-bottom: 25px; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .sap-titulo { font-weight: bold; color: #0056b3; display: block; margin-bottom: 5px; }
        .sap-evidencias { font-size: 0.85em; color: #666; display: block; margin-bottom: 10px; }
        .escala-botoes { display: flex; justify-content: center; gap: 10px; }
        .btn-n { width: 45px; height: 45px; border: 2px solid #0056b3; background: white; color: #0056b3; font-weight: bold; border-radius: 50%; cursor: pointer; }
        .btn-n.ativo { background: #0056b3; color: white; }
        .disc-box { background: #161b22; color: white; padding: 20px; border-radius: 10px; margin-top: 30px; }
        .disc-row { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid #30363d; font-size: 0.9em; }
        .btn-enviar { width: 100%; padding: 20px; background: #28a745; color: white; border: none; border-radius: 5px; font-weight: bold; font-size: 1.2em; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
<div class="box">
    <h2 style="text-align:center;">Autoavaliação SAP Jovem 5.0</h2>
    <input type="text" id="nome" placeholder="NOME DO JOVEM" style="width:100%; padding:10px; margin-bottom:20px; box-sizing:border-box;">
    
    <div id="sap-lista"></div>

    <div class="disc-box">
        <h3 style="color:#f1c40f;">PERFIL DISC</h3>
        <div class="disc-row" style="color:#f1c40f; font-weight:bold;"><span>Frases</span><span>MAIS(+)</span><span>MENOS(-)</span></div>
        <div id="disc-lista"></div>
    </div>
    <button id="btn-enviar" class="btn-enviar" onclick="enviar()">ENVIAR AO JORGE</button>
</div>

<script>
    const sapDados = [
        {t:"1- PROTAGONISTA", e:"Referência construtiva, Projeto de Vida, ajuda outros."},
        {t:"2- RESPONSÁVEL", e:"Pontual, cumpre prazos e regras, cuida da higiene."},
        {t:"3- COMUNICADOR", e:"Clareza, respeita a vez de falar, postura coerente."},
        {t:"4- ÉTICO", e:"Honesto, assume erros, respeita opiniões diferentes."},
        {t:"5- RESOLVEDOR", e:"Enfrenta desafios, lida com sentimentos, sem fofoca."},
        {t:"6- EQUIPE", e:"Bem-estar do grupo, busca consenso, recebe críticas."},
        {t:"7- APRENDER", e:"Curioso, busca novos conhecimentos, tira lições."}
    ];

    sapDados.forEach((item, i) => {
        document.getElementById('sap-lista').innerHTML += `
            <div class="sap-item">
                <span class="sap-titulo">${item.t}</span>
                <span class="sap-evidencias">${item.e}</span>
                <div class="escala-botoes">
                    ${[1,2,3,4,5].map(n => `<button class="btn-n q${i+1}" onclick="marcar(this, ${i+1}, ${n})">${n}</button>`).join('')}
                    <input type="hidden" id="sap${i+1}">
                </div>
            </div>`;
    });

    function marcar(btn, q, v) {
        document.querySelectorAll('.q'+q).forEach(b => b.classList.remove('ativo'));
        btn.classList.add('ativo');
        document.getElementById('sap'+q).value = v;
    }

    const frases = ["Liderança rápida", "Conversar/Animar", "Ritmo calmo", "Atenção a regras", "Foco em resultados", "Otimista/Amigos", "Bom ouvinte", "Organizado", "Direto ao ponto", "Entusiasta", "Evito conflitos", "Analiso fatos", "Independente", "Centro das atenções", "Paciente", "Busco perfeição"];
    const tipos = ["D","I","S","C","D","I","S","C","D","I","S","C","D","I","S","C"];

    frases.forEach((f, i) => {
        document.getElementById('disc-lista').innerHTML += `
            <div class="disc-row">
                <span>${f}</span>
                <input type="radio" name="m${i}" class="mais" data-t="${tipos[i]}">
                <input type="radio" name="l${i}" class="menos" data-t="${tipos[i]}">
            </div>`;
    });

    async function enviar() {
        const nome = document.getElementById('nome').value;
        if(!nome) return alert("Nome!");
        
        let saps = {};
        for(let i=1; i<=7; i++) {
            saps['sap'+i] = document.getElementById('sap'+i).value;
            if(!saps['sap'+i]) return alert("Responda o SAP "+i);
        }

        let d = {D:0, I:0, S:0, C:0};
        document.querySelectorAll('.mais:checked').forEach(r => d[r.dataset.t]++);
        document.querySelectorAll('.menos:checked').forEach(r => d[r.dataset.t]--);

        const dados = { nome, ...saps, disc: `${d.D}-${d.I}-${d.S}-${d.C}` };
        
        try {
            await fetch("https://script.google.com/macros/s/AKfycbLGM8EKwurE1kSgeCMgzERR8g4lWh9yNFPSX7Er43tGUddzrBGRfYusKFU_DDdQomr/exec", {
                method: "POST", body: JSON.stringify(dados)
            });
            alert("Enviado!"); window.location.reload();
        } catch (e) { alert("Erro de rede!"); }
    }
</script>
</body>
</html>
