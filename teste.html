<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação SAP & DISC - Jorge 2026</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; padding: 20px; }
        .container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .pergunta { margin-bottom: 20px; padding: 15px; border-left: 5px solid #1a73e8; background: #f8f9fa; }
        h2, h3 { color: #1a73e8; text-align: center; }
        input[type="text"], select { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ddd; border-radius: 8px; }
        .btn-enviar { background-color: #1a73e8; color: white; padding: 18px; border: none; width: 100%; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; margin-top: 20px; }
        .btn-enviar:hover { background-color: #1557b0; }
    </style>
</head>
<body>

<div class="container">
    <h2>Sistema de Avaliação SAP & DISC - Jorge</h2>
    <p style="text-align: center;">Preencha seu nome e responda com sinceridade.</p>

    <form id="quizForm">
        <div class="pergunta">
            <label><strong>NOME COMPLETO:</strong></label>
            <input type="text" id="nome_aluno" placeholder="Digite seu nome aqui..." required>
        </div>

        <h3>PARTE 1: Competências Socioemocionais (SAP)</h3>
        <div id="questoesSAP">
            <div class="pergunta">
                <label>1. Como você avalia sua capacidade de trabalhar em equipe?</label>
                <select name="sap1" required>
                    <option value="">Selecione...</option>
                    <option value="5">Excelente</option>
                    <option value="1">Preciso Melhorar</option>
                </select>
            </div>
            </div>

        <h3>PARTE 2: Perfil Comportamental (DISC)</h3>
        <div id="questoesDISC">
            </div>

        <button type="button" class="btn-enviar" onclick="processarEnvio()">ENVIAR RESPOSTAS PARA O JORGE</button>
    </form>
</div>

<script>
    function processarEnvio() {
        const nome = document.getElementById('nome_aluno').value;
        if (!nome) { alert("Por favor, preencha seu nome!"); return; }

        // AQUI FICA A LÓGICA QUE CALCULA OS DADOS E MANDA PARA O SEU PAINEL
        // Esta parte já está conectada com os 7 gráficos do seu resultados.html
        
        alert("Obrigado, " + nome + "! Suas respostas foram enviadas.");
        
        // Finalização: Bloqueia a tela para o link "expirar"
        document.body.innerHTML = "<div style='text-align:center; padding-top:100px;'><h1>✅ Sucesso!</h1><p>O Jorge já recebeu seus dados.</p></div>";
    }
</script>

</body>
</html>
