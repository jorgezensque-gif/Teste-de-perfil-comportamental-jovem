<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Avaliação Pescar 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; background: #0d1117; color: white; padding: 20px; }
        .box { background: #161b22; padding: 20px; border-radius: 10px; max-width: 600px; margin: auto; border: 1px solid #30363d; }
        .item { margin-bottom: 25px; padding: 15px; background: #21262d; border-radius: 8px; }
        .titulo { color: #f1c40f; font-weight: bold; }
        input[type="range"] { width: 100%; margin: 10px 0; }
        .disc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-disc { padding: 10px; border: 1px solid #30363d; background: #0d1117; color: white; cursor: pointer; border-radius: 5px; }
        .btn-disc.selected { background: #238636; }
        .btn-enviar { width: 100%; padding: 20px; background: #238636; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-wpp-link { width: 100%; padding: 15px; background: #007bff; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; display: block; text-align: center; text-decoration: none; }
    </style>
</head>
<body>

<div class="box">
    <h2>Avaliação Jovem - Jorge Zensque</h2>
    
    <a href="#" class="btn-wpp-link" onclick="compartilharLink()">ENVIAR LINK PELO WHATSAPP</a>

    <hr style="border: 0.5px solid #30363d; margin: 25px 0;">

    <input type="text" id="nome" placeholder="Seu Nome Completo" style="width: 100%; padding: 10px; margin-bottom: 20px;">

    <h3>SAP 5.0 (Arraste de 1 a 5)</h3>
    <div id="sap"></div>

    <h3>DISC (Selecione o que combina com você)</h3>
    <div class="disc-grid" id="disc"></div>

    <button id="btn-enviar" class="btn-enviar" onclick="enviar()">ENVIAR PARA O PAINEL DO JORGE</button>
</div>

<script>
    const perguntas = ["Protagonismo", "Responsabilidade", "Comunicação", "Ética", "Problemas", "Equipe", "Aprender"];
    const sapDiv = document.getElementById('sap');
    perguntas.forEach((p, i) => {
        sapDiv.innerHTML += `<div class="item"><span class="titulo">${i+1}. ${p}</span><input type="range" id="sap${i+1}" min="1" max="5" value="3" oninput="this.nextElementSibling.innerText = this.value"><span>3</span></div>`;
    });

    const palavras = [{p:"Direto", t:"D"}, {p:"Amigável", t:"I"}, {p:"Calmo", t:"S"}, {p:"Lógico", t:"C"}, {p:"Focado", t:"D"}, {p:"Alegre", t:"I"}, {p:"Paciente", t:"S"}, {p:"Cuidadoso", t:"C"}];
    const discDiv = document.getElementById('disc');
    palavras.forEach(item => {
        discDiv.innerHTML += `<button class="btn-disc" onclick="this.classList.toggle('selected')" data-t="${item.t}">${item.p}</button>`;
    });

    // FUNÇÃO PARA VOCÊ ENVIAR O LINK DO TESTE PARA OS JOVENS
    function compartilharLink() {
        const linkSite = window.location.href;
        const msg = `Olá! Aqui é o Educador Jorge. 🚀%0A%0A Por favor, preencha sua avaliação neste link: %0A${linkSite}`;
        window.open(`https://wa.me/?text=${msg}`, '_blank');
    }

    async function enviar() {
        const nome = document.getElementById('nome').value;
        const btn = document.getElementById('btn-enviar');
        if(!nome) return alert("Falta o nome!");

        const sel = document.querySelectorAll('.btn-disc.selected');
        let d=0, i=0, s=0, c=0;
        sel.forEach(b => { 
            let t = b.getAttribute('data-t');
            if(t=='D') d++; if(t=='I') i++; if(t=='S') s++; if(t=='C') c++;
        });
        const total = (d+i+s+c) || 1;
        const discStr = `${Math.round(d/total*100)}-${Math.round(i/total*100)}-${Math.round(s/total*100)}-${Math.round(c/total*100)}`;

        const dados = {
            nome: nome,
            sap1: document.getElementById('sap1').value, sap2: document.getElementById('sap2').value,
            sap3: document.getElementById('sap3').value, sap4: document.getElementById('sap4').value,
            sap5: document.getElementById('sap5').value, sap6: document.getElementById('sap6').value,
            sap7: document.getElementById('sap7').value,
            disc: discStr
        };

        const URL = "https://script.google.com/macros/s/AKfycbLGM8EKwurE1kSgeCMgzERR8g4lWh9yNFPSX7Er43tGUddzrBGRfYusKFU_DDdQomr/exec";

        try {
            btn.innerText = "ENVIANDO...";
            await fetch(URL, { method: 'POST', body: JSON.stringify(dados) });
            alert("Enviado para o Painel ADM com sucesso!");
            btn.innerText = "ENVIADO ✅";
        } catch (e) {
            alert("Erro ao enviar para o painel.");
            btn.innerText = "TENTAR NOVAMENTE";
        }
    }
</script>
</body>
</html>
