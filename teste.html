<!DOCTYPE html>
<html lang="pt-br">
<head>

    <style>

        .item { margin-bottom: 25px; padding: 15px; background: #21262d; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .titulo { color: #f1c40f; font-weight: bold; display: block; margin-bottom: 5px; }
        .desc { font-size: 0.8em; color: #8b949e; display: block; margin-bottom: 15px; }
        input[type="range"] { width: 100%; margin: 10px 0; -webkit-appearance: none; background: #30363d; height: 8px; border-radius: 5px; outline: none; }

        .nota-box { text-align: center; font-size: 1.5em; font-weight: bold; color: #58a6ff; margin-top: 10px; }
        .btn-enviar { width: 100%; padding: 20px; background: #238636; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 1.1em; cursor: pointer; margin-top: 30px; transition: background 0.3s; }
        .btn-enviar:hover { background: #2ea043; }
        .disc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .btn-disc { padding: 10px; border: 1px solid #30363d; background: #0d1117; color: white; cursor: pointer; border-radius: 5px; transition: 0.3s; }
        .btn-disc.selected { background: #238636; border-color: #2ea043; }
    </style>
</head>
