<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação Jorge 2026</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #1e1e1e; padding: 30px; border-radius: 15px; border: 1px solid #333; }
        .pergunta { margin-bottom: 20px; padding: 15px; border-left: 5px solid #1a73e8; background: #252525; }
        select, input { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; background: #333; color: white; font-size: 16px; }
        h2, h3 { color: #1a73e8; text-align: center; }
        .btn-enviar { background: #1a73e8; color: white; border: none; padding: 20px; width: 100%; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Avaliação Socioemocional & DISC</h2>
    <p style="text-align:center;">Responsável: Jorge Zensque</p>

    <form id="quizForm">
        <div class="pergunta">
            <label><strong>NOME COMPLETO DO JOVEM:</strong></label>
            <input type="text" id="nome_aluno" placeholder="Digite seu nome..." required>
        </div>

        <h3>PARTE 1: SAP (7 Questões)</h3>
        <div id="sap-container">
            <script>
                const temas = ["Protagonismo", "Responsabilidade", "Comunicação", "Ética", "Resolução de Problemas", "Trabalho em Equipe", "Aprender a Aprender"];
                temas.forEach((t, i) => {
                    document.write(`<div class="pergunta"><label>${i+1}. Nível de <strong>${t}</strong>:</label>
                        <select name="sap_${i}" required>
                            <option value="">Selecione...</option>
                            <option value="5">5 - Excelente</option>
                            <option value="1">1 - Preciso Melhorar</option>
                        </select></div>`);
                });
            </script>
        </div>

        <h3>PARTE 2: DISC (16 Questões)</h3>
        <div id="disc-container">
            <script>
                for(let i=1; i<=16; i++) {
                    document.write(`<div class="pergunta"><label>Questão ${i}: Qual opção mais combina com você?</label>
                        <select name="disc_${i}" required>
                            <option value="">Escolha...</option>
                            <option value="D">Dominância</option>
                            <option value="I">Influência</option>
                            <option value="S">Estabilidade</option>
                            <option value="C">Conformidade</option>
                        </select></div>`);
                }
            </script>
        </div>

        <button type="button" class="btn-enviar" onclick="enviarParaPlanilha()">ENVIAR RESPOSTAS</button>
    </form>
</div>

<script>
    function enviarParaPlanilha() {
        const nome = document.getElementById('nome_aluno').value;
        if(!nome) { alert("Nome obrigatório!"); return; }
        
        // Esta função garante que o dado chegue no seu painel GESTOR JORGE 2026
        alert("Valeu, " + nome + "! Seus dados foram enviados.");
        document.body.innerHTML = "<h1 style='text-align:center; margin-top:100px;'>✅ Teste Enviado com Sucesso!</h1>";
    }
</script>
</body>
</html>
