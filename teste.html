<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação de Competências - Jorge Zensque</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f9; color: #333; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); border-top: 10px solid #0056b3; }
        h2 { color: #0056b3; text-align: center; margin-bottom: 30px; }
        .pergunta-bloco { margin-bottom: 40px; padding: 20px; border: 1px solid #eee; border-radius: 10px; background-color: #fafafa; }
        .titulo-competencia { font-size: 1.2em; font-weight: bold; color: #0056b3; display: block; margin-bottom: 5px; text-transform: uppercase; }
        .descricao-apoio { font-size: 0.95em; color: #444; line-height: 1.5; margin-bottom: 10px; display: block; background: #eef2f7; padding: 12px; border-left: 4px solid #0056b3; }
        .evidencias-titulo { font-weight: bold; font-size: 0.85em; color: #0056b3; margin-top: 10px; display: block; }
        .evidencias-lista { font-size: 0.85em; color: #555; margin-bottom: 15px; display: block; line-height: 1.4; }
        .opcoes { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; background: white; padding: 10px; border-radius: 8px; }
        .opcao-item { text-align: center; flex: 1; }
        input[type="radio"] { width: 20px; height: 20px; cursor: pointer; }
        .label-escala { font-size: 0.8em; color: #777; display: block; margin-top: 5px; }
        input[type="text"] { width: 100%; padding: 12px; margin: 10px 0 25px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 1em; }
        button { width: 100%; padding: 15px; background-color: #0056b3; color: white; border: none; border-radius: 8px; font-size: 1.1em; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #003d80; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="tituloFase">AVALIAÇÃO DE COMPETÊNCIAS</h2>
    
    <div id="formIdentificacao">
        <label><b>DIGITE SEU NOME COMPLETO:</b></label>
        <input type="text" id="nomeParticipante" placeholder="Ex: João Silva">
        <button onclick="iniciarAvaliacao()">INICIAR AVALIAÇÃO</button>
    </div>

    <div id="questoes" style="display:none;">
        <p style="text-align: center; font-weight: bold; color: #d35400;">Escala de 1 (Mínimo) a 10 (Máximo)</p>
        <div id="listaPerguntas"></div>
        <button onclick="finalizar()">ENVIAR RESPOSTAS</button>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const etapa = urlParams.get('etapa') || 'I';
    document.getElementById('tituloFase').innerText = "AVALIAÇÃO DE COMPETÊNCIAS - ETAPA " + etapa;

    const COMPETENCIAS = [
        { 
            ref: "PROT", 
            titulo: "1- SER PROTAGONISTA", 
            desc: "É o jovem que se conscientiza de sua identidade, se reconhece como ser atuante, autônomo, solidário, participativo e construtor do seu destino. Consegue exercer ações de intervenção no contexto social, visando responder a problemas reais como sujeito principal.", 
            evidencias: "• Sou referência construtiva nos meus grupos;<br>• Construo meu Projeto de Vida (estudos, trabalho, vida pessoal);<br>• Reconheço meus potenciais e pontos a melhorar."
        },
        { 
            ref: "RESP", 
            titulo: "2- SER RESPONSÁVEL E COMPROMETIDO", 
            desc: "Comprometer-se com suas atividades, ser pontual e assíduo, cumprir o que é exigido, respeitar regras e normas de convivência, responsabilizando-se pelos acontecimentos e esforçando-se para obter bons resultados.", 
            evidencias: "• Cumpro tarefas e prazos;<br>• Sou pontual e assíduo (justifico faltas);<br>• Cumpro as regras do contrato de convivência."
        },
        { 
            ref: "COM", 
            titulo: "3- COMPREENDER CONTEXTOS E COMUNICAR-SE", 
            desc: "Capacidade de compreender o outro dentro de uma realidade histórica e cultural. Comunicar-se de forma clara e objetiva, repassando informações completas e tendo predisposição para ouvir e compreender mensagens.", 
            evidencias: "• Postura coerente com diferentes ambientes;<br>• Articulo pensamentos de forma ordenada (oral ou escrita);<br>• Presto atenção sem interferir e espero minha vez de falar."
        },
        { 
            ref: "CID", 
            titulo: "4- SER DEMOCRÁTICO, ÉTICO E CIDADÃO", 
            desc: "Possui valores e princípios que respeitam as diferenças e os direitos humanos. É uma pessoa honesta, confiável e que conhece seus direitos e deveres.", 
            evidencias: "• Sou honesto e ético nas relações;<br>• Assumo quando cometo erros;<br>• Respeito opiniões diferentes e sou capaz de mudar meu ponto de vista."
        },
        { 
            ref: "SOL", 
            titulo: "5- RESOLVER SITUAÇÕES-PROBLEMA", 
            desc: "Capacidade de entender e enfrentar um problema, pensando em alternativas de solução e tomando decisões. Capacidade de mudar, aprender, reconhecer erros e aceitar o novo.", 
            evidencias: "• Procuro resolver problemas sem fofocas ou terceiros;<br>• Penso antes de agir e me responsabilizo pelas escolhas;<br>• Reconheço meus sentimentos e sei lidar com eles."
        },
        { 
            ref: "EQUIP", 
            titulo: "6- TRABALHAR E PRODUZIR EM EQUIPE", 
            desc: "Capacidade de colaborar e partilhar, contribuindo para o crescimento do grupo, colocando os interesses coletivos acima dos pessoais e reconhecendo a importância de todos.", 
            evidencias: "• Penso no bem-estar do grupo e não só no meu;<br>• Busco o consenso nas atividades coletivas;<br>• Consigo receber críticas e sugestões sobre meu comportamento."
        },
        { 
            ref: "APR", 
            titulo: "7- APRENDER A APRENDER", 
            desc: "Habilidade para buscar, compreender e construir novos conhecimentos, colocando em prática aquilo que aprendeu ao longo da vida e em todos os espaços.", 
            evidencias: "• Construo novos conhecimentos a partir dos conteúdos;<br>• Tiro lições de situações boas ou ruins para minha vida;<br>• Questiono, indago e tenho curiosidade em ampliar meu ponto de vista."
        }
    ];

    function iniciarAvaliacao() {
        const nome = document.getElementById('nomeParticipante').value;
        if (nome.length < 3) return alert("Por favor, digite seu nome completo.");
        
        document.getElementById('formIdentificacao').style.display = 'none';
        const areaPerguntas = document.getElementById('questoes');
        areaPerguntas.style.display = 'block';

        const lista = document.getElementById('listaPerguntas');
        COMPETENCIAS.forEach((c) => {
            let htmlOpcoes = "";
            for(let i=1; i<=10; i++) {
                htmlOpcoes += `
                    <div class="opcao-item">
                        <input type="radio" name="${c.ref}" value="${i}">
                        <span class="label-escala">${i}</span>
                    </div>`;
            }

            lista.innerHTML += `
                <div class="pergunta-bloco">
                    <span class="titulo-competencia">${c.titulo}</span>
                    <span class="descricao-apoio">${c.desc}</span>
                    <span class="evidencias-titulo">EVIDÊNCIAS PARA OBSERVAR:</span>
                    <span class="evidencias-lista">${c.evidencias}</span>
                    <div class="opcoes">${htmlOpcoes}</div>
                </div>`;
        });
    }

    async function finalizar() {
        const nome = document.getElementById('nomeParticipante').value;
        const respostasSap = [];
        let todasRespondidas = true;

        COMPETENCIAS.forEach(c => {
            const r = document.querySelector(`input[name="${c.ref}"]:checked`);
            if (r) respostasSap.push(r.value);
            else todasRespondidas = false;
        });

        if (!todasRespondidas) return alert("Por favor, responda todas as competências!");

        const sapString = JSON.stringify(respostasSap);
        // Mantém o fluxo para o próximo passo do teste
        window.location.href = `disc.html?nome=${encodeURIComponent(nome)}&sap=${sapString}&etapa=${etapa}`;
    }
</script>

</body>
</html>
