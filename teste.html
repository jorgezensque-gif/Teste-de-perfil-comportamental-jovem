<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Avaliação DISC & SAP</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .container { background: #1e293b; padding: 30px; border-radius: 15px; max-width: 500px; margin: auto; border-top: 5px solid #38bdf8; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; background: #334155; color: white; border: none; border-radius: 8px; cursor: pointer; text-align: left; font-size: 16px; }
        .btn:hover { background: #38bdf8; color: #000; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container" id="box">
        <h2 id="pergunta">Carregando...</h2>
        <div id="opcoes"></div>
    </div>

<script>
    const config = { databaseURL: "https://perfil-jovem--disc-default-rtdb.firebaseio.com" };
    firebase.initializeApp(config);
    const db = firebase.database();
    const nome = new URLSearchParams(window.location.search).get('nome');

    // Validação de acesso único e segurança
    db.ref('resultados/' + nome).once('value', snap => {
        if (!snap.exists()) {
            document.body.innerHTML = "<h1>❌ Link inválido ou expirado.</h1>";
        } else if (snap.val().status === "Finalizado") {
            document.body.innerHTML = "<h1>❌ Esta avaliação já foi concluída.</h1>";
        } else {
            iniciar();
        }
    });

    const perguntas = [
        { q: "Como prefere atuar em projetos?", o: ["Liderar","Motivar","Paciência","Técnica"], v: ["D","I","S","C"], t: "D" },
        { q: "Sua principal força é:", o: ["Resultados","Relacionamento","Harmonia","Qualidade"], v: ["D","I","S","C"], t: "D" },
        { q: "Protagonismo (1 a 5)", o: ["1","2","3","4","5"], v:[1,2,3,4,5], t:"S", s:0 },
        { q: "Responsabilidade (1 a 5)", o: ["1","2","3","4","5"], v:[1,2,3,4,5], t:"S", s:1 },
        { q: "Comunicação (1 a 5)", o: ["1","2","3","4","5"], v:[1,2,3,4,5], t:"S", s:2 },
        { q: "Ética (1 a 5)", o: ["1","2","3","4","5"], v:[1,2,3,4,5], t:"S", s:3 },
        { q: "Resolução de Problemas (1 a 5)", o: ["1","2","3","4","5"], v:[1,2,3,4,5], t:"S", s:4 },
        { q: "Trabalho em Equipe (1 a 5)", o: ["1","2","3","4","5"], v:[1,2,3,4,5], t:"S", s:5 },
        { q: "Desejo de Aprender (1 a 5)", o: ["1","2","3","4","5"], v:[1,2,3,4,5], t:"S", s:6 }
    ];

    let atual = 0, d_pt = {D:0,I:0,S:0,C:0}, s_pt = [0,0,0,0,0,0,0];

    function iniciar() {
        if(atual >= perguntas.length) return finalizar();
        const p = perguntas[atual];
        document.getElementById('pergunta').innerText = p.q;
        const div = document.getElementById('opcoes'); div.innerHTML = "";
        p.o.forEach((txt, idx) => {
            const b = document.createElement('button'); b.className = "btn"; b.innerText = txt;
            b.onclick = () => {
                if(p.t === "D") d_pt[p.v[idx]]++; else s_pt[p.s] = p.v[idx];
                atual++; iniciar();
            };
            div.appendChild(b);
        });
    }

    function finalizar() {
        // GRAVAÇÃO BLINDADA: Atualiza o registro do Jorge com os pontos finais
        db.ref('resultados/' + nome).update({
            pontosDISC: d_pt,
            pontosSAP: s_pt,
            status: "Finalizado"
        }).then(() => {
            document.getElementById('box').innerHTML = "<h1>✅ Concluído!</h1><p>Jorge já pode ver seus resultados no painel.</p>";
        });
    }
</script>
</body>
</html>
