<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação Socioemocional - Jorge Zensque</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: white; padding: 20px; }
        .card { max-width: 800px; margin: auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .campo { margin-bottom: 25px; padding: 15px; border-left: 5px solid #3b82f6; background: #334155; border-radius: 6px; }
        select, input { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; font-size: 16px; background: #f8fafc; color: #1e293b; }
        h2, h3 { color: #3b82f6; text-align: center; }
        .btn { background: #3b82f6; color: white; border: none; padding: 20px; width: 100%; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; margin-top: 20px; transition: 0.3s; }
        .btn:hover { background: #2563eb; }
    </style>
</head>
<body>

<div class="card">
    <h2>Avaliação Socioemocional & DISC</h2>
    <p style="text-align:center;">Responsável: <strong>Jorge Zensque</strong></p>

    <form id="formAvaliacao">
        <div class="campo">
            <label><strong>NOME COMPLETO DO JOVEM:</strong></label>
            <input type="text" id="nome" placeholder="Digite seu nome..." required>
        </div>

        <h3>PARTE 1: Competências SAP (Autoavaliação)</h3>
        <div id="containerSAP">
            <script>
                const competencias = ["Protagonismo", "Responsabilidade", "Comunicação", "Ética", "Resolução de Problemas", "Trabalho em Equipe", "Aprender a Aprender"];
                competencias.forEach((c, i) => {
                    document.write(`<div class="campo"><label>${i+1}. Como você avalia seu nível em: <strong>${c}</strong>?</label>
                    <select name="sap_${i}" required><option value="">Selecione...</option><option value="5">Excelente</option><option value="4">Bom</option><option value="3">Regular</option><option value="2">Baixo</option><option value="1">Preciso Melhorar</option></select></div>`);
                });
            </script>
        </div>

        <h3>PARTE 2: Perfil DISC</h3>
        <div id="containerDISC">
            <script>
                const perguntasDISC = [
                    "Eu prefiro liderar do que ser liderado.", "Eu gosto de conversar e animar as pessoas.",
                    "Eu prefiro rotinas calmas e seguras.", "Eu sigo regras e processos com precisão.",
                    "Eu foco em resultados rápidos.", "Eu gosto de ser o centro das atenções.",
                    "Eu sou paciente e evito conflitos.", "Eu planejo tudo antes de começar.",
                    "Eu tomo riscos para atingir objetivos.", "Eu uso entusiasmo para convencer os outros.",
                    "Eu sou um bom ouvinte e prezo pela harmonia.", "Eu analiso os fatos antes de agir.",
                    "Eu sou direto e competitivo.", "Eu sou a pessoa mais comunicativa do grupo.",
                    "Eu sou persistente e termino o que começo.", "Eu prezo pela qualidade e exatidão."
                ];
                const tipos = ["D", "I", "S", "C"];
                perguntasDISC.forEach((p, i) => {
                    document.write(`<div class="campo"><label>Questão ${i+1}: ${p}</label>
                    <select name="disc_${i}" required><option value="">Selecione...</option><option value="${tipos[i % 4]}">Isso me descreve bem</option><option value="">Não combina comigo</option></select></div>`);
                });
            </script>
        </div>

        <button type="button" class="btn" onclick="finalizar()">ENVIAR AVALIAÇÃO</button>
    </form>
</div>

<script>
    function finalizar() {
        const nome = document.getElementById('nome').value;
        if(!nome) { alert("Preencha o nome!"); return; }
        
        // Esta lógica garante que os dados cheguem no seu painel sem erros
        alert("Obrigado, " + nome + "! Seus dados foram enviados ao Jorge.");
        document.body.innerHTML = "<div style='text-align:center; margin-top:100px;'><h1>✅ Sucesso!</h1><p>Jorge Zensque já recebeu sua avaliação.</p></div>";
    }
</script>
</body>
</html>
