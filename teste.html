<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Avaliação SAP & DISC - Projeto Pescar</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .container { background: #1e293b; padding: 30px; border-radius: 15px; max-width: 700px; margin: auto; border-top: 6px solid #38bdf8; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        
        /* Estilo fiel ao PDF */
        .titulo-sap { color: #38bdf8; font-size: 1.4em; font-weight: bold; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 15px; text-transform: uppercase; }
        .definicao { background: #334155; padding: 15px; border-radius: 8px; font-size: 0.95em; margin-bottom: 20px; color: #f1f5f9; }
        .evidencias-titulo { font-weight: bold; color: #38bdf8; margin-bottom: 10px; display: block; text-transform: uppercase; font-size: 0.85em; }
        .evidencias-lista { background: #0f172a; padding: 20px; border-radius: 8px; margin-bottom: 25px; border-left: 4px solid #38bdf8; }
        .evidencia-item { display: flex; align-items: flex-start; margin-bottom: 8px; font-size: 0.9em; }
        .check { margin-right: 10px; color: #38bdf8; }

        /* Botões de Notas */
        .grade-notas { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
        .btn-nota { flex: 1; padding: 15px; background: #1e293b; border: 2px solid #38bdf8; color: white; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; }
        .btn-nota:hover { background: #38bdf8; color: #0f172a; transform: translateY(-3px); }
        
        .progresso { color: #94a3b8; font-size: 0.8em; margin-bottom: 5px; display: block; text-align: right; }
    </style>
</head>
<body>
    <div class="container" id="box">
        <span class="progresso" id="prog">Carregando...</span>
        <div id="conteudo-quest">
            <div id="titulo" class="titulo-sap"></div>
            <div id="desc" class="definicao"></div>
            <span class="evidencias-titulo" id="label-evid"></span>
            <div id="evid" class="evidencias-lista"></div>
            <p style="text-align:center; font-weight:bold; color:#94a3b8;">Sua Autoavaliação (Nota de 1 a 5):</p>
            <div class="grade-notas" id="opcoes"></div>
        </div>
    </div>

<script>
    const config = { databaseURL: "https://perfil-jovem--disc-default-rtdb.firebaseio.com" };
    firebase.initializeApp(config);
    const db = firebase.database();
    const nome = new URLSearchParams(window.location.search).get('nome');

    db.ref('resultados/' + nome).once('value', snap => {
        if (!snap.exists()) { document.body.innerHTML = "<h1>❌ Link Inválido.</h1>"; }
        else if (snap.val().status === "Finalizado") { document.body.innerHTML = "<h1>❌ Avaliação já concluída.</h1>"; }
        else { iniciar(); }
    });

    const perguntas = [
        // --- 7 COMPETÊNCIAS SAP (IGUAL AO PDF) ---
        { 
            t: "1-SER PROTAGONISTA", 
            d: "Protagonista é o jovem que se conscientiza de sua identidade, se reconhece como ser atuante, autônomo, solidário, participativo e construtor do seu destino.", 
            e: ["Sou visto como referência construtiva nos meus grupos.","Respeito e me faço respeitar no grupo.","Construo meu Projeto de Vida (estudos, trabalho, pessoal).","Reconheço minhas preferências, potenciais e pontos a melhorar."],
            tp: "S", idx: 0 
        },
        { 
            t: "2-SER RESPONSÁVEL E COMPROMETIDO", 
            d: "Comprometer-se com suas atividades, ser pontual e assíduo, cumprir o que é exigido, respeitar regras e normas de convivência.", 
            e: ["Sou pontual e assíduo.","Cumpro prazos e combinados.","Responsabilizo-me pelos meus atos e acontecimentos.","Esforço-me para obter bons resultados."],
            tp: "S", idx: 1 
        },
        { 
            t: "3-COMUNICAR-SE COM CLAREZA E ASSERTIVIDADE", 
            d: "Expressar ideias, opiniões e sentimentos de forma clara, ouvindo o outro com atenção e respeito.", 
            e: ["Expresso opiniões sem ofender os outros.","Escuto atentamente o que me é comunicado.","Utilizo vocabulário adequado aos ambientes.","Sou claro ao transmitir informações."],
            tp: "S", idx: 2 
        },
        { 
            t: "4-AGIR COM ÉTICA", 
            d: "Agir com base em valores que respeitam o bem comum, a dignidade humana e o respeito mútuo.", 
            e: ["Sou honesto em minhas intenções e atitudes.","Respeito a diversidade humana e as diferenças.","Preservo o patrimônio coletivo e o meio ambiente.","Tenho atitudes coerentes com o que digo."],
            tp: "S", idx: 3 
        },
        { 
            t: "5-RESOLVER PROBLEMAS E TOMAR DECISÕES", 
            d: "Capacidade de identificar problemas, propor soluções criativas e lidar com sentimentos diante de desafios.", 
            e: ["Analiso situações antes de agir.","Proponho soluções viáveis para os problemas.","Não me envergonho de pedir ajuda quando necessário.","Sei lidar com meus sentimentos e incertezas."],
            tp: "S", idx: 4 
        },
        { 
            t: "6-TRABALHAR E PRODUZIR EM EQUIPE", 
            d: "Capacidade de colaborar e partilhar, colocando os interesses do grupo acima dos interesses pessoais.", 
            e: ["Penso no bem-estar do grupo e não só no meu.","Busco o consenso nas atividades coletivas.","Consigo receber críticas e sugestões.","Transmito com fidelidade o que me é comunicado."],
            tp: "S", idx: 5 
        },
        { 
            t: "7-APRENDER A APRENDER", 
            d: "Habilidade para buscar, compreender e construir novos conhecimentos, colocando-os em prática.", 
            e: ["Busco novos conhecimentos além do básico.","Tenho comprometimento com meu processo de aprendizagem.","Consigo tirar lições de situações boas ou ruins.","Mostro-me disposto a ampliar meu ponto de vista."],
            tp: "S", idx: 6 
        }
    ];

    let atual = 0, s_pt = [0,0,0,0,0,0,0], d_pt = {D:4,I:4,S:4,C:4}; // DISC fixo para focar no SAP agora

    function iniciar() {
        if(atual >= perguntas.length) return finalizar();
        const p = perguntas[atual];
        
        document.getElementById('prog').innerText = `COMPETÊNCIA ${atual + 1} DE ${perguntas.length}`;
        document.getElementById('titulo').innerText = p.t;
        document.getElementById('desc').innerText = p.d;
        document.getElementById('label-evid').innerText = "EVIDÊNCIAS NORTEADORAS:";
        
        const evidDiv = document.getElementById('evid');
        evidDiv.innerHTML = "";
        p.e.forEach(texto => {
            evidDiv.innerHTML += `<div class="evidencia-item"><span class="check">☐</span><span>${texto}</span></div>`;
        });
        
        const optDiv = document.getElementById('opcoes');
        optDiv.innerHTML = "";
        [1,2,3,4,5].forEach(num => {
            const btn = document.createElement('button');
            btn.className = "btn-nota";
            btn.innerText = num;
            btn.onclick = () => { s_pt[p.idx] = num; atual++; iniciar(); window.scrollTo(0,0); };
            optDiv.appendChild(btn);
        });
    }

    function finalizar() {
        db.ref('resultados/' + nome).update({
            pontosDISC: d_pt, pontosSAP: s_pt, status: "Finalizado"
        }).then(() => {
            document.getElementById('box').innerHTML = "<h1 style='color:#38bdf8'>✅ Avaliação Enviada!</h1><p>Obrigado! Jorge já pode analisar seus resultados.</p>";
        });
    }
</script>
</body>
</html>
