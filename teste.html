<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação SAP & DISC - Jorge Zensque</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .quiz-container { background: #1e293b; padding: 30px; border-radius: 15px; max-width: 600px; width: 100%; box-shadow: 0 10px 20px rgba(0,0,0,0.5); border-top: 5px solid #38bdf8; }
        .opcoes { display: grid; gap: 10px; margin-top: 20px; }
        button { background: #334155; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; text-align: left; font-size: 16px; }
        button:hover { background: #38bdf8; color: #0f172a; }
        .progresso { height: 10px; background: #0f172a; border-radius: 5px; margin-bottom: 20px; overflow: hidden; }
        .barra { height: 100%; background: #22c55e; width: 0%; transition: 0.3s; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="progresso"><div class="barra" id="barra"></div></div>
    <div id="conteudo">
        <h2 id="pergunta">Carregando...</h2>
        <div id="opcoes" class="opcoes"></div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://perfil-jovem--disc-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const params = new URLSearchParams(window.location.search);
    const nomeAluno = params.get('nome') || "Aluno Teste";

    const perguntas = [
        // DISC
        { q: "1. Em uma equipe, você prefere:", o: ["Comandar e decidir", "Interagir e motivar", "Apoiar e colaborar", "Organizar e analisar"], v: ["D","I","S","C"], t: "DISC" },
        { q: "2. Seu maior foco é em:", o: ["Resultados rápidos", "Pessoas e contatos", "Estabilidade e calma", "Regras e precisão"], v: ["D","I","S","C"], t: "DISC" },
        { q: "3. Como você reage a mudanças?", o: ["Gosto e tomo a frente", "Fico entusiasmado", "Tenho cautela", "Analiso os riscos"], v: ["D","I","S","C"], t: "DISC" },
        { q: "4. Sua comunicação é mais:", o: ["Direta e objetiva", "Aberta e persuasiva", "Paciente e ouvinte", "Formal e detalhada"], v: ["D","I","S","C"], t: "DISC" },
        { q: "5. O que mais te motiva?", o: ["Vencer desafios", "Ser reconhecido", "Ter segurança", "Fazer o certo"], v: ["D","I","S","C"], t: "DISC" },
        { q: "6. Sob pressão, você tende a ser:", o: ["Exigente/Agressivo", "Emocional/Impulsivo", "Resistente/Calado", "Crítico/Perfeccionista"], v: ["D","I","S","C"], t: "DISC" },
        { q: "7. Você se sente melhor em ambientes:", o: ["Competitivos", "Descontraídos", "Previsíveis", "Estruturados"], v: ["D","I","S","C"], t: "DISC" },
        { q: "8. Para você, o erro é:", o: ["Algo a ser superado logo", "Uma falha social", "Algo que gera insegurança", "Uma falta de cuidado"], v: ["D","I","S","C"], t: "DISC" },
        // SAP (Socioemocionais - Notas de 1 a 5)
        { q: "9. Você consegue manter a calma em situações difíceis?", o: ["Raramente", "Às vezes", "Quase sempre", "Sempre"], v: [1,2,4,5], t: "SAP", idx: 0 },
        { q: "10. Você termina todas as tarefas que começa?", o: ["Raramente", "Às vezes", "Quase sempre", "Sempre"], v: [1,2,4,5], t: "SAP", idx: 1 },
        { q: "11. Você costuma planejar seu dia com antecedência?", o: ["Raramente", "Às vezes", "Quase sempre", "Sempre"], v: [1,2,4,5], t: "SAP", idx: 2 },
        { q: "12. Você se sente confiante ao falar em público?", o: ["Raramente", "Às vezes", "Quase sempre", "Sempre"], v: [1,2,4,5], t: "SAP", idx: 3 },
        { q: "13. Você busca aprender coisas novas por conta própria?", o: ["Raramente", "Às vezes", "Quase sempre", "Sempre"], v: [1,2,4,5], t: "SAP", idx: 4 },
        { q: "14. Você se preocupa com os sentimentos dos outros?", o: ["Raramente", "Às vezes", "Quase sempre", "Sempre"], v: [1,2,4,5], t: "SAP", idx: 5 },
        { q: "15. Você perdoa facilmente quando alguém erra com você?", o: ["Raramente", "Às vezes", "Quase sempre", "Sempre"], v: [1,2,4,5], t: "SAP", idx: 6 },
        { q: "16. Você organiza seu espaço antes de estudar ou trabalhar?", o: ["Raramente", "Às vezes", "Quase sempre", "Sempre"], v: [1,2,4,5], t: "SAP", idx: 0 }
    ];

    let atual = 0;
    let disc = { D:0, I:0, S:0, C:0 };
    let sap = [0,0,0,0,0,0,0];

    function mostrar() {
        if(atual >= perguntas.length) return salvar();
        const p = perguntas[atual];
        document.getElementById('pergunta').innerText = p.q;
        const opts = document.getElementById('opcoes');
        opts.innerHTML = "";
        p.o.forEach((texto, i) => {
            const btn = document.createElement('button');
            btn.innerText = texto;
            btn.onclick = () => {
                if(p.t === "DISC") disc[p.v[i]]++;
                else sap[p.idx] += p.v[i];
                atual++;
                mostrar();
            };
            opts.appendChild(btn);
        });
        document.getElementById('barra').style.width = (atual / perguntas.length * 100) + "%";
    }

    function salvar() {
        const dados = { nome: nomeAluno, data: new Date().toLocaleDateString(), pontosDISC: disc, pontosSAP: sap };
        db.ref('resultados').push(dados).then(() => {
            document.getElementById('conteudo').innerHTML = "<h2>✅ Teste Concluído!</h2><p>Jorge, os dados já foram enviados para o seu painel.</p>";
        });
    }
    mostrar();
</script>
</body>
</html>
