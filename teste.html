<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Teste de Perfil Comportamental - Jorge 2026</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #121212; color: white; }
        .quiz-container { max-width: 800px; margin: auto; background: #1e1e1e; padding: 30px; border-radius: 15px; }
        .pergunta { margin-bottom: 25px; padding: 15px; border-bottom: 1px solid #333; }
        input[type="text"] { width: 100%; padding: 10px; margin-top: 10px; border-radius: 5px; border: none; }
        button { background: #1a73e8; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

<div class="quiz-container">
    <h2>Avaliação Socioemocional & DISC</h2>
    <p>Jorge 2026 - Responda com sinceridade todas as questões.</p>

    <form id="formTeste">
        <div class="pergunta">
            <label><strong>NOME COMPLETO DO JOVEM:</strong></label>
            <input type="text" id="nome" placeholder="Digite seu nome aqui..." required>
        </div>

        <div id="perguntasSAP">
            <h3>Parte 1: Autoavaliação SAP</h3>
            </div>

        <div id="perguntasDISC">
            <h3>Parte 2: Perfil Comportamental DISC</h3>
            </div>

        <button type="button" onclick="enviarDados()">ENVIAR RESPOSTAS PARA O JORGE</button>
    </form>
</div>

<script>
    function enviarDados() {
        const nome = document.getElementById('nome').value;
        if(!nome) { alert("Por favor, preencha seu nome!"); return; }

        // AQUI FICA A LÓGICA DE CÁLCULO QUE ENVIA PARA O SEU PAINEL DE RESULTADOS
        // Captura todas as respostas, faz a média e manda para sua planilha/banco
        
        alert("Obrigado, " + nome + "! Suas respostas foram enviadas ao Jorge.");
        
        // Finalização: O link expira visualmente para o aluno
        document.body.innerHTML = "<div style='text-align:center; padding-top:100px;'><h1>✅ Teste Finalizado!</h1><p>Seus dados foram processados com sucesso.</p></div>";
    }
</script>
</body>
</html>
