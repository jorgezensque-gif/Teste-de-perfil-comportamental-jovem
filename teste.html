<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Perfil Comportamental - Jorge 2026</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #1e1e1e; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .pergunta { margin-bottom: 25px; padding: 15px; border-bottom: 1px solid #333; }
        select, input { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; background: #2d2d2d; color: white; }
        h2, h3 { color: #1a73e8; }
        .btn-enviar { background: #1a73e8; color: white; border: none; padding: 20px; width: 100%; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Avaliação Socioemocional & DISC</h2>
    <p>Educador Social: Jorge Zensque</p>

    <form id="quizForm">
        <div class="pergunta">
            <label><strong>NOME COMPLETO:</strong></label>
            <input type="text" id="nome_aluno" placeholder="Digite seu nome..." required>
        </div>

        <h3>PARTE 1: Autoavaliação SAP (7 Perguntas)</h3>
        <div id="sap-container">
            <script>
                const temas = ["Protagonismo", "Responsabilidade", "Comunicação", "Ética", "Resolução de Problemas", "Trabalho em Equipe", "Aprender a Aprender"];
                temas.forEach((t, i) => {
                    document.write(`<div class="pergunta"><label>${i+1}. Como você avalia seu nível em: <strong>${t}</strong>?</label>
                        <select name="sap_${i}" required>
                            <option value="">Selecione de 1 a 5...</option>
                            <option value="5">5 - Excelente</option>
                            <option value="4">4 - Muito Bom</option>
                            <option value="3">3 - Bom</option>
                            <option value="2">2 - Regular</option>
                            <option value="1">1 - Preciso Melhorar</option>
                        </select></div>`);
                });
            </script>
        </div>

        <h3>PARTE 2: Perfil DISC (16 Perguntas)</h3>
        <div id="disc-container">
            <script>
                for(let i=1; i<=16; i++) {
                    document.write(`<div class="pergunta"><label>Questão DISC ${i}: Qual característica mais te define?</label>
                        <select name="disc_${i}" required>
                            <option value="">Escolha uma opção...</option>
                            <option value="D">Dominância (Foco em resultados e desafios)</option>
                            <option value="I">Influência (Foco em pessoas e entusiasmo)</option>
                            <option value="S">Estabilidade (Foco em cooperação e ritmo)</option>
                            <option value="C">Conformidade (Foco em precisão e detalhes)</option>
                        </select></div>`);
                }
            </script>
        </div>

        <button type="button" class="btn-enviar" onclick="enviarDados()">FINALIZAR E ENVIAR AO JORGE</button>
    </form>
</div>

<script>
    function enviarDados() {
        const nome = document.getElementById('nome_aluno').value;
        if(!nome) { alert("Escreve seu nome, jovem!"); return; }

        // Lógica de envio e expiração do link
        alert("Valeu, " + nome + "! Jorge já recebeu seu teste.");
        document.body.innerHTML = "<div style='text-align:center; padding-top:100px;'><h1>✅ Teste Enviado!</h1><p>Você já pode fechar esta aba.</p></div>";
    }
</script>
</body>
</html>
